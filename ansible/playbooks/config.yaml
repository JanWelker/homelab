---
- name: Generate Configurations
  hosts: k8s_nodes
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ playbook_dir }}/../../output"
    # One template per environment, one Ignition config per template.
    ignition_configs:
      - template: butane_node_config
        suffix: ""
      - template: butane_installer_config
        suffix: "-install"
  tasks:
    - name: Ensure credentials directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../output/credentials"
        state: directory
        mode: "0700"
      run_once: true # noqa: run-once
      delegate_to: localhost

    - name: Generate Kubeadm Token
      ansible.builtin.set_fact:
        kubeadm_token: "{{ token_id }}.{{ token_secret }}"
      vars:
        token_id: "{{ lookup('password', playbook_dir + '/../../output/credentials/kubeadm_token_id length=6 chars=abcdefghijklmnopqrstuvwxyz0123456789') }}"
        token_secret: >-
          {{ lookup('password', playbook_dir + '/../../output/credentials/kubeadm_token_secret length=16 chars=abcdefghijklmnopqrstuvwxyz0123456789') }}
      run_once: true # noqa: run-once
      delegate_to: localhost

    - name: Generate Certificate Key
      ansible.builtin.set_fact:
        certificate_key: "{{ lookup('password', playbook_dir + '/../../output/credentials/certificate_key length=64 chars=0123456789abcdef') }}"
      run_once: true # noqa: run-once
      delegate_to: localhost

    # The lookup re-reads the existing file, so re-running keeps etcd readable.
    - name: Generate Secrets Encryption Key
      ansible.builtin.set_fact:
        encryption_key: >-
          {{ lookup('password', playbook_dir + '/../../output/credentials/encryption_key length=32 chars=ascii_letters,digits') | b64encode }}
      run_once: true # noqa: run-once
      delegate_to: localhost

    - name: Set Cluster Facts
      ansible.builtin.set_fact:
        kubeadm_token: "{{ kubeadm_token }}"
        certificate_key: "{{ certificate_key }}"
        encryption_key: "{{ encryption_key }}"
        control_plane_endpoint: "{{ control_plane_vip }}:6443"

    - name: Create output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ output_dir }}"
        - "{{ output_dir }}/http"
        - "{{ output_dir }}/tftp"
        - "{{ output_dir }}/tftp/pxelinux.cfg"

    - name: Ensure tmp kubeadm directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}/tmp/kubeadm"
        state: directory
        mode: "0755"

    - name: Generate Kubeadm Config (Verification only, injected into Ignition)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kubeadm.yaml.j2" # noqa: no-relative-paths
        dest: "{{ output_dir }}/tmp/kubeadm/kubeadm-config-{{ inventory_hostname }}.yaml"
        mode: "0755"

    - name: Ensure tmp butane directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}/tmp/butane"
        state: directory
        mode: "0755"

    - name: Generate Butane Configs
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/{{ item.template }}.yaml.j2" # noqa: no-relative-paths
        dest: "{{ output_dir }}/tmp/butane/butane-{{ inventory_hostname }}{{ item.suffix }}.yaml"
        mode: "0755"
      loop: "{{ ignition_configs }}"
      loop_control:
        label: "{{ inventory_hostname }}{{ item.suffix }}"

    - name: Transpile Butane to Ignition
      ansible.builtin.command:
        cmd: >-
          butane --pretty --strict
          {{ output_dir }}/tmp/butane/butane-{{ inventory_hostname }}{{ item.suffix }}.yaml
          -o {{ output_dir }}/http/ignition-{{ inventory_hostname }}{{ item.suffix }}.json
      loop: "{{ ignition_configs }}"
      loop_control:
        label: "{{ inventory_hostname }}{{ item.suffix }}"
      changed_when: true

    - name: Generate PXE Config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/pxe_config.j2" # noqa: no-relative-paths
        dest: "{{ output_dir }}/tftp/pxelinux.cfg/01-{{ mac_address | replace(':', '-') }}"
        mode: "0755"
