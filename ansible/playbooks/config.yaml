---
- name: Generate Configurations
  hosts: k8s_nodes
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ playbook_dir }}/../../output"
  tasks:
    - name: Ensure credentials directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../output/credentials"
        state: directory
        mode: "0700"
      run_once: true # noqa: run-once
      delegate_to: localhost

    - name: Generate Kubeadm Token
      ansible.builtin.set_fact:
        kubeadm_token: "{{ token_id }}.{{ token_secret }}"
      vars:
        token_id: "{{ lookup('password', playbook_dir + '/../../output/credentials/kubeadm_token_id length=6 chars=abcdefghijklmnopqrstuvwxyz0123456789') }}"
        token_secret: >-
          {{ lookup('password', playbook_dir + '/../../output/credentials/kubeadm_token_secret length=16 chars=abcdefghijklmnopqrstuvwxyz0123456789') }}
      run_once: true # noqa: run-once
      delegate_to: localhost

    - name: Generate Certificate Key
      ansible.builtin.set_fact:
        certificate_key: "{{ lookup('password', playbook_dir + '/../../output/credentials/certificate_key length=64 chars=0123456789abcdef') }}"
      run_once: true # noqa: run-once
      delegate_to: localhost

    # secretbox wants a 32 byte key, base64 encoded. Every control-plane node
    # gets the same one, otherwise a Secret written through one API server
    # cannot be decrypted by another. Like the token and certificate key above,
    # the password lookup reads an existing file back rather than regenerating,
    # so re-running `make config` does not invalidate what is already in etcd.
    - name: Generate Secrets Encryption Key
      ansible.builtin.set_fact:
        encryption_key: >-
          {{ lookup('password', playbook_dir + '/../../output/credentials/encryption_key length=32 chars=ascii_letters,digits') | b64encode }}
      run_once: true # noqa: run-once
      delegate_to: localhost

    - name: Set Cluster Facts
      ansible.builtin.set_fact:
        kubeadm_token: "{{ kubeadm_token }}"
        certificate_key: "{{ certificate_key }}"
        encryption_key: "{{ encryption_key }}"
        control_plane_endpoint: "{{ control_plane_vip }}:6443"

    - name: Create output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ output_dir }}"
        - "{{ output_dir }}/http"
        - "{{ output_dir }}/tftp"
        - "{{ output_dir }}/tftp/pxelinux.cfg"

    - name: Ensure tmp kubeadm directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}/tmp/kubeadm"
        state: directory
        mode: "0755"

    - name: Generate Kubeadm Config (Verification only, injected into Ignition)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kubeadm.yaml.j2" # noqa: no-relative-paths
        dest: "{{ output_dir }}/tmp/kubeadm/kubeadm-config-{{ inventory_hostname }}.yaml"
        mode: "0755"

    - name: Ensure tmp butane directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}/tmp/butane"
        state: directory
        mode: "0755"

    # Everything below generates a file in output/ and is a plain task rather
    # than a handler. Handlers only fire when the task that notifies them
    # reports `changed`, which means a settled config regenerated nothing -- and
    # a file deleted, edited by `make reinstall`, or truncated by a full disk
    # stayed that way, because the Butane template it depended on had not moved.
    # `make config` has to be the thing that puts output/ back, so these run
    # every time.
    - name: Generate Butane Config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/butane_config.yaml.j2" # noqa: no-relative-paths
        dest: "{{ output_dir }}/tmp/butane/butane-{{ inventory_hostname }}.yaml"
        mode: "0755"
      register: butane_config

    # butane is a command, so it cannot report its own idempotence. Transpiling
    # only when the input moved or the output is missing keeps `make config`
    # honest about what it changed, without letting a missing Ignition config
    # survive the run.
    - name: Check for an existing Ignition config
      ansible.builtin.stat:
        path: "{{ output_dir }}/http/ignition-{{ inventory_hostname }}.json"
      register: ignition_config

    - name: Transpile Butane to Ignition
      ansible.builtin.command:
        cmd: >-
          butane --pretty --strict {{ output_dir }}/tmp/butane/butane-{{ inventory_hostname }}.yaml
          -o {{ output_dir }}/http/ignition-{{ inventory_hostname }}.json
      when: butane_config.changed or not ignition_config.stat.exists
      changed_when: true

    # A plain template, so it is idempotent on its own and costs nothing to run
    # every time. This is also what makes `make config` undo `make reinstall`:
    # the file goes back to DEFAULT localboot whether or not anything else moved.
    - name: Generate PXE Config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/pxe_config.j2" # noqa: no-relative-paths
        dest: "{{ output_dir }}/tftp/pxelinux.cfg/01-{{ mac_address | replace(':', '-') }}"
        mode: "0755"
