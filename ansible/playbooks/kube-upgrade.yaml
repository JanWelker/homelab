---
# Moves the control plane to the Kubernetes version its nodes booted. sysupdate
# or a minor reprovision swaps the kubelet and kubeadm binaries at a reboot;
# the static pods keep the old images until kubeadm upgrades them. See
# docs/operations/upgrades.md#patch-releases and
# docs/operations/upgrades.md#upgrading-a-minor-version-deliberately
- name: Check the control planes against the stored cluster version
  hosts: control_plane
  gather_facts: false
  any_errors_fatal: true
  vars:
    allow_minor: false
  tasks:
    - name: Read the kubeadm version the sysext merged at boot
      ansible.builtin.raw: kubeadm version -o short
      register: kubeadm_version
      changed_when: false

    - name: Read the version kubeadm upgrade apply stored
      ansible.builtin.raw: >-
        sudo kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get configmap kubeadm-config
        -o jsonpath='{.data.ClusterConfiguration}' | sed -n 's/^kubernetesVersion: //p'
      register: stored_version
      changed_when: false
      run_once: true # noqa: run-once

    - name: Refuse a skipped minor, a stale node or a downgrade
      vars:
        versions: "{{ ansible_play_hosts | map('extract', hostvars, ['kubeadm_version', 'stdout']) | map('trim') | unique }}"
        target: "{{ versions | first }}"
        stored: "{{ stored_version.stdout | trim }}"
        next_minor: "{{ stored.split('.')[0] }}.{{ stored.split('.')[1] | int + 1 }}"
      ansible.builtin.assert:
        that:
          - versions | length == 1
          - >-
            target.split('.')[:2] == stored.split('.')[:2]
            or (allow_minor | bool and target.split('.')[:2] | join('.') == next_minor)
          - target[1:] is version(stored[1:], '>=')
        fail_msg: >-
          The control planes run kubeadm {{ versions | join(', ') }} against a
          cluster stored at {{ stored }}. Each must have rebooted onto the same
          patch of that minor, or with ALLOW_MINOR=1 the next minor, first; see
          docs/operations/upgrades.md.
        quiet: true
      run_once: true # noqa: run-once

    - name: Remember the target
      ansible.builtin.set_fact:
        kube_target: "{{ kubeadm_version.stdout | trim }}"

# One node at a time. The first node ahead of the stored version runs upgrade
# apply, which moves it; the rest run upgrade node, which follows it.
- name: Upgrade the control-plane components
  hosts: control_plane
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Read the stored version again
      ansible.builtin.raw: >-
        sudo kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get configmap kubeadm-config
        -o jsonpath='{.data.ClusterConfiguration}' | sed -n 's/^kubernetesVersion: //p'
      register: stored_now
      changed_when: false

    - name: Run kubeadm upgrade apply on the first control plane ahead of it
      ansible.builtin.raw: >-
        sudo kubeadm upgrade apply {{ kube_target }} --yes
        --skip-phases addon/kube-proxy,addon/coredns --patches /etc/kubernetes/patches
      when: kube_target[1:] is version((stored_now.stdout | trim)[1:], '>')
      changed_when: true

    - name: Run kubeadm upgrade node on the others
      ansible.builtin.raw: >-
        sudo kubeadm upgrade node
        --skip-phases addon/kube-proxy,addon/coredns --patches /etc/kubernetes/patches
      when: kube_target[1:] is version((stored_now.stdout | trim)[1:], '<=')
      changed_when: true

    - name: Wait for the API server on this node
      ansible.builtin.raw: >-
        for i in $(seq 60); do
        curl -fsk https://localhost:6443/readyz >/dev/null && exit 0; sleep 5; done; exit 1
      changed_when: false

# Only fetches the kubelet configuration; a worker whose kubeadm differs from
# the stored version is left for the next run.
- name: Refresh the kubelet configuration on the workers
  hosts: workers
  gather_facts: false
  serial: 1
  tasks:
    - name: Read the kubeadm version the sysext merged at boot
      ansible.builtin.raw: kubeadm version -o short
      register: kubeadm_version
      changed_when: false
      ignore_unreachable: true

    - name: Read the stored version
      ansible.builtin.raw: >-
        sudo kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get configmap kubeadm-config
        -o jsonpath='{.data.ClusterConfiguration}' | sed -n 's/^kubernetesVersion: //p'
      register: stored_version
      changed_when: false
      delegate_to: "{{ groups['control_plane'][0] }}"
      run_once: true # noqa: run-once

    - name: Run kubeadm upgrade node
      ansible.builtin.raw: sudo kubeadm upgrade node
      when:
        - kubeadm_version is not unreachable
        - kubeadm_version.stdout | trim == stored_version.stdout | trim
      changed_when: true
      ignore_unreachable: true
