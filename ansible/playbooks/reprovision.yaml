---
# Stages flatcar-reset with the node's reprovision Ignition config and leaves
# the reboot to Kured; see docs/operations/nodes.md#reprovisioning-a-node.
# Flatcar has no Python, hence raw.
- name: Stage a flatcar-reset reprovision
  hosts: k8s_nodes
  gather_facts: false
  vars_files:
    - vars/reprovision.yaml
  vars:
    output_dir: "{{ playbook_dir }}/../../output"
    allow_minor: false
    # ALLOW_MINOR=1 writes the inventory's sysext, so the old one is not kept.
    ignition_file: >-
      {{ output_dir }}/reprovision/ignition-{{ inventory_hostname }}-reprovision{{ '-minor' if allow_minor | bool else '' }}.json
    keep_paths: "{{ reprovision_keep_paths | difference(reprovision_minor_drop if allow_minor | bool else []) }}"
    must_keep: "{{ reprovision_must_keep | difference(reprovision_minor_drop if allow_minor | bool else []) }}"
    keep_args: "{{ keep_paths | map('quote') | join(' ') }}"
  tasks:
    - name: Require the rendered reprovision config
      ansible.builtin.stat:
        path: "{{ ignition_file }}"
      register: ignition_stat
      delegate_to: localhost

    - name: Refuse without make config
      ansible.builtin.assert:
        that: ignition_stat.stat.exists
        fail_msg: "{{ ignition_file }} is missing; run make config first."
        quiet: true

    # The rendered sysupdate config names the inventory's minor. A node handed
    # the next minor fetches a kubelet the API server may refuse.
    - name: Read the API server version
      ansible.builtin.raw: sudo kubectl --kubeconfig /etc/kubernetes/admin.conf version -o json
      register: kubectl_version
      changed_when: false
      delegate_to: "{{ groups['control_plane'][0] }}"
      run_once: true # noqa: run-once

    - name: Refuse a minor the cluster does not run yet
      vars:
        server: "{{ (kubectl_version.stdout | from_json).serverVersion.gitVersion }}"
      ansible.builtin.assert:
        that: >-
          kubernetes_version.split('.')[:2] == server.split('.')[:2]
          or (allow_minor | bool and kubernetes_version.split('.')[0] == server.split('.')[0]
              and kubernetes_version.split('.')[1] | int == server.split('.')[1] | int + 1)
        fail_msg: >-
          ansible/inventory.yaml names {{ kubernetes_version }}, the cluster runs
          {{ server }}. A minor upgrade moves one minor and reprovisions node by
          node with ALLOW_MINOR=1; see
          docs/operations/upgrades.md#upgrading-a-minor-version-deliberately
        quiet: true
      run_once: true # noqa: run-once

    # A control plane must read what every other one writes, and the others
    # what it will write; see docs/operations/encryption-key-rotation.md
    - name: Read each control plane's encryption keys, hashed
      ansible.builtin.raw: >-
        sudo awk '/secret:/{print $2}' /etc/kubernetes/enc/encryption-config.yaml
        | while read -r s; do printf %s "$s" | sha256sum | cut -c1-64; done
      register: live_keys
      changed_when: false
      delegate_to: "{{ item }}"
      loop: "{{ groups['control_plane'] }}"
      run_once: true # noqa: run-once
      when: groups['control_plane'] | intersect(ansible_play_hosts_all) | length > 0

    - name: Refuse an encryption stage the other control planes cannot follow
      vars:
        files: >-
          {{ encryption_keys
             | map('regex_replace', '^', output_dir ~ '/credentials/encryption_key_')
             | map('regex_replace', '_key1$', '') | list }}
        rendered: "{{ query('file', *files) | map('b64encode') | map('hash', 'sha256') | list }}"
        live: "{{ live_keys.results | map(attribute='stdout_lines') | list }}"
      ansible.builtin.assert:
        that:
          - live | map('first') | difference(rendered) | length == 0
          - live | select('contains', rendered | first) | list | length == live | length
        fail_msg: >-
          encryption_keys {{ encryption_keys }} drops a key another control plane
          still encrypts with, or puts first a key one cannot decrypt yet. Finish
          the previous stage on every control plane first.
        quiet: true
      run_once: true # noqa: run-once
      when: groups['control_plane'] | intersect(ansible_play_hosts_all) | length > 0

    # The reprovision config links no sysext: the node keeps the one it runs.
    - name: Check the sysext the node runs is on its disk
      ansible.builtin.raw: test -e "$(readlink -f /etc/extensions/kubernetes.raw)"
      changed_when: false
      when: not allow_minor | bool

    # The same match flatcar-reset's initrd step makes, each entry also keeping
    # what is below it. Its own --preview-keep cannot unmount /etc on these
    # nodes and prints nothing.
    - name: Check the keep list covers the node's cluster state
      ansible.builtin.raw: >-
        for p in {{ must_keep | map('quote') | join(' ') }}; do
        sudo test -e "$p" || continue; kept=;
        for e in {{ keep_args }}; do
        printf '%s\n' "$p" | grep -qxE -e "$e" -e "$e/.*" && kept=1;
        done; [ -n "$kept" ] || echo "$p";
        done
      register: lost
      changed_when: false

    - name: Stop if the reset would delete cluster state
      ansible.builtin.assert:
        that: lost.stdout | trim | length == 0
        fail_msg: "flatcar-reset would delete: {{ lost.stdout_lines | join(', ') }}"
        quiet: true

    # Holds the node's secrets; scp keeps its 0600 and /tmp is a tmpfs.
    - name: Copy the reprovision config to the node
      ansible.builtin.command:
        argv:
          - scp
          - -q
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - UserKnownHostsFile={{ output_dir }}/known_hosts
          - "{{ ignition_file }}"
          - "{{ ansible_user }}@{{ ansible_host }}:/tmp/reprovision.ign"
      delegate_to: localhost
      changed_when: true

    - name: Stage the reset
      ansible.builtin.raw: >-
        sudo flatcar-reset --ignition-file /tmp/reprovision.ign --keep-machine-id
        --keep-paths {{ keep_args }};
        rc=$?; rm -f /tmp/reprovision.ign; exit $rc
      changed_when: true

    # Kured drains and reboots one node at a time; the reset runs in that boot.
    - name: Ask Kured for the reboot
      ansible.builtin.raw: sudo touch /run/reboot-required
      changed_when: true
