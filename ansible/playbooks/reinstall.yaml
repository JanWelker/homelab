---
- name: Set the PXE boot default
  hosts: k8s_nodes
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ playbook_dir }}/../../output"
    pxe_default: install
  tasks:
    # With bootstrap_cluster the first control plane runs kubeadm init, which
    # on a running cluster starts a second one next to it; see
    # docs/operations/nodes.md#rebuilding-or-repartitioning-a-node
    - name: Probe the API VIP before arming an init
      ansible.builtin.uri:
        url: "https://{{ control_plane_vip }}:6443/healthz"
        validate_certs: false
        timeout: 5
      register: api_probe
      failed_when: false
      run_once: true # noqa: run-once
      when: pxe_default == 'install' and hostvars[groups['control_plane'][0]].bootstrap_cluster | default(false) | bool

    - name: Refuse to re-initialise a running cluster
      ansible.builtin.assert:
        that: api_probe is skipped or api_probe.status == -1
        fail_msg: >-
          bootstrap_cluster is true in ansible/inventory.yaml, so
          {{ groups['control_plane'][0] }} would run kubeadm init, but a cluster
          already answers on {{ control_plane_vip }}:6443. Set it to false and
          run make config before arming a node.
        quiet: true
      run_once: true # noqa: run-once

    - name: Check the endpoint name against a running cluster
      ansible.builtin.import_tasks: tasks/check_endpoint_host.yaml
      when: pxe_default == 'install' and control_plane_endpoint_host != control_plane_vip

    # A reinstalled node has a new host key; see docs/operations/nodes.md
    - name: Forget the node's SSH host key
      ansible.builtin.command:
        cmd: ssh-keygen -R {{ ansible_host }}
      when: pxe_default == 'install'
      register: forget_key
      changed_when: "'updated' in forget_key.stderr or 'updated' in forget_key.stdout"
      failed_when: false

    - name: Set DEFAULT in the generated PXE menu
      ansible.builtin.lineinfile:
        path: "{{ output_dir }}/tftp/pxelinux.cfg/01-{{ mac_address | replace(':', '-') }}"
        regexp: '^DEFAULT '
        line: "DEFAULT {{ pxe_default }}"
        state: present
