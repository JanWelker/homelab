---
# Flips DEFAULT in the generated PXE menus so a node reinstalls on its next
# network boot. Edits output/, never the template, so `make config` disarms.
#
#   make reinstall [LIMIT=odin]    # arm
#   make reinstall-cancel          # disarm
- name: Set the PXE boot default
  hosts: k8s_nodes
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ playbook_dir }}/../../output"
    pxe_default: install
  tasks:
    - name: Set DEFAULT in the generated PXE menu
      ansible.builtin.lineinfile:
        path: "{{ output_dir }}/tftp/pxelinux.cfg/01-{{ mac_address | replace(':', '-') }}"
        regexp: '^DEFAULT '
        line: "DEFAULT {{ pxe_default }}"
        state: present
