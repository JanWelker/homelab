---
- name: Fetch Kubeconfig
  hosts: control_plane[0]
  become: true
  gather_facts: false
  tasks:
    - name: Cat admin.conf
      ansible.builtin.raw: cat /etc/kubernetes/admin.conf
      register: kubeconfig_content
      changed_when: false
      no_log: true

    # Only the nodes resolve an endpoint name; the VIP is in certSANs.
    - name: Save to local file
      ansible.builtin.copy:
        content: "{{ kubeconfig_content.stdout | replace('https://' ~ control_plane_endpoint_host ~ ':6443', 'https://' ~ control_plane_vip ~ ':6443') }}"
        dest: "{{ playbook_dir }}/../../output/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
