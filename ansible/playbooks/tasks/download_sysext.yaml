---
- name: "Download Sysext SHA256SUMS for {{ item.name | capitalize }}"
  ansible.builtin.uri:
    url: "{{ url }}/{{ item.name }}-{{ item.version }}/SHA256SUMS"
    return_content: true
  register: sysext_sums

- name: "Set Sysext Checksum Fact for {{ item.name | capitalize }}"
  ansible.builtin.set_fact:
    sysext_checksum: "{{ sysext_sums.content | regex_search('([a-f0-9]+)\\s+' + item.name + '-' + item.version + '-x86-64.raw', '\\1') | first }}"

- name: "Download Sysext Image for {{ item.name | capitalize }}"
  ansible.builtin.get_url:
    url: "{{ url }}/{{ item.name }}-{{ item.version }}/{{ item.name }}-{{ item.version }}-x86-64.raw"
    dest: "{{ http_dir }}/{{ item.name }}-{{ item.version }}-x86-64.raw"
    checksum: "sha256:{{ sysext_checksum }}"
    mode: "0644"

# Take upstream's floating config for [Target] and [Source] Path, then narrow
# MatchPattern to the series pinned in inventory.yaml. A floating pattern lets a
# node stage a Kubernetes minor kubeadm refuses to skip to.
- name: "Download Upstream Sysupdate Config for {{ item.name | capitalize }}"
  ansible.builtin.get_url:
    url: "{{ url }}/{{ item.name }}-{{ item.version }}/{{ item.name }}.conf"
    dest: "{{ output_dir }}/tmp/sysext/{{ item.name }}.conf"
    force: true
    mode: "0644"

- name: "Publish Series-Pinned Sysupdate Config for {{ item.name | capitalize }}"
  ansible.builtin.copy:
    content: "{{ upstream_conf | regex_replace(floating_pattern, pinned_pattern) }}\n"
    dest: "{{ http_dir }}/{{ item.name }}.conf"
    mode: "0644"
  vars:
    upstream_conf: "{{ lookup('file', output_dir + '/tmp/sysext/' + item.name + '.conf') }}"
    floating_pattern: "(?m)^MatchPattern={{ item.name }}-@v-"
    pinned_pattern: "MatchPattern={{ item.name }}-{{ item.series }}.@v-"

# A silent no-op would restore the floating pattern, so assert the pin landed.
- name: "Assert Sysupdate Config Is Series-Pinned for {{ item.name | capitalize }}"
  ansible.builtin.assert:
    that:
      - "'MatchPattern=' + item.name + '-' + item.series + '.@v-' in published_conf"
    fail_msg: >-
      {{ item.name }}.conf from sysext-bakery did not carry the expected
      floating MatchPattern, so it could not be pinned to {{ item.series }}.
      Nodes provisioned from it would track the newest {{ item.name }} upstream
      publishes instead of the version pinned in inventory.yaml.
    quiet: true
  vars:
    published_conf: "{{ lookup('file', http_dir + '/' + item.name + '.conf') }}"
