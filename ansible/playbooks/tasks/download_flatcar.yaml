---
# The sums are only as good as their signature; the initrd runs flatcar-install.
- name: "Verify the DIGESTS for {{ item.name | capitalize }}"
  ansible.builtin.include_tasks: verify_clearsigned.yaml
  vars:
    signed_name: "{{ item.file }}.DIGESTS.asc"
    signed_url: "{{ url }}/{{ item.file }}.DIGESTS.asc"
    key_url: "{{ flatcar_signing_key.url }}"
    key_fingerprint: "{{ flatcar_signing_key.fingerprint }}"

- name: "Set Checksum Fact for {{ item.name | capitalize }}"
  ansible.builtin.set_fact:
    artifact_checksum: "{{ verified_text | regex_search('(?s)# SHA512 HASH\\n([a-f0-9]+)', '\\1') | first }}"

- name: "Ensure the destination directory exists for {{ item.name | capitalize }}"
  ansible.builtin.file:
    path: "{{ item.dest_dir | default(http_dir) }}"
    state: directory
    mode: "0755"

- name: "Download {{ item.name | capitalize }}"
  ansible.builtin.get_url:
    url: "{{ url }}/{{ item.file }}"
    dest: "{{ item.dest_dir | default(http_dir) }}/{{ item.file }}"
    checksum: "sha512:{{ artifact_checksum }}"
    mode: "0644"

- name: "Download the signature for {{ item.name | capitalize }}"
  ansible.builtin.get_url:
    url: "{{ url }}/{{ item.file }}.sig"
    dest: "{{ item.dest_dir | default(http_dir) }}/{{ item.file }}.sig"
    mode: "0644"
  when: item.signature | default(false)
