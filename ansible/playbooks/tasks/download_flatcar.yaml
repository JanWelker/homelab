---
- name: "Download DIGESTS for {{ item.name | capitalize }}"
  ansible.builtin.uri:
    url: "{{ url }}/{{ item.file }}.DIGESTS"
    return_content: true
  register: artifact_digests

- name: "Set Checksum Fact for {{ item.name | capitalize }}"
  ansible.builtin.set_fact:
    artifact_checksum: "{{ artifact_digests.content | regex_search('(?s)# SHA512 HASH\\n([a-f0-9]+)', '\\1') | first }}"

- name: "Ensure the destination directory exists for {{ item.name | capitalize }}"
  ansible.builtin.file:
    path: "{{ item.dest_dir | default(http_dir) }}"
    state: directory
    mode: "0755"

- name: "Download {{ item.name | capitalize }}"
  ansible.builtin.get_url:
    url: "{{ url }}/{{ item.file }}"
    dest: "{{ item.dest_dir | default(http_dir) }}/{{ item.file }}"
    checksum: "sha512:{{ artifact_checksum }}"
    mode: "0644"

- name: "Download the signature for {{ item.name | capitalize }}"
  ansible.builtin.get_url:
    url: "{{ url }}/{{ item.file }}.sig"
    dest: "{{ item.dest_dir | default(http_dir) }}/{{ item.file }}.sig"
    mode: "0644"
  when: item.signature | default(false)
