---
- name: Download Flatcar Artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ playbook_dir }}/../../output"
    http_dir: "{{ output_dir }}/http"
    tftp_dir: "{{ output_dir }}/tftp"
  tasks:
    - name: Create output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ http_dir }}"
        - "{{ tftp_dir }}"
        - "{{ output_dir }}/tmp/sysext"

    - name: Download Flatcar OS Artifacts
      ansible.builtin.include_tasks: tasks/download_flatcar.yaml
      vars:
        url: "https://{{ flatcar_channel }}.release.flatcar-linux.net/amd64-usr/{{ flatcar_version }}"
      loop:
        - name: kernel
          file: flatcar_production_pxe.vmlinuz
        - name: initrd
          file: flatcar_production_pxe_image.cpio.gz
        # The disk image flatcar-install writes, plus its detached signature.
        #
        # Both land in a directory named for the version because that is the
        # layout flatcar-install expects from a mirror: it builds
        # <base>/<version>/flatcar_production_image.bin.bz2 and fetches the .sig
        # beside it. Serving that shape is what lets the node verify the image
        # against Flatcar's signing key instead of trusting whatever the boot
        # server hands it.
        - name: disk image
          file: flatcar_production_image.bin.bz2
          dest_dir: "{{ http_dir }}/{{ flatcar_version }}"
          signature: true

    - name: Download Sysexts
      ansible.builtin.include_tasks: tasks/download_sysext.yaml
      vars:
        url: "https://github.com/flatcar/sysext-bakery/releases/download"
      loop:
        # `series` is the major.minor the node's sysupdate config is pinned to.
        # Derived from the pinned version so inventory.yaml stays the single
        # place a version is chosen.
        - name: kubernetes
          version: "{{ kubernetes_version }}"
          series: "{{ kubernetes_version.split('.')[:2] | join('.') }}"
        - name: containerd
          version: "{{ containerd_version }}"
          series: "{{ containerd_version.split('.')[:2] | join('.') }}"

    - name: Download Noop Sysext Config
      ansible.builtin.get_url:
        url: "https://extensions.flatcar.org/extensions/noop.conf"
        dest: "{{ http_dir }}/noop.conf"
        mode: "0644"

    - name: Download Syslinux
      ansible.builtin.include_tasks: tasks/download_syslinux.yaml
      vars:
        url: "https://mirrors.edge.kernel.org/pub/linux/utils/boot/syslinux"
