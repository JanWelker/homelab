---
- name: Download Flatcar Artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ playbook_dir }}/../../output"
    http_dir: "{{ output_dir }}/http"
    tftp_dir: "{{ output_dir }}/tftp"
    # A keyring of its own, so nothing in ~/.gnupg is trusted by accident.
    gnupg_home: "{{ output_dir }}/tmp/gnupg"
    # Primary key fingerprints, from https://www.flatcar.org/security/image-signing-key/
    # and kernel.org's pgpkeys repository. The yearly signing subkeys come with
    # the fetched key and are trusted through the primary.
    flatcar_signing_key:
      url: https://www.flatcar.org/security/image-signing-key/Flatcar_Image_Signing_Key.asc
      fingerprint: F88CFEDEFF29A5B4D9523864E25D9AED0593B34A
    kernel_org_autosigner_key:
      url: https://git.kernel.org/pub/scm/docs/kernel/pgpkeys.git/plain/keys/632D3A06589DA6B1.asc
      fingerprint: B8868C80BA62A1FFFAF5FDA9632D3A06589DA6B1
  tasks:
    - name: Create output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ http_dir }}"
        - "{{ tftp_dir }}"

    - name: Create the signature-checking keyring directory
      ansible.builtin.file:
        path: "{{ gnupg_home }}"
        state: directory
        mode: "0700"

    - name: Download Flatcar OS Artifacts
      ansible.builtin.include_tasks: tasks/download_flatcar.yaml
      vars:
        url: "https://{{ flatcar_channel }}.release.flatcar-linux.net/amd64-usr/{{ flatcar_version }}"
      loop:
        - name: kernel
          file: flatcar_production_pxe.vmlinuz
        - name: initrd
          file: flatcar_production_pxe_image.cpio.gz
        - name: disk image
          file: flatcar_production_image.bin.bz2
          dest_dir: "{{ http_dir }}/{{ flatcar_version }}"
          signature: true

    - name: Download Sysexts
      ansible.builtin.include_tasks: tasks/download_sysext.yaml
      vars:
        url: "https://github.com/flatcar/sysext-bakery/releases/download"
      loop:
        - name: kubernetes
          version: "{{ kubernetes_version }}"

    - name: Download Syslinux
      ansible.builtin.include_tasks: tasks/download_syslinux.yaml
      vars:
        url: "https://mirrors.edge.kernel.org/pub/linux/utils/boot/syslinux"
