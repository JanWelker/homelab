all:
  vars:
    flatcar_channel: stable
    flatcar_version: "4593.2.5"
    syslinux_version: "6.03"
    boot_server_ip: "10.9.200.222" # IP of the machine running 'make serve'
    # Virtual IP for the Kubernetes API server, held by kube-vip on whichever
    # control-plane node is currently the leader. Must be a free address on the
    # nodes' subnet and outside any DHCP range.
    control_plane_vip: "10.9.2.10"
    # Interface kube-vip advertises the VIP on. Must match the nodes' primary
    # NIC; Cilium binds to "en+" on the same hardware.
    control_plane_vip_interface: "eno1"
    kube_vip_version: "v1.2.3"
    # Kubernetes and containerd both come from flatcar/sysext-bakery, so these
    # are Flatcar's builds rather than upstream tarballs. The major.minor of
    # each is also what the generated sysupdate configs pin to, which is what
    # stops a running node drifting onto a minor kubeadm cannot skip to --
    # see ansible/playbooks/tasks/download_sysext.yaml.
    kubernetes_version: "v1.37.0"
    # Track the containerd minor Flatcar stable itself ships (2.1.x in
    # 4593.2.5) so the sysext and the OS agree on containerd's behaviour.
    containerd_version: "2.1.9"
    pod_subnet: "10.244.0.0/16"
    service_subnet: "10.96.0.0/12"
    install_disk: "/dev/nvme0n1"
  children:
    k8s_nodes:
      vars:
        ansible_user: core
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      children:
        control_plane:
          vars:
            role: control-plane
          hosts:
            odin:
              ansible_host: 10.9.2.1
              mac_address: "fc:3f:db:0d:8f:5c"
            thor:
              ansible_host: 10.9.2.2
              mac_address: "ec:8e:b5:6e:16:e0"
            loki:
              ansible_host: 10.9.2.3
              mac_address: "fc:3f:db:0e:61:b9"
        workers:
          vars:
            role: worker
          hosts:
            freya:
              ansible_host: 10.9.2.4
              mac_address: "c8:d3:ff:a2:8d:a9"
              install_disk: "/dev/sda"
            heimdall:
              ansible_host: 10.9.2.5
              mac_address: "fc:3f:db:0e:66:7d"
            valkyrie:
              ansible_host: 10.9.2.6
              mac_address: "fc:3f:db:04:c8:59"
