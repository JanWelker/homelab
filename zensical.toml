[project]
site_name = "Homelab Documentation"
site_url = "https://janwelker.github.io/homelab/"
site_description = "GitOps-driven Kubernetes homelab on bare metal, running Flatcar Container Linux, Kubeadm, Cilium, Rook-Ceph and ArgoCD."
repo_name = "JanWelker/homelab"
repo_url = "https://github.com/JanWelker/homelab"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Jan Welker"

# Fail the build on the problems CI would fail on, so a local build and the
# workflow agree.
strict = true

extra_css = [
  "stylesheets/fonts.css",
  "stylesheets/extra.css",
]

# Ordered by reader journey rather than by repository layout: orient, build,
# understand, operate, contribute. Section titles link to their own index page
# (navigation.indexes), so no section carries an explicit "Overview" child.
# Platform is in bootstrap order, which is the order the docs explain it in; the
# alphabetical list lives on platform/index.md.
nav = [
  { "Home" = "index.md" },
  { "Get Started" = [
    { "Core Concepts" = "concepts.md" },
    { "Quickstart" = "quickstart.md" },
    { "Adapt It to Your Cluster" = "adapting.md" },
  ] },
  { "Architecture" = [
    "architecture/index.md",
    { "Boot & Bootstrap Process" = "architecture/boot-process.md" },
    { "Boot Server" = "architecture/boot-server.md" },
    { "Ansible" = "architecture/ansible.md" },
    { "GitOps Strategy" = "architecture/gitops.md" },
    { "Design Decisions" = "architecture/decisions.md" },
    { "Security Posture" = "architecture/security.md" },
    { "Audit Logging" = "architecture/audit-logging.md" },
    { "Known Limitations" = "architecture/limitations.md" },
    { "Repository Layout" = "architecture/directory-structure.md" },
  ] },
  { "Platform" = [
    "platform/index.md",
    { "Cilium" = "platform/cilium.md" },
    { "Gateway API" = "platform/gateway-api.md" },
    { "cert-manager" = "platform/cert-manager.md" },
    { "External DNS" = "platform/external-dns.md" },
    { "Rook-Ceph" = "platform/rook-ceph.md" },
    { "CloudNativePG" = "platform/cloudnative-pg.md" },
    { "OpenBao" = "platform/openbao.md" },
    { "External Secrets" = "platform/external-secrets.md" },
    { "Authentik" = "platform/authentik.md" },
    { "Monitoring" = "platform/monitoring.md" },
    { "Logging" = "platform/logging.md" },
    { "Metrics Server" = "platform/metrics-server.md" },
    { "Kured" = "platform/kured.md" },
    { "Security Policies" = "platform/security-policies.md" },
  ] },
  { "Operations" = [
    "operations/index.md",
    { "Troubleshooting" = "operations/troubleshooting.md" },
    { "Node Lifecycle" = "operations/nodes.md" },
    { "Updates & Upgrades" = "operations/upgrades.md" },
    { "Backups & Recovery" = "operations/backups.md" },
    { "Control Plane VIP" = "operations/control-plane-vip.md" },
  ] },
  { "Development" = [
    "development/index.md",
    { "Contributing" = "development/contributing.md" },
    { "Adding a Workload" = "development/add-workload.md" },
    { "Documentation System" = "development/documentation.md" },
    { "Maintenance" = "development/maintenance.md" },
  ] },
]

[project.theme]
variant = "modern"
# Suppress the theme's Google Fonts <link>; docs/stylesheets/fonts.css declares
# the same two families from woff2 files shipped with the site.
font = false
custom_dir = "overrides"
logo = "assets/images/logo.png"
favicon = "assets/images/logo.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Three palettes, and the order matters: the first is the default for anyone
# who has never touched the toggle, so it is the one that follows the browser.
# With only the light and dark entries the toggle cycles between them forever,
# which means one click opts out of "match my system" permanently and offers no
# way back -- and nothing re-reads the media query while the page is open.

# Follows the operating system. Resolved from prefers-color-scheme at load.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Following your system theme -- switch to light"

# Pinned light.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Pinned to light -- switch to dark"

# Pinned dark.
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Pinned to dark -- follow your system theme"

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
