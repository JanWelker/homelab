[project]
site_name = "Homelab Documentation"
site_url = "https://janwelker.github.io/homelab/"
repo_name = "JanWelker/homelab"
repo_url = "https://github.com/JanWelker/homelab"

extra_css = [
  "stylesheets/extra.css",
]

nav = [
  { "Home" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Architecture" = [
    { "Overview" = "architecture/index.md" },
    { "Boot Process" = "architecture/boot-process.md" },
    { "GitOps Strategy" = "architecture/gitops.md" },
    { "Reference" = "architecture/directory-structure.md" },
  ] },
  { "Development" = [
    { "Documentation System" = "development/documentation.md" },
    { "Maintenance" = "development/maintenance.md" },
    { "Adding a Workload" = "development/add-workload.md" },
  ] },
  { "Platform" = [
    { "Overview" = "platform/index.md" },
    { "Cilium" = "platform/cilium.md" },
    { "Cert-Manager" = "platform/cert-manager.md" },
    { "External Secrets" = "platform/external-secrets.md" },
    { "Gateway API" = "platform/gateway-api.md" },
    { "Monitoring" = "platform/monitoring.md" },
    { "OpenBao" = "platform/openbao.md" },
    { "Rook-Ceph" = "platform/rook-ceph.md" },
  ] },
  { "Workloads" = [
    { "Overview" = "workloads/index.md" },
  ] },
  { "Boot Server" = "boot_server/index.md" },
  { "Ansible" = "ansible/index.md" },
]

[project.theme]
variant = "modern"
logo = "assets/images/logo.png"
favicon = "assets/images/logo.png"
features = [
  "navigation.expand",
  "navigation.indexes",
  "content.code.copy",
]

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
attr_list = {}
admonition = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
