repos:
  # Local hooks run through uv so they use the versions in uv.lock and the
  # project's dependencies: the same tool, at the same version, as the
  # commands in CLAUDE.md and the CI workflows.
  - repo: local
    hooks:
      - id: ansible-lint
        name: Ansible Lint
        entry: bash -c 'cd ansible && uv run ansible-lint'
        language: system
        files: ^ansible/
        pass_filenames: false

      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        files: ^(boot_server|scripts|tests)/.*\.py$

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        files: ^(boot_server|scripts|tests)/.*\.py$

      - id: pytest
        name: Pytest
        entry: uv run pytest -q
        language: system
        files: ^(boot_server|scripts|tests)/.*\.py$
        pass_filenames: false

      - id: yamllint
        name: YAML Lint
        entry: uv run yamllint -f github
        language: system
        files: \.ya?ml$

      - id: zensical
        name: Docs build (strict)
        entry: uv run zensical build --clean --strict
        language: system
        files: ^(docs/|overrides/|zensical\.toml$)
        pass_filenames: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        files: \.md$
        exclude: ^(\.venv|\.agent)/
