---
# Every credential Holmes carries, as the env vars the chart's envRef and
# {{ env.* }} templating read. Four paths, so one rotation retypes one value;
# all four are written by make bao-secrets, empty until they exist, because a
# missing path fails the ExternalSecret and with it the pod.
# See docs/platform/holmesgpt.md#secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmesgpt-env
  namespace: holmesgpt
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: holmesgpt-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ANTHROPIC_API_KEY: "{{ .anthropic }}"
        GITHUB_TOKEN: "{{ .github }}"
        ARGOCD_AUTH_TOKEN: "{{ .argocd }}"
        GRAFANA_API_KEY: "{{ .grafana }}"
  data:
    - secretKey: anthropic
      remoteRef:
        key: holmesgpt/anthropic
        property: api-key
    - secretKey: github
      remoteRef:
        key: holmesgpt/github
        property: token
    - secretKey: argocd
      remoteRef:
        key: holmesgpt/argocd
        property: token
    - secretKey: grafana
      remoteRef:
        key: holmesgpt/grafana
        property: token
