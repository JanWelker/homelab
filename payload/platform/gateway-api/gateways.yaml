---
# Apps Gateway - for general payload applications (*.k8s.wlkr.ch)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apps-gateway
  namespace: kube-system
  annotations:
    # The cluster sits behind NAT; see docs/platform/external-dns.md
    external-dns.kubernetes.io/target: "212.51.149.132"
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "10.9.2.249"
  listeners:
    # HTTP listener for redirects to HTTPS
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.k8s.wlkr.ch"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: apps-gateway-tls
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
    # A second domain, for the two neighbourhood sites. Its own listener
    # because a listener pins one hostname pattern, and its own certificate
    # because a wildcard covers one zone; see docs/platform/gateway-api.md
    - name: https-wollbi
      protocol: HTTPS
      port: 443
      hostname: "*.wollbi.ch"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wollbi-gateway-tls
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
    # SSH to the in-cluster Claude Code agents, tunnelled in TLS. Passthrough,
    # because Cilium rejects Terminate for a TLSRoute; the pod ends the TLS.
    # See docs/platform/gateway-api.md#ssh-listener
    - name: ssh
      protocol: TLS
      port: 443
      hostname: "*.ssh.wlkr.ch"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: TLSRoute
---
# Infra Gateway - for core/infrastructure services (*.infra.k8s.wlkr.ch)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra-gateway
  namespace: kube-system
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "10.9.2.248"
  listeners:
    # HTTP listener for redirects to HTTPS
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.infra.k8s.wlkr.ch"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: infra-gateway-tls
            namespace: kube-system
      allowedRoutes:
        namespaces:
          from: All
