---
# selinuxd's templates, replacing the ones bundled in its image. The name
# carries a number because the daemon reads the files once, at pod start: a
# change here takes a new name, which rolls the daemon. What differs from the
# image's set and how to test a change:
# docs/platform/security-profiles-operator.md#templates
apiVersion: v1
kind: ConfigMap
metadata:
  name: selinuxd-templates-flatcar-2
  namespace: security-profiles-operator
data:
  base_container.cil: |
    ; Generated by gen_base.py from the node's container module: a type that
    ; inherits this block gets what container_t has. Regenerate after a Flatcar
    ; update that changes the container policy.
    (block container
    (type process)
    (type socket)
    (roletype system_r process)
    (typeattributeset can_receive_kernel_messages (process ))
    (typeattributeset container_domain (process ))
    (typeattributeset container_net_domain (process ))
    (typeattributeset container_system_domain (process ))
    (typeattributeset container_user_domain (process ))
    (typeattributeset domain (process ))
    (typeattributeset mcs_constrained_type (process ))
    (typeattributeset nsswitch_domain (process ))
    (typeattributeset process_user_target (process ))
    (typeattributeset file_type (socket ))
    (allow process socket (sock_file (create open getattr setattr read write rename link unlink ioctl lock append)))
    (allow process cpu_online_t (file (getattr open read)))
    (allow container_runtime_t process (key (create link read search setattr view write)))
    (allow initrc_t process (process (transition)))
    (allow kernel_t process (process (transition)))
    (allow kernel_t process (process2 (nnp_transition)))
    (allow process cgroup_types (dir (getattr open search)))
    (allow process cgroup_types (file (ioctl read write getattr lock append open)))
    (allow process cgroup_types (filesystem (mount)))
    (allow process cgroup_types (lnk_file (read getattr)))
    (allow process container_file_t (chr_file (ioctl read write create getattr setattr lock append unlink link rename open)))
    (allow process container_file_t (file (mounton entrypoint)))
    (allow process container_file_t (filesystem (getattr)))
    (allow process device_t (dir (getattr open search)))
    (allow process device_t (dir (ioctl read getattr lock open search)))
    (allow process device_t (lnk_file (read getattr)))
    (allow process devpts_t (chr_file (ioctl read write getattr lock append open)))
    (allow process devpts_t (chr_file (setattr)))
    (allow process devpts_t (dir (ioctl read getattr lock open search)))
    (allow process etc_t (file (watch)))
    (allow process fusefs_t (dir (watch)))
    (allow process fusefs_t (file (watch)))
    (allow process initrc_t (fifo_file (ioctl read write getattr append open)))
    (allow process kernel_t (fd (use)))
    (allow process kernel_t (fifo_file (ioctl read write getattr append open)))
    (allow process kernel_t (process (sigchld)))
    (allow process kernel_t (system (ipc_info)))
    (allow process kernel_t (system (module_request)))
    (allow process modules_object_t (dir (getattr open search)))
    (allow process modules_object_t (dir (ioctl read getattr lock open search)))
    (allow process modules_object_t (file (ioctl read getattr lock open)))
    (allow process modules_object_t (lnk_file (read getattr)))
    (allow process mtrr_device_t (chr_file (getattr)))
    (allow process mtrr_device_t (file (getattr)))
    (allow process nsfs_t (file (ioctl read getattr lock open)))
    (allow process proc_kmsg_t (file (ioctl read getattr lock open)))
    (allow process proc_net_t (dir (getattr open search)))
    (allow process proc_net_t (dir (ioctl read getattr lock open search)))
    (allow process proc_net_t (file (ioctl read getattr lock open)))
    (allow process proc_net_t (lnk_file (read getattr)))
    (allow process proc_t (dir (getattr open search)))
    (allow process random_device_t (chr_file (ioctl read getattr lock open)))
    (allow process self (bpf (map_create)))
    (allow process self (capability (audit_write)))
    (allow process self (capability (mknod)))
    (allow process self (netlink_audit_socket (ioctl read write create getattr setattr append bind connect getopt setopt shutdown nlmsg_read nlmsg_relay)))
    (allow process self (process (execmem execstack)))
    (allow process self (process (getcap)))
    (allow process self (process (getpgid)))
    (allow process sysctl_fs_t (dir (getattr open search)))
    (allow process sysctl_fs_t (dir (ioctl read getattr lock open search)))
    (allow process sysctl_fs_t (file (ioctl read getattr lock open)))
    (allow process sysctl_irq_t (dir (getattr open search)))
    (allow process sysctl_irq_t (dir (ioctl read getattr lock open search)))
    (allow process sysctl_irq_t (file (ioctl read getattr lock open)))
    (allow process sysctl_t (dir (getattr open search)))
    (allow process sysctl_vm_overcommit_t (file (ioctl read getattr lock open)))
    (allow process sysctl_vm_t (dir (getattr open search)))
    (allow process sysfs_t (dir (getattr open search)))
    (allow process sysfs_t (dir (ioctl read getattr lock open search)))
    (allow process sysfs_t (file (ioctl read getattr lock open)))
    (allow process sysfs_t (lnk_file (read getattr)))
    (allow process tmp_t (file (read)))
    (allow process tmpfs_t (chr_file (ioctl read write create getattr setattr lock append unlink link rename open)))
    (allow process tmpfs_t (chr_file (read write open)))
    (allow process tmpfs_t (dir (ioctl read write create getattr setattr lock unlink link rename open add_name remove_name reparent search rmdir)))
    (allow process tmpfs_t (dir (ioctl read write getattr lock open add_name remove_name search)))
    (allow process tmpfs_t (file (ioctl read write create getattr setattr lock append unlink link rename open)))
    (allow process tmpfs_t (filesystem (remount)))
    (allow process tmpfs_t (lnk_file (ioctl read write create getattr setattr lock append unlink link rename)))
    (allow process tmpfs_t (sock_file (ioctl read write create getattr setattr lock append unlink link rename open)))
    (allow process urandom_device_t (chr_file (ioctl read getattr lock open)))
    (allow process user_devpts_t (chr_file (ioctl read write getattr append open)))
    (allow process usr_t (dir (watch)))
    (allow process usr_t (file (map execute execute_no_trans)))
    (allow process var_lib_t (dir (getattr open search)))
    (allow process var_lib_t (dir (ioctl read getattr lock open search)))
    (allow process var_lib_t (file (execute execute_no_trans entrypoint)))
    (allow process var_lib_t (file (ioctl read getattr lock open)))
    (allow process var_lib_t (lnk_file (read getattr)))
    (allow process var_t (dir (getattr open search)))
    (dontaudit process kernel_t (system (module_request)))
    (optional base_container_optional_0
        (allow process hugetlbfs_t (dir (getattr open search)))
    )
    (optional base_container_optional_1
        (allow process hugetlbfs_t (file (ioctl read write getattr lock append open)))
    )
    (optional base_container_optional_2
        (allow process hugetlbfs_t (file (map)))
    )
    (optional base_container_optional_3
        (allow process init_t (process (sigchld)))
    )
    (optional base_container_optional_4
        (allow process init_t (process (signull)))
    )
    (optional base_container_optional_5
        (allow process rpm_t (fd (use)))
    )
    (optional base_container_optional_6
        (allow process rpm_t (fifo_file (ioctl read getattr lock open)))
    )
    (optional base_container_optional_7
        (allow process rpm_var_lib_t (dir (getattr open search)))
    )
    (optional base_container_optional_8
        (allow process rpm_var_lib_t (dir (ioctl read getattr lock open search)))
    )
    (optional base_container_optional_9
        (allow process rpm_var_lib_t (file (ioctl read getattr lock open)))
    )
    (optional base_container_optional_10
        (allow process rpm_var_lib_t (file (map)))
    )
    (optional base_container_optional_11
        (allow process rpm_var_lib_t (lnk_file (read getattr)))
    )
    (optional base_container_optional_12
        (allow process self (cap2_userns (syslog wake_alarm block_suspend audit_read perfmon bpf checkpoint_restore)))
    )
    (optional base_container_optional_13
        (allow process self (cap_userns (chown dac_override dac_read_search fowner fsetid kill setgid setuid setpcap linux_immutable net_bind_service net_broadcast net_admin net_raw ipc_lock ipc_owner sys_rawio sys_chroot sys_ptrace sys_pacct sys_admin sys_boot sys_nice sys_resource sys_time sys_tty_config mknod lease audit_write audit_control setfcap)))
    )
    (optional base_container_optional_14
        (allow process self (cap_userns (mknod)))
    )
    (optional base_container_optional_15
        (allow process self (cap_userns (sys_admin)))
    )
    (optional base_container_optional_16
        (allow process self (capability (chown dac_override dac_read_search fowner fsetid kill setgid setuid setpcap linux_immutable net_bind_service net_broadcast net_admin net_raw ipc_lock ipc_owner sys_rawio sys_chroot sys_ptrace sys_pacct sys_admin sys_boot sys_nice sys_resource sys_time sys_tty_config mknod lease audit_write audit_control setfcap)))
    )
    (optional base_container_optional_17
        (allow process self (capability (sys_admin)))
    )
    (optional base_container_optional_18
        (allow process self (capability2 (syslog wake_alarm block_suspend audit_read perfmon bpf checkpoint_restore)))
    )
    (optional base_container_optional_19
        (dontaudit process security_t (dir (getattr open search)))
    )
    (optional base_container_optional_20
        (dontaudit process security_t (file (ioctl read getattr lock open)))
    )
    (optional base_container_optional_21
        (dontaudit process security_t (filesystem (getattr)))
    )
    (optional base_container_optional_22
        (dontaudit process selinux_config_t (dir (getattr open search)))
    )
    (optional base_container_optional_23
        (dontaudit process selinux_config_t (file (ioctl read getattr lock open)))
    )
    (optional base_container_optional_24
        (dontaudit process sysfs_t (dir (getattr open search)))
    )
    (optional base_container_optional_25
        (dontaudit process sysfs_t (filesystem (getattr)))
    )
    )
  config_container.cil: |
    (block config_container
        (optional config_container_optional
            (allow process configfile (dir (ioctl read getattr lock search open)))
            (allow process configfile (file (ioctl read getattr lock open)))
            (allow process configfile (lnk_file (read getattr)))
        )
    )

    (block config_rw_container
        (blockinherit config_container)
        (optional config_rw_container_optional
            (allow process configfile (dir (ioctl read write getattr lock append open)))
            (allow process configfile (file (ioctl read write getattr lock append open)))
            (allow process configfile (lnk_file (ioctl read write getattr lock append open)))
        )
    )

    (block config_manage_container
        (optional config_manage_container_optional
            (allow process configfile (dir (ioctl read write create getattr setattr lock unlink link rename add_name remove_name reparent search rmdir open)))
            (allow process configfile (file (ioctl read write create getattr setattr lock append unlink link rename open)))
            (allow process configfile (lnk_file (ioctl read write create getattr setattr lock append unlink link rename open)))
        )
    )
  flatcar_runtime.cil: |
    ; Flatcar's container runtime runs as kernel_t. A container that sets
    ; no_new_privs (allowPrivilegeEscalation: false) and runs as spc_t needs this.
    (allow kernel_t spc_t (process2 (nnp_transition)))
  home_container.cil: |
    (block home_container
        (optional home_container_optional
            (allow process process (capability (dac_override )))

            (allow process user_home_dir_t (dir (getattr search open read lock ioctl)))
            (allow process home_root_t (dir (getattr search open read lock ioctl)))
            (allow process user_home_t (dir (getattr search open read lock ioctl)))

            (allow process user_home_dir_t (file (getattr ioctl lock open read)))
            (allow process user_home_t (file (getattr ioctl lock open read)))
        )
    )


    (block home_rw_container
        (blockinherit home_container)
        (optional home_rw_container_optional
            (allow process user_home_dir_t (dir (open getattr setattr read write link search add_name remove_name reparent lock ioctl)))
            (allow process home_root_t (dir (open getattr setattr read write link search add_name remove_name reparent lock ioctl)))
            (allow process user_home_t (dir (open getattr setattr read write link search add_name remove_name reparent lock ioctl)))

            (allow process user_home_t (file (open getattr read write append ioctl lock)))
            (allow process user_home_dir_t (file (open getattr read write append ioctl lock)))
        )
    )

    (block home_manage_container
        (blockinherit home_rw_container)
        (optional home_manage_container_optional
            (allow process user_home_dir_t (dir (create unlink rename rmdir )))
            (allow process home_root_t (dir (create unlink rename rmdir )))
            (allow process user_home_t (dir (create unlink rename rmdir )))

            (allow process user_home_t (file (create rename link unlink )))
            (allow process user_home_dir_t (file (create rename link unlink )))
        )
    )
  log_container.cil: |
    (block log_container
        (optional log_container_optional
            (allow process var_t (dir (getattr search open)))
            (allow process logfile (dir (ioctl read getattr lock search open)))
            (allow process logfile (file (ioctl read getattr lock open map)))
            (allow process auditd_log_t (dir (ioctl read getattr lock search open)))
            (allow process auditd_log_t (file (ioctl read getattr lock open)))
        )
    )


    (block log_rw_container
        (blockinherit log_container)

        (optional log_rw_container_optional
            (allow process logfile (dir (ioctl read write create getattr setattr lock add_name search open)))
            (allow process logfile (file (ioctl read write create getattr setattr lock append open)))
            (allow process logfile (lnk_file (ioctl read write getattr lock append open)))
            (allow process var_t (dir (getattr search open)))
            (allow process auditd_log_t (dir (ioctl read getattr lock search open)))
            (allow process auditd_log_t (file (ioctl read getattr lock open)))
        )
    )

    (block log_manage_container
        (blockinherit log_rw_container)

        (optional log_manage_container_optional
            (allow process logfile (dir (ioctl read write create getattr setattr lock unlink link rename add_name remove_name reparent search rmdir open)))
            (allow process logfile (file (ioctl read write create getattr setattr lock append unlink link rename open)))
            (allow process logfile (lnk_file (ioctl read write create getattr setattr lock append unlink link rename)))
            (allow process auditd_log_t (dir (ioctl read write getattr lock search open)))
            (allow process auditd_log_t (file (ioctl read write getattr lock open)))
        )
    )
  net_container.cil: |
    (block net_container
        (optional net_container_optional
            (typeattributeset container_net_domain (process))
        )
    )

    (block restricted_net_container
        (optional restricted_net_container_optional
            (allow process process (tcp_socket (ioctl read getattr lock write setattr append bind connect getopt setopt shutdown create listen accept)))
            (allow process process (udp_socket (ioctl read getattr lock write setattr append bind connect getopt setopt shutdown create)))
            (allow process process (sctp_socket (ioctl read getattr lock write setattr append bind connect getopt setopt shutdown create)))

            (allow process proc_t (lnk_file (read)))

            (allow process node_t (node (tcp_recv tcp_send recvfrom sendto)))
            (allow process node_t (node (udp_recv recvfrom)))
            (allow process node_t (node (udp_send sendto)))

            (allow process node_t (udp_socket (node_bind)))
            (allow process node_t (tcp_socket (node_bind)))

            (allow process http_port_t (tcp_socket (name_connect)))
            (allow process http_port_t (tcp_socket (recv_msg send_msg)))
        )
    )
  tmp_container.cil: |
    (block tmp_container
        (optional tmp_container_optional
            (allow process tmpfile (dir (getattr search open)))
            (allow process tmpfile (file (ioctl read getattr lock open)))
        )
    )

    (block tmp_rw_container
        (blockinherit tmp_container)

        (optional tmp_rw_container_optional
            (allow process tmpfile (file (ioctl read write getattr lock append open)))
            (allow process tmpfile (dir (ioctl read write getattr lock append open)))
        )
    )
  tty_container.cil: |
    (block tty_container
        (optional tty_container_optional
            (allow process device_t (dir (getattr search open)))
            (allow process device_t (dir (ioctl read getattr lock search open)))
            (allow process device_t (lnk_file (read getattr)))

            (allow process devtty_t (chr_file (ioctl read write getattr lock append open)))
        )
    )
  virt_container.cil: |
    (block virt_container
        (optional virt_container_optional
            (allow process var_t (dir (getattr search open)))
            (allow process var_t (lnk_file (read getattr)))

            (allow process var_run_t (dir (getattr search open)))
            (allow process var_run_t (lnk_file (read getattr)))

            (allow process virt_var_run_t (dir (getattr search open)))
            (allow process virt_var_run_t (sock_file (write getattr append open)))

            (allow process virtd_t (unix_stream_socket (connectto)))
        )
    )
  x_container.cil: |
    (block x_container
        (optional x_container_optional
            (allow xserver_t process (shm (getattr read write associate unix_read unix_write lock)))

            (allow process xserver_t (unix_stream_socket (connectto)))

            (allow process device_t (dir (getattr search open)))

            (allow process dri_device_t (chr_file (ioctl read write getattr lock append open map)))

            (allow process xserver_misc_device_t (chr_file (ioctl read write getattr lock append open map)))

            (allow process urandom_device_t (chr_file (open read)))

            (allow process tmpfs_t (dir (getattr search open)))

            (allow process tmp_t (dir (getattr search open)))
            (allow process tmp_t (lnk_file (read getattr)))

            (allow process xserver_tmp_t (dir (getattr search open)))
            (allow process xserver_tmp_t (sock_file (write getattr append open)))

            (allow process xserver_exec_t (file (ioctl read getattr lock map execute execute_no_trans open)))
        )
    )
