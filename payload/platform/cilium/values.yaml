---
ipam:
  mode: kubernetes

# Explicitly set device to avoid auto-detection issues
devices: "en+"

kubeProxyReplacement: true
# With kube-proxy replaced, Cilium cannot reach the API through a Service and
# needs a literal address. This is still the first control-plane node: switch it
# to the kube-vip VIP (control_plane_vip in ansible/inventory.yaml) only once
# that VIP is actually answering, or every Cilium pod loses the API server.
# See docs/operations/control-plane-vip.md.
k8sServiceHost: 10.9.2.1
k8sServicePort: 6443

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# Gateway API (replaces Ingress controller)
gatewayAPI:
  enabled: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 50
  burst: 200

encryption:
  enabled: true
  type: wireguard

hubble:
  enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
  relay:
    enabled: true
  ui:
    enabled: true
    # Ingress removed - using Gateway API HTTPRoute instead
