---
ipam:
  mode: kubernetes

# Explicitly set device to avoid auto-detection issues
devices: "en+"

kubeProxyReplacement: true
# Only change once the new address answers; see docs/platform/cilium.md.
k8sServiceHost: 10.9.2.1
k8sServicePort: 6443

# Needs the Prometheus operator CRDs from `make install-cilium` to render.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

dashboards:
  enabled: true

# cilium-agent has no memory limit on purpose; see docs/platform/cilium.md.
operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 112Mi
    limits:
      memory: 256Mi

envoy:
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      memory: 128Mi

gatewayAPI:
  enabled: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 50
  burst: 200

encryption:
  enabled: true
  type: wireguard

hubble:
  enabled: true
  metrics:
    # Dashboards need these labels. Applies at agent restart, not on sync.
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - port-distribution
      - icmp:labelsContext=source_namespace,destination_namespace
      - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
