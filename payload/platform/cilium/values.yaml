---
ipam:
  mode: kubernetes

# Explicitly set device to avoid auto-detection issues
devices: "en+"

kubeProxyReplacement: true
# With kube-proxy replaced, Cilium cannot reach the API through a Service and
# needs a literal address. This is still the first control-plane node: switch it
# to the kube-vip VIP (control_plane_vip in ansible/inventory.yaml) only once
# that VIP is actually answering, or every Cilium pod loses the API server.
# See docs/operations/control-plane-vip.md.
k8sServiceHost: 10.9.2.1
k8sServicePort: 6443

# The chart aborts the whole render when monitoring.coreos.com/v1 is missing, so
# these two depend on `make install-cilium` having landed the Prometheus
# operator CRDs first -- kube-prometheus-stack itself arrives sync-waves later.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

# The chart's own agent dashboard, as a `grafana_dashboard` ConfigMap in
# kube-system. Grafana's sidecar watches every namespace for those.
dashboards:
  enabled: true

# Memory limits sized from measured peak working set at roughly 2.5x. The
# cilium-agent DaemonSet is deliberately left without one: it peaked at 337Mi,
# it is the one process on the node whose death takes pod networking with it,
# and 23h of steady state is not enough to size something on that critical path.
# Tracked separately.

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 112Mi
    limits:
      memory: 256Mi

envoy:
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      memory: 128Mi

# Gateway API (replaces Ingress controller)
gatewayAPI:
  enabled: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 50
  burst: 200

encryption:
  enabled: true
  type: wireguard

hubble:
  enabled: true
  metrics:
    # Source and destination namespace on the flow-level metrics, because the
    # chart's per-namespace Hubble dashboards filter on exactly those labels
    # and show nothing without them. Namespace rather than workload or IP
    # keeps the series count to the square of the namespace count. HTTP adds
    # workloads for the L7 dashboard; it only has data for traffic Cilium
    # proxies at L7, which here is the Gateway.
    #
    # The agent reads this at startup: a change lands as nodes reboot or
    # Cilium upgrades, not on sync.
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - port-distribution
      - icmp:labelsContext=source_namespace,destination_namespace
      - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
    # The metrics above were exported on every node and read by nothing: the
    # hubble-metrics Service existed without a ServiceMonitor pointing at it.
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  ui:
    enabled: true
    # Ingress removed - using Gateway API HTTPRoute instead
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
