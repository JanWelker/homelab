---
ipam:
  mode: kubernetes

# Explicitly set device to avoid auto-detection issues
devices: "en+"

kubeProxyReplacement: true
# Only change once the new address answers; see docs/platform/cilium.md.
k8sServiceHost: 10.9.2.1
k8sServicePort: 6443

# Renders without the CRDs, as `make install-cilium` must; see docs/platform/cilium.md.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

dashboards:
  enabled: true

# cilium-agent has no memory limit on purpose; see docs/platform/cilium.md.
operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 112Mi
    limits:
      memory: 256Mi

envoy:
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      memory: 128Mi

gatewayAPI:
  enabled: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 50
  burst: 200

encryption:
  enabled: true
  type: wireguard

# Every policy is evaluated and logged, none enforced, for the observation week
# of the egress rollout; see docs/platform/security-policies.md#rollout.
# Applies at agent restart, not on sync. L7 rules are never audited.
policyAuditMode: true

hubble:
  enabled: true
  metrics:
    # Dashboards need these labels. Applies at agent restart, not on sync.
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - port-distribution
      - icmp:labelsContext=source_namespace,destination_namespace
      - httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
      - policy:labelsContext=source_namespace,destination_namespace
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
  # Policy verdicts to a file Alloy tails; see docs/platform/cilium.md
  export:
    fileMaxSizeMb: 10
    fileMaxBackups: 5
    static:
      enabled: true
      filePath: /var/run/cilium/hubble/events.log
      allowList:
        - '{"verdict":["DROPPED","ERROR","AUDIT"]}'
        # Requests the L7 rules see; the record the paths are tightened from.
        - '{"protocol":["http"]}'
      fieldMask:
        - time
        - verdict
        - drop_reason_desc
        - traffic_direction
        - event_type
        - is_reply
        - IP
        - l4
        - l7
        - source.identity
        - source.namespace
        - source.pod_name
        - source.workloads
        - destination.identity
        - destination.namespace
        - destination.pod_name
        - destination.workloads
        - destination_names
        - node_name
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
