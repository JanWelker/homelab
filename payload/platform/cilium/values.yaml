---
ipam:
  mode: kubernetes

# Explicitly set device to avoid auto-detection issues
devices: "en+"

kubeProxyReplacement: true
# With kube-proxy replaced, Cilium cannot reach the API through a Service and
# needs a literal address. This is still the first control-plane node: switch it
# to the kube-vip VIP (control_plane_vip in ansible/inventory.yaml) only once
# that VIP is actually answering, or every Cilium pod loses the API server.
# See docs/operations/control-plane-vip.md.
k8sServiceHost: 10.9.2.1
k8sServicePort: 6443

# The chart aborts the whole render when monitoring.coreos.com/v1 is missing, so
# these two depend on `make install-cilium` having landed the Prometheus
# operator CRDs first -- kube-prometheus-stack itself arrives sync-waves later.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

# Memory limits sized from measured peak working set at roughly 2.5x. The
# cilium-agent DaemonSet is deliberately left without one: it peaked at 337Mi,
# it is the one process on the node whose death takes pod networking with it,
# and 23h of steady state is not enough to size something on that critical path.
# Tracked separately.

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 112Mi
    limits:
      memory: 256Mi

envoy:
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      memory: 128Mi

# Gateway API (replaces Ingress controller)
gatewayAPI:
  enabled: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 50
  burst: 200

encryption:
  enabled: true
  type: wireguard

hubble:
  enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  ui:
    enabled: true
    # Ingress removed - using Gateway API HTTPRoute instead
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
