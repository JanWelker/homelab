---
# Hubble UI HTTPRoute - Infra Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: infra-gateway
      namespace: kube-system
  hostnames:
    - "hubble.infra.k8s.wlkr.ch"
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        # Hubble has no authentication of its own, so this points at the
        # Authentik embedded outpost rather than at hubble-ui. The outpost
        # authenticates and then proxies to hubble-ui internally; the
        # cross-namespace reference is permitted by the ReferenceGrant in
        # payload/platform/authentik/referencegrant.yaml.
        - name: authentik-server
          namespace: authentik
          port: 80
