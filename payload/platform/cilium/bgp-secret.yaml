---
# TCP MD5 password of the BGP session, typed on both ends; see
# docs/platform/cilium.md#bgp-session-password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bgp-router-password
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: bgp-router-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: cilium/bgp
        property: password
