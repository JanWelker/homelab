---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
  labels:
    homelab.wlkr.ch/stage: 11-policy
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://kubereboot.github.io/charts
    chart: kured
    targetRevision: 6.1.0
    helm:
      valuesObject:
        configuration:
          rebootSentinel: /var/run/reboot-required
          rebootCommand: /bin/systemctl reboot

          period: 30m
          # No startTime/endTime on purpose: reboots may happen at any hour.
          concurrency: 1

          lockTtl: 1h
          lockReleaseDelay: 10m

          drainTimeout: 15m
          drainGracePeriod: 120
          forceReboot: false

          prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          alertFiringOnly: true
          # Inverts the regex: listed alerts are the only ones that block.
          alertFilterMatchOnly: true
          # yamllint disable-line rule:line-length
          alertFilterRegexp: '^(CephClusterErrorState|CephClusterWarningState|CephOSDDown|CephPGsUnhealthy|CephPGsDegraded|CephPGsNotDeepScrubbed|CephMonQuorumAtRisk|CephMonQuorumLost|CephNodeDown|etcdMembersDown|etcdInsufficientMembers|etcdNoLeader|KubeNodeNotReady|KubeAPIDown)$'

          preferNoScheduleTaint: weave.works/kured-node-reboot
          annotateNodes: true
          logFormat: text

        metrics:
          create: true
          namespace: kured

        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kured
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
