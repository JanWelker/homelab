---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        valuesObject:
          # The operator is the only thing in this namespace; the databases it
          # runs live in their workload's namespace.
          crds:
            create: true

          # The pod also serves the admission webhooks (failurePolicy Fail);
          # see docs/platform/cloudnative-pg.md#configuration
          replicaCount: 2
          # Worker-only, so ScheduleAnyway; see docs/platform/index.md#replica-placement
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudnative-pg
                  app.kubernetes.io/instance: cloudnative-pg
          # See docs/platform/index.md#components
          priorityClassName: system-cluster-critical

          monitoring:
            podMonitorEnabled: true
            # Upstream's dashboard, rendered by the chart; Grafana's sidecar finds it here.
            grafanaDashboard:
              create: true

          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
    # Base backups and WAL to the object store; it must share the operator's
    # namespace. docs/platform/cloudnative-pg.md#backups
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      targetRevision: 0.8.1
      helm:
        valuesObject:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/cloudnative-pg
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
