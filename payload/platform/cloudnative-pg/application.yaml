---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.0
      helm:
        valuesObject:
          # The operator is the only thing in this namespace; the databases it
          # runs live in their workload's namespace.
          crds:
            create: true

          replicaCount: 1

          monitoring:
            podMonitorEnabled: true
            # Upstream's dashboard, rendered by the chart; Grafana's sidecar finds it here.
            grafanaDashboard:
              create: true

          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
