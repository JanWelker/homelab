---
# Every pod that does not opt out gets a projected API token mounted at
# /var/run/secrets/kubernetes.io/serviceaccount/token. For a workload that never
# calls the API server that is a credential handed to a process with no use for
# it, and the first thing anything with code execution in the container picks
# up.
#
# The `default` ServiceAccount is the worst case of this. Kubernetes creates one
# in every namespace whether or not anything uses it, nothing configures it, and
# a pod that names no serviceAccountName silently lands on it. Turning the mount
# off is the cheap half of the problem: a workload that reaches the API through
# the `default` SA is already a misconfiguration, so there is nothing here worth
# preserving.
#
# This is not retroactive. The token mount is decided at admission, so existing
# pods keep theirs until they are recreated. That makes this safe to roll out
# and also means the scan will not agree it is fixed until things restart.
#
# Two namespaces are deliberately absent, and both are absent because something
# actually runs on their `default` SA:
#
#   kube-system  -- etcd, kube-apiserver, kube-controller-manager and
#                   kube-scheduler all run there. They authenticate with client
#                   certificates from kubeconfigs on the node, not with the
#                   token, so removing it would very likely be fine. (kube-vip
#                   runs there too, on its own `kube-vip` SA.) "Very likely fine" is not the
#                   standard for the control plane.
#
#   authentik    -- authentik-server sets no serviceAccountName at all and so
#                   runs on `default`, while authentik-worker beside it uses the
#                   `authentik` SA. That asymmetry is an upstream chart default
#                   and wants fixing at the source rather than worked around
#                   here.
#
# Namespaces with no workloads at all (default, kube-public, kube-node-lease,
# gateway-system, cilium-secrets) are included anyway. Nothing is running to
# break, and leaving a mountable token in an empty namespace is exactly the
# thing that stops being harmless once something does get deployed there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: backup
# The one CronJob here that uses `default` is etcd-backup, which reads etcd with
# client certificates from a hostPath and uploads with S3 credentials from the
# environment. It never calls the Kubernetes API. Velero and its node-agent are
# on the `velero-server` SA and are unaffected.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cert-manager
automountServiceAccountToken: false
