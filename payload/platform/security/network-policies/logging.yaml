---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: logging
spec:
  description: >-
    Default-deny ingress for the logging stack. Alloy pushes to Loki, and
    Loki dials its own ClusterIP for the compactor and memberlist, all
    within the namespace. From outside it, Prometheus scrapes Loki and
    every Alloy, and Grafana queries Loki. Loki's scrape and query share
    one port, so the L7 rule is what tells them apart.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "12345"
              protocol: TCP
          rules:
            http:
              - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
          rules:
            http:
              - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: logging
spec:
  description: >-
    Default-deny egress for the logging stack. Alloy discovers the pods on
    its node through the API server, and Loki's rules sidecar watches
    ConfigMaps there.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki
  namespace: logging
spec:
  description: >-
    Loki keeps its chunks in the Ceph object store, plaintext S3 to the RGW
    pods, and its ruler sends the alerts it evaluates from logs to
    Alertmanager.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rook-ceph
            k8s:app: rook-ceph-rgw
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
