---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: openbao
spec:
  description: >-
    Default-deny ingress for OpenBao, allowing only the cluster's own
    traffic: peers within the namespace for Raft and request forwarding, the
    Gateway for the UI, Prometheus for the metrics endpoint on the active
    pod, the External Secrets controller for logins and kv reads, the
    homelab agent session, picked by its ServiceAccount since the writer may
    not run a pod as it, which checks status while it diagnoses, and the
    node for health probes. The API is plaintext behind the
    Gateway, so the callers inside the cluster are at L7: External Secrets logs in, checks and revokes its
    token, reads under kv/data and, for its PushSecrets, writes under
    kv/data and kv/metadata, mirroring its OpenBao policy (no delete). The
    nightly snapshot job in backup logs in, fetches the Raft snapshot and
    revokes its token.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /v1/sys/metrics\?format=prometheus$
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-homelab
            k8s:io.cilium.k8s.policy.serviceaccount: claude-reader
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /v1/sys/health(\?.*)?$
              - method: GET
                path: /v1/sys/seal-status$
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: backup
            k8s:app.kubernetes.io/name: openbao-snapshot
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
          rules:
            http:
              - method: PUT
                path: /v1/auth/kubernetes/login$
              - method: GET
                path: /v1/sys/storage/raft/snapshot$
              - method: PUT
                path: /v1/auth/token/revoke-self$
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: external-secrets
            k8s:app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /v1/auth/token/lookup-self$
              - method: PUT
                path: /v1/auth/kubernetes/login$
              - method: PUT
                path: /v1/auth/token/revoke-self$
              - method: GET
                path: /v1/kv/(data|metadata)/.*
              - method: PUT|POST
                path: /v1/kv/(data|metadata)/.*
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: openbao
spec:
  description: >-
    Default-deny egress for OpenBao. Raft, retry_join and standby forwarding
    stay within the namespace. The API server answers the TokenReview
    behind every Kubernetes-auth login and receives the pod's own
    active/sealed labels.
    Shamir seal, file audit: nothing outside the cluster.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
