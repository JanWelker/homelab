---
# Only the pod-networked workloads: the agents, Envoy, kube-vip and the
# control plane are host-networked and have no endpoint to select.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns
  namespace: kube-system
spec:
  description: >-
    CoreDNS answers every endpoint in the cluster, hosts included, forwards
    what it does not know to the node's resolver on the LAN, and watches
    Services and EndpointSlices in the API server. Prometheus reads its
    metrics and the node probes it.
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
          rules:
            http:
              - {}
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-relay
  namespace: kube-system
spec:
  description: >-
    Hubble Relay serves the flows API to the UI and to the hubble CLI
    through a port-forward, which arrives from the node. It reads the flows
    from the agent on every node over mTLS, after finding them through the
    hubble-peer Service.
  endpointSelector:
    matchLabels:
      k8s-app: hubble-relay
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s-app: hubble-ui
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  description: >-
    The Hubble UI sits behind the Authentik outpost, so its requests come
    from the authentik namespace, not from the Gateway. Its backend talks
    to Relay for the flows and to the API server for the namespace, pod
    and service lists it decorates them with.
  endpointSelector:
    matchLabels:
      k8s-app: hubble-ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
          rules:
            http:
              - {}
    - fromEntities:
        - host
        - remote-node
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "4245"
              protocol: TCP
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  description: >-
    The API server calls metrics-server through the aggregation layer,
    from whichever node it runs on, and Prometheus scrapes the same TLS
    port. metrics-server in turn reads every kubelet by node address and
    registers with the API server.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tetragon-operator
  namespace: kube-system
spec:
  description: >-
    The Tetragon operator installs the CRDs and watches the policies, all
    through the API server. Prometheus scrapes it and the node probes it.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tetragon-operator
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "2113"
              protocol: TCP
          rules:
            http:
              - {}
  egress:
    - toEntities:
        - kube-apiserver
