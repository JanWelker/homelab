---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: external-secrets
spec:
  description: >-
    Default-deny ingress for the External Secrets Operator. The webhook is
    called by the API server from the node, the node runs the probes, and
    Prometheus reads the metrics port of all three components. Nothing else
    needs to reach it.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: external-secrets
spec:
  description: >-
    Default-deny egress for the External Secrets Operator. All three
    components have a Kubernetes client: the controller writes Secrets, the
    cert controller patches the CA bundle onto the webhook, the webhook
    exits without a token. The only other destination is OpenBao, below.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-controller
  namespace: external-secrets
spec:
  description: >-
    The controller logs in to OpenBao with its ServiceAccount token and
    reads every kv path an ExternalSecret names, hourly and on demand. The
    ClusterSecretStore points at the plain openbao Service, so any of the
    three pods may answer and forward to the active one. This hop is the
    whole secrets chain: wrong, and every ExternalSecret reads
    SecretSyncedError.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
            k8s:app.kubernetes.io/name: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
