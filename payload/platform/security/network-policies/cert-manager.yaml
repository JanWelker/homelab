---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: cert-manager
spec:
  description: >-
    Default-deny ingress for cert-manager. It is a client of everything and a
    server to almost nothing -- only the webhook, which the API server calls
    from the node.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
