---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: backup
spec:
  description: >-
    Default-deny ingress for the backup namespace. Velero, the node agent
    and the snapshot controller are clients of the API server and the
    object store; the only things that connect to them are the node for
    probes and Prometheus on Velero's metrics port.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics$
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: backup
spec:
  description: >-
    Default-deny egress for the backup namespace. Everything here
    reconciles through the API server. Velero checks its store every
    minute and the data-mover pods the node agent starts each night carry
    the volume data to it: S3 over TLS through the infra Gateway, whose
    address the datapath classifies as world, hence the name rule. The
    movers are created with Velero's own labels, so the rule is for the
    namespace. The etcd CronJob is host-networked and outside any policy.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        - matchName: s3.infra.k8s.wlkr.ch
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
