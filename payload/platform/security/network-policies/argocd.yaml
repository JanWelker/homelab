---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: argocd
spec:
  description: >-
    Default-deny ingress for Argo CD. The components talk to each other
    within the namespace (server and controllers to the repo-server and to
    Redis through HAProxy, HAProxy to the Redis sentinels every second) and
    the node runs the probes. What comes from outside is per workload: the
    Gateway reaches the server, Prometheus the four metrics ports.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-server
  namespace: argocd
spec:
  description: >-
    The UI and API arrive from the Gateway on the plaintext port, since the
    server runs with --insecure and TLS ends at Envoy. The homelab agent
    session calls the same port directly; it carries gRPC as
    well as HTTP, so the rules are L4. Prometheus reads the metrics port.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-homelab
            k8s:io.cilium.k8s.policy.serviceaccount: claude-reader
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics$
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-metrics
  namespace: argocd
spec:
  description: >-
    Prometheus reads the metrics port of the repo-server, the application
    controller and the ApplicationSet controller. The notifications
    controller and HAProxy expose one too, but nothing scrapes them.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-repo-server
          - argocd-application-controller
          - argocd-applicationset-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8084"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics$
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: argocd
spec:
  description: >-
    Default-deny egress for Argo CD. Everything may reach its peers in the
    namespace. The API server and the outside world are per workload
    below.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-controllers
  namespace: argocd
spec:
  description: >-
    Argo CD manages every workload through the API server and never dials a
    workload pod. The server and both controllers have a Kubernetes client, and so does the chart's Redis secret
    init Job, which writes the Redis password on every sync; the repo-server
    and Redis itself do not.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-server
          - argocd-application-controller
          - argocd-applicationset-controller
          - argocd-redis-secret-init
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-server-oidc
  namespace: argocd
spec:
  description: >-
    Every login and token refresh calls Authentik through its public name,
    which resolves to the infra Gateway's own address. Cilium classifies that
    hairpin as world, so one rule names the address by its FQDN. The
    Gateway's Envoy then checks this policy again against the Authentik
    server pod it picks, and answers 403 itself when the pod is not
    listed, audit mode or not, so the second rule names the pod. Without
    both the login fails, and the local admin is disabled.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.k8s.wlkr.ch
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  description: >-
    The repo-server fetches the two Git repositories on GitHub, the
    Gateway API CRDs, and every Helm
    repository an application.yaml names, each by name. Most are GitHub
    Pages with tarballs served from githubusercontent.com, the one
    wildcard, since its CDN names are not stable; the OCI charts come from
    ghcr.io, whose blobs are on githubusercontent.com too. A new chart
    repository needs a line here, or the Application reads
    "ComparisonError" within a minute.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchName: ghcr.io
        # security-profiles-operator: the chart is on registry.k8s.io, whose
        # blobs redirect to Artifact Registry and the regional S3 mirrors.
        - matchName: registry.k8s.io
        - matchPattern: "**.pkg.dev"
        - matchPattern: "prod-registry-k8s-io-*.s3.dualstack.*.amazonaws.com"
        - matchName: prometheus-community.github.io
        - matchName: cloudnative-pg.github.io
        - matchName: vmware-tanzu.github.io
        - matchName: postfinance.github.io
        - matchName: openbao.github.io
        - matchName: kubernetes-sigs.github.io
        - matchName: kubereboot.github.io
        - matchName: grafana.github.io
        - matchName: grafana-community.github.io
        - matchName: argoproj.github.io
        - matchName: aquasecurity.github.io
        - matchName: dependencytrack.github.io
        - matchPattern: "**.githubusercontent.com"
        - matchName: charts.goauthentik.io
        - matchName: charts.jetstack.io
        - matchName: charts.external-secrets.io
        # charts.external-secrets.io redirects its index here.
        - matchName: external-secrets.io
        - matchName: helm.cilium.io
        - matchName: charts.rook.io
        - matchName: robusta-charts.storage.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
