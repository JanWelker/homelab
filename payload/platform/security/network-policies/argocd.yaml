---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: argocd
spec:
  description: >-
    Default-deny ingress for Argo CD. The components talk to each other
    within the namespace (server and controllers to the repo-server and to
    Redis through HAProxy, HAProxy to the Redis sentinels every second) and
    the node runs the probes. What comes from outside is per workload: the
    Gateway reaches the server, Prometheus the four metrics ports.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-server
  namespace: argocd
spec:
  description: >-
    The UI and API arrive from the Gateway on the plaintext port, since the
    server runs with --insecure and TLS ends at Envoy. The homelab agent
    session calls the same port directly; it carries gRPC as well as
    HTTP, so the rule is L4. Prometheus reads the metrics port.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: claude-agents
            k8s:app.kubernetes.io/instance: claude-homelab
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8083"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics$
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-metrics
  namespace: argocd
spec:
  description: >-
    Prometheus reads the metrics port of the repo-server, the application
    controller and the ApplicationSet controller. The notifications
    controller, dex and HAProxy expose one too, but nothing scrapes them.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-repo-server
          - argocd-application-controller
          - argocd-applicationset-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8084"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics$
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: argocd
spec:
  description: >-
    Default-deny egress for Argo CD. Everything may reach its peers in the
    namespace. The API server and the outside world are per workload
    below.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-controllers
  namespace: argocd
spec:
  description: >-
    Argo CD manages every workload through the API server and never dials a
    workload pod. The server, both controllers, the notifications controller
    and dex have a Kubernetes client, and so does the chart's Redis secret
    init Job, which writes the Redis password on every sync; the repo-server
    and Redis itself do not.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - argocd-server
          - argocd-application-controller
          - argocd-applicationset-controller
          - argocd-notifications-controller
          - argocd-dex-server
          - argocd-redis-secret-init
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-server-oidc
  namespace: argocd
spec:
  description: >-
    Every login and token refresh calls Authentik through its public name,
    which resolves to the infra Gateway's own address. Cilium classifies that
    hairpin as world, so one rule names the address by its FQDN. The
    Gateway's Envoy then checks this policy again against the Authentik
    server pod it picks, and answers 403 itself when the pod is not
    listed, audit mode or not, so the second rule names the pod. Without
    both the login fails, and the local admin is disabled.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.k8s.wlkr.ch
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  description: >-
    The repo-server fetches the two Git repositories on GitHub, the
    Gateway API CRDs, and every Helm
    repository an application.yaml names. Most of those are GitHub Pages
    with tarballs served from githubusercontent.com; the OCI charts come
    from ghcr.io, whose blobs are on githubusercontent.com too; the rest
    are listed by name. A new chart repository needs a line here, or the Application
    reads "ComparisonError" within a minute.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchName: ghcr.io
        - matchPattern: "**.github.io"
        - matchPattern: "**.githubusercontent.com"
        - matchName: charts.goauthentik.io
        - matchName: charts.jetstack.io
        - matchName: charts.external-secrets.io
        # charts.external-secrets.io redirects its index here.
        - matchName: external-secrets.io
        - matchName: helm.cilium.io
        - matchName: charts.rook.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
spec:
  description: >-
    The previews ApplicationSet lists the open pull requests of the two
    neighbourhood sites through GitHub's REST API, once a minute.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-applicationset-controller
  egress:
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
