---
# Rules every pod gets; see docs/platform/security-policies.md#cluster-wide-rules
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: dns
spec:
  description: >-
    Every pod may ask kube-dns, through the DNS proxy, so a toFQDNs rule
    works in any namespace and every lookup is visible in Hubble. The
    rule used to be repeated in every namespace's default-egress and was
    the same each time. The selector takes every endpoint that has a
    namespace, that is every pod, and not the reserved ones: an empty
    selector also takes the Gateway's own ingress endpoint, and an egress
    rule on that one makes its Envoy answer 403 to every caller from
    inside the cluster. enableDefaultDeny is off in both directions
    because a cluster-wide policy with an egress rule would otherwise put
    every pod without a policy of its own into egress default-deny.
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: Exists
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: init
spec:
  description: >-
    A pod whose labels the agent has not resolved yet carries the
    reserved init identity for its first seconds, and no namespace policy
    selects it. Without this policy the audit log showed its DNS lookups,
    the kubelet's probes and lookups sent to a CoreDNS pod still starting
    as denied. This admits exactly those; anything else waits for the real
    identity, a retransmit later. DNS goes through the proxy so the
    answers are in the pod's name cache once its identity arrives.
  endpointSelector:
    matchLabels:
      reserved:init: ""
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
