---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: monitoring
spec:
  description: >-
    Default-deny ingress for the monitoring stack. Grafana is reached
    through the Gateway; Prometheus and Alertmanager are reached by each
    other and by Grafana within the namespace. Four callers come from
    outside it. Kured queries Prometheus before every reboot and blocks
    when the query fails, so without that rule no node ever reboots. The
    Authentik outpost proxies Prometheus and Alertmanager behind SSO. The
    Ceph mgr reads Prometheus for its alerts and Grafana for its embedded
    panels. Loki's ruler sends the alerts it evaluates from logs to
    Alertmanager. All four are plaintext HTTP, so all four are at L7.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kured
            k8s:app.kubernetes.io/name: kured
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
          rules:
            http:
              - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: logging
            k8s:app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
          rules:
            http:
              - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
          rules:
            http:
              - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rook-ceph
            k8s:app: rook-ceph-mgr
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "3000"
              protocol: TCP
          rules:
            http:
              - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: monitoring
spec:
  description: >-
    Default-deny egress for the monitoring stack. Prometheus discovers its
    targets, Grafana's sidecars watch dashboards in every namespace,
    kube-state-metrics lists thirty kinds and the operator reconciles its
    CRDs, all through the API server. Alertmanager has no token and
    nothing to say to it.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  description: >-
    Prometheus scrapes two kinds of target. Host-networked ones are the
    node itself: kubelet, node-exporter, the Cilium agent and Hubble,
    Tetragon, and on control-plane nodes the API server, controller
    manager, scheduler, etcd and the Cilium operator, each on its own
    port. Pod-networked ones may sit in any namespace and any new
    ServiceMonitor adds one, so this side names no ports: the target's own
    ingress policy is what limits the scraper to its metrics port and
    path.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9965"
              protocol: TCP
            - port: "2112"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "10257"
              protocol: TCP
            - port: "10259"
              protocol: TCP
            - port: "2381"
              protocol: TCP
            - port: "9963"
              protocol: TCP
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  description: >-
    Grafana queries Loki for the log panels and exchanges every login's
    code for a token at Authentik through its public name. That name is
    the infra Gateway's own address, world to Cilium, and the Gateway's
    Envoy then checks this policy against the Authentik server pod it
    picks, so both the name and the pod are listed. grafana.com is asked
    every ten minutes whether the plugins are current.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: logging
            k8s:app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
            k8s:app.kubernetes.io/name: authentik
            k8s:app.kubernetes.io/component: server
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toFQDNs:
        - matchName: auth.infra.k8s.wlkr.ch
        - matchName: grafana.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  description: >-
    Alertmanager's one receiver is mail through the relay, TLS on 465.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  egress:
    - toFQDNs:
        - matchName: smtp.mailbox.org
      toPorts:
        - ports:
            - port: "465"
              protocol: TCP
