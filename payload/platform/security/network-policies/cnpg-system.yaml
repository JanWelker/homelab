---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: cnpg-system
spec:
  description: >-
    Default-deny ingress for the CloudNativePG operator. The API server
    calls its webhooks from the node, Prometheus scrapes the metrics port.
    The databases are not here; each runs in its workload's namespace
    behind that namespace's own policy.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-egress
  namespace: cnpg-system
spec:
  description: >-
    Default-deny egress for the CloudNativePG operator. It reconciles
    through the API server and polls every instance it manages on the
    status port, wherever that instance runs, which is why the target is
    the instance label rather than a namespace list. The port is TLS, so
    the rule stays at L4.
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/podRole: instance
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
