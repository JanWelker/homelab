---
# Image references every container must carry; see docs/platform/security-policies.md
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-tag-pinned
spec:
  # Ignore: a policy bug must not stop every pod in the cluster. A real
  # violation is still refused; only an evaluation error is let through.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      # kubectl debug adds a container to a running pod
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.image) +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers.map(c, c.image) : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers.map(c, c.image) : [])
  validations:
    - expression: >-
        variables.images.all(i,
          i.matches('@sha256:[0-9a-f]{64}$') ||
          (i.matches('^([^/]+/)*[^/:@]+:[^/:@]+$') && !i.endsWith(':latest')))
      message: >-
        Every container image must name a tag other than "latest" or a digest.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-tag-pinned
spec:
  policyName: image-tag-pinned
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-registry-allowed
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
      # kubectl debug adds a container to a running pod
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.image) +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers.map(c, c.image) : []) +
        (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers.map(c, c.image) : [])
  validations:
    # A first component without a dot or a port is not a registry: the
    # runtime reads such a reference from docker.io. ECR Public answers to
    # both of its names.
    - expression: >-
        variables.images.all(i,
          !i.matches('^[^/]*[.:][^/]*/') ||
          i.matches('^(docker[.]io|ecr-public[.]aws[.]com|public[.]ecr[.]aws|ghcr[.]io|mirror[.]gcr[.]io|quay[.]io|registry[.]k8s[.]io)/'))
      message: >-
        Container image comes from a registry outside the allowlist.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-registry-allowed
spec:
  policyName: image-registry-allowed
  validationActions: ["Deny"]
---
# What a pod written by the claude-writer agent may not ask for, in any
# namespace; see docs/platform/security-policies.md#agent-rbac
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: claude-writer-pod-limits
spec:
  # Fail: the match condition limits the policy to one identity, so a policy
  # bug stops the agent, never the cluster.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: claude-writer
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:claude-') &&
        request.userInfo.username.endsWith(':claude-writer')
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
    - name: serviceAccount
      expression: >-
        has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName != '' ?
        variables.podSpec.serviceAccountName : 'default'
    # An update may keep the ServiceAccount the workload already runs as.
    - name: oldServiceAccount
      expression: >-
        request.operation != 'UPDATE' ? 'default' :
        oldObject.kind == 'Pod' ?
          (has(oldObject.spec.serviceAccountName) ? oldObject.spec.serviceAccountName : 'default') :
        oldObject.kind == 'CronJob' ?
          (has(oldObject.spec.jobTemplate.spec.template.spec.serviceAccountName) ?
            oldObject.spec.jobTemplate.spec.template.spec.serviceAccountName : 'default') :
        (has(oldObject.spec.template.spec.serviceAccountName) ?
          oldObject.spec.template.spec.serviceAccountName : 'default')
  validations:
    - expression: >-
        !(has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork) &&
        !(has(variables.podSpec.hostPID) && variables.podSpec.hostPID) &&
        !(has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC)
      message: The agent may not create pods in the host's namespaces.
      reason: Forbidden
    - expression: >-
        !has(variables.podSpec.volumes) ||
        variables.podSpec.volumes.all(v, !has(v.hostPath))
      message: The agent may not mount host paths.
      reason: Forbidden
    - expression: >-
        variables.containers.all(c,
          !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))
      message: The agent may not create privileged containers.
      reason: Forbidden
    - expression: >-
        variables.serviceAccount == 'default' ||
        variables.serviceAccount == variables.oldServiceAccount
      message: >-
        The agent may only run pods as the namespace's default ServiceAccount,
        or keep the one a workload already uses.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: claude-writer-pod-limits
spec:
  policyName: claude-writer-pod-limits
  validationActions: ["Deny"]
---
# A namespace outside the platform's list cannot opt out of Pod Security;
# see docs/platform/security-policies.md#admission-policies
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: namespace-privileged-allowed
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    # The namespaces pod-security.yaml labels privileged, and nothing else.
    - name: allowed
      expression: >-
        ['kube-system', 'rook-ceph', 'node-exporter', 'trivy-system',
         'backup', 'logging', 'kured', 'security-profiles-operator']
  validations:
    - expression: >-
        !has(object.metadata.labels) ||
        !('pod-security.kubernetes.io/enforce' in object.metadata.labels) ||
        object.metadata.labels['pod-security.kubernetes.io/enforce'] != 'privileged' ||
        object.metadata.name in variables.allowed
      messageExpression: >-
        'Namespace ' + object.metadata.name + ' may not enforce the privileged Pod Security level; only platform namespaces may.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: namespace-privileged-allowed
spec:
  policyName: namespace-privileged-allowed
  validationActions: ["Deny"]
---
# The apps project reaches authentik for the workloads' blueprint ConfigMaps
# only; see docs/platform/security-policies.md#admission-policies
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: authentik-foreign-objects
spec:
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: authentik
    # A namespaceSelector does not filter cluster-scoped objects; without the
    # scope this policy judged every one of them, in no namespace at all.
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
        scope: Namespaced
  # Only what an Argo CD Application applied; controllers and kubectl carry no tracking id.
  matchConditions:
    - name: tracked-by-argocd
      expression: >-
        has(object.metadata.annotations) &&
        'argocd.argoproj.io/tracking-id' in object.metadata.annotations
  variables:
    # <application>:<group>/<kind>:<namespace>/<name>
    - name: application
      expression: >-
        object.metadata.annotations['argocd.argoproj.io/tracking-id'].split(':')[0]
  validations:
    - expression: variables.application in ['authentik', 'security']
      messageExpression: >-
        'Application ' + variables.application + ' may not create objects in authentik.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: authentik-foreign-objects
spec:
  policyName: authentik-foreign-objects
  validationActions: ["Deny"]
---
# Platform and KV-prefix namespace names belong to the platform Applications;
# see docs/platform/security-policies.md#admission-policies
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: namespace-name-guard
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  # Only what an Argo CD Application applied; controllers and kubectl carry no tracking id.
  matchConditions:
    - name: tracked-by-argocd
      expression: >-
        has(object.metadata.annotations) &&
        'argocd.argoproj.io/tracking-id' in object.metadata.annotations
  variables:
    # <application>:<group>/<kind>:<namespace>/<name>
    - name: application
      expression: >-
        object.metadata.annotations['argocd.argoproj.io/tracking-id'].split(':')[0]
    # The Applications of the infra and system projects.
    - name: platform
      expression: >-
        ['alloy', 'argocd', 'argocd-config', 'argocd-projects', 'arc-controller',
         'arc-runners', 'authentik', 'backup', 'cert-manager', 'certificates',
         'cilium', 'cloudnative-pg', 'descheduler', 'external-dns',
         'external-secrets', 'gateway-api', 'gateway-api-crds', 'kube-prometheus-stack',
         'kube-vip', 'kubelet-csr-approver', 'kured', 'logging', 'loki',
         'metrics-server', 'openbao', 'prometheus-operator-crds', 'rook-ceph',
         'rook-ceph-cluster', 'rook-ceph-operator', 'security',
         'security-profiles-operator', 'snapshot-controller', 'tetragon', 'trivy-operator', 'velero', 'workloads']
    # The platform's namespaces, and the top-level KV prefixes no workload may
    # be named after: the agent sessions' `claude-<session>` and `velero`.
    - name: reserved
      expression: >-
        object.metadata.name in ['arc-jobs', 'arc-runners', 'arc-systems', 'argocd', 'authentik', 'backup',
         'cert-manager', 'cilium-secrets', 'cnpg-system', 'default', 'descheduler',
         'external-dns', 'external-secrets', 'gateway-system', 'kured', 'logging',
         'monitoring', 'node-exporter', 'openbao', 'rook-ceph',
         'security-profiles-operator', 'trivy-system', 'velero'] ||
        object.metadata.name.startsWith('kube-') ||
        object.metadata.name.startsWith('claude-')
  validations:
    - expression: >-
        !variables.reserved || variables.application in variables.platform
      messageExpression: >-
        'Namespace ' + object.metadata.name + ' is a platform or OpenBao prefix name; Application ' +
        variables.application + ' may not apply it.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: namespace-name-guard
spec:
  policyName: namespace-name-guard
  validationActions: ["Deny"]
---
# bucketOwner hands a claim the keys of the user it names; only the offsite
# copy's bucket may use it. See docs/platform/security-policies.md#admission-policies
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: obc-bucket-owner
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["objectbucket.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["objectbucketclaims"]
  validations:
    - expression: >-
        !has(object.spec.additionalConfig) ||
        !('bucketOwner' in object.spec.additionalConfig) ||
        (object.metadata.namespace == 'backup' &&
         object.metadata.name == 'offsite-bucket' &&
         object.spec.additionalConfig['bucketOwner'] == 'offsite-reader')
      message: >-
        Only backup/offsite-bucket may set additionalConfig.bucketOwner, and
        only to offsite-reader.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: obc-bucket-owner
spec:
  policyName: obc-bucket-owner
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: object-store-user-scope
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["ceph.rook.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cephobjectstoreusers"]
  validations:
    - expression: >-
        object.metadata.namespace == 'rook-ceph' ||
        object.metadata.name.startsWith(object.metadata.namespace + '.')
      message: >-
        Outside rook-ceph an object store user is named <namespace>.<purpose>:
        its S3 user ID is the name, one ID space for every namespace.
      reason: Forbidden
    - expression: >-
        object.metadata.namespace == 'rook-ceph' ||
        !has(object.spec.capabilities)
      message: >-
        Only users in rook-ceph may carry admin capabilities.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: object-store-user-scope
spec:
  policyName: object-store-user-scope
  validationActions: ["Deny"]
---
# The three below keep a backup from being forgotten: what is not backed up
# says so, with a reason. See docs/operations/backups.md#off-cluster-copy
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cnpg-cluster-backed-up
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["postgresql.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusters"]
  # The operator's finalizer removal must not be refused
  matchConditions:
    - name: not-deleting
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: exempt
      expression: >-
        has(object.metadata.annotations) &&
        'homelab.wlkr.ch/backup-exempt' in object.metadata.annotations &&
        object.metadata.annotations['homelab.wlkr.ch/backup-exempt'] != ''
  validations:
    - expression: >-
        variables.exempt ||
        (has(object.spec.plugins) && object.spec.plugins.exists(p,
          p.name == 'barman-cloud.cloudnative-pg.io' &&
          has(p.isWALArchiver) && p.isWALArchiver))
      message: >-
        A CloudNativePG Cluster archives its WAL through the Barman Cloud
        plugin, or carries homelab.wlkr.ch/backup-exempt with the reason.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cnpg-cluster-backed-up
spec:
  policyName: cnpg-cluster-backed-up
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cnpg-objectstore-offsite
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["barmancloud.cnpg.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["objectstores"]
  # The operator's finalizer removal must not be refused
  matchConditions:
    - name: not-deleting
      expression: "!has(object.metadata.deletionTimestamp)"
  validations:
    - expression: >-
        (has(object.metadata.annotations) &&
         'homelab.wlkr.ch/backup-exempt' in object.metadata.annotations &&
         object.metadata.annotations['homelab.wlkr.ch/backup-exempt'] != '') ||
        object.spec.configuration.destinationPath.startsWith(
          's3://offsite/' + object.metadata.namespace + '.')
      message: >-
        A Barman Cloud ObjectStore writes to s3://offsite/<namespace>.<purpose>/,
        the prefix TrueNAS pulls, or carries homelab.wlkr.ch/backup-exempt with
        the reason.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cnpg-objectstore-offsite
spec:
  policyName: cnpg-objectstore-offsite
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: obc-backup-exempt
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["objectbucket.io"]
        apiVersions: ["v1alpha1"]
        # Rook updates every claim it binds, the leftover ones included
        operations: ["CREATE"]
        resources: ["objectbucketclaims"]
  validations:
    - expression: >-
        has(object.metadata.annotations) &&
        'homelab.wlkr.ch/backup-exempt' in object.metadata.annotations &&
        object.metadata.annotations['homelab.wlkr.ch/backup-exempt'] != ''
      message: >-
        Nothing copies a bucket off the cluster: a claim carries
        homelab.wlkr.ch/backup-exempt with the reason, and data worth keeping
        goes into a backup writer's prefix of offsite instead.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: obc-backup-exempt
spec:
  policyName: obc-backup-exempt
  validationActions: ["Deny"]
---
# Route hostnames the Gateways must not hand to a workload; see docs/platform/gateway-api.md#route-hostnames
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: route-hostnames-reserved
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes", "grpcroutes", "tlsroutes"]
  variables:
    - name: hosts
      expression: >-
        has(object.spec.hostnames) ? object.spec.hostnames : []
    # The namespaces the infra-gateway listener admits, kept in step with its allowedRoutes
    - name: platform
      expression: >-
        ['argocd', 'dependency-track', 'kube-system', 'monitoring', 'openbao', 'opencloud', 'rook-ceph']
    - name: owners
      expression: >-
        {'auth.k8s.wlkr.ch': 'authentik',
         'advent.wollbi.ch': 'advent-wollbi',
         'fest.wollbi.ch': 'fest-wollbi'}
  validations:
    - expression: >-
        object.metadata.namespace in variables.platform ||
        variables.hosts.all(h, !h.endsWith('.infra.k8s.wlkr.ch') && !h.startsWith('*'))
      message: >-
        Only the platform namespaces may claim a *.infra.k8s.wlkr.ch name or a
        wildcard hostname.
      reason: Forbidden
    - expression: >-
        variables.hosts.all(h, !h.endsWith('.ssh.wlkr.ch') ||
          (object.metadata.namespace.startsWith('claude-') &&
           h == object.metadata.namespace.substring(7) + '.ssh.wlkr.ch'))
      message: Only claude-<session> may claim <session>.ssh.wlkr.ch.
      reason: Forbidden
    - expression: >-
        variables.hosts.all(h, !(h in variables.owners) ||
          variables.owners[h] == object.metadata.namespace)
      message: >-
        This hostname belongs to another namespace; see Route hostnames in
        docs/platform/gateway-api.md.
      reason: Forbidden
    # A route without hostnames matches every name its listener serves
    - expression: >-
        object.metadata.namespace == 'kube-system' || size(variables.hosts) > 0
      message: Only kube-system may attach a route without hostnames.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: route-hostnames-reserved
spec:
  policyName: route-hostnames-reserved
  validationActions: ["Deny"]
---
# Who may use the ClusterIssuers and for which names; see docs/platform/cert-manager.md#issuer-scope
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: certificate-issuer-scope
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificates"]
  matchConditions:
    - name: cluster-issuer
      expression: >-
        has(object.spec.issuerRef.kind) && object.spec.issuerRef.kind == 'ClusterIssuer'
  variables:
    - name: names
      expression: >-
        (has(object.spec.dnsNames) ? object.spec.dnsNames : []) +
        (has(object.spec.commonName) ? [object.spec.commonName] : [])
  validations:
    - expression: >-
        object.metadata.namespace == 'kube-system' ||
        (object.metadata.namespace.startsWith('claude-') &&
         variables.names.all(n, n == object.metadata.namespace.substring(7) + '.ssh.wlkr.ch'))
      message: >-
        A ClusterIssuer certificate comes from kube-system, or from claude-<session>
        for <session>.ssh.wlkr.ch.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: certificate-issuer-scope
spec:
  policyName: certificate-issuer-scope
  validationActions: ["Deny"]
---
# Only DNS-01 is used, so the controller has no pod to create; see docs/platform/cert-manager.md#pods-from-the-controllers
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controller-pod-limits
spec:
  # Fail: the match conditions limit the policy to two identities, so a policy
  # bug stops those, never the cluster.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: controllers
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:cert-manager:cert-manager',
          'system:serviceaccount:cnpg-system:cloudnative-pg']
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:cert-manager:cert-manager'
      message: cert-manager solves DNS-01 only and creates no pods.
      reason: Forbidden
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC) &&
        (!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))) &&
        variables.containers.all(c,
          !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))
      message: The CloudNativePG operator may not create pods with host access.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: controller-pod-limits
spec:
  policyName: controller-pod-limits
  validationActions: ["Deny"]
---
# A full object store stops every writer; see docs/platform/rook-ceph.md#quotas
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: object-store-quota
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["ceph.rook.io"]
        apiVersions: ["v1"]
        # Rook updates every user it reconciles, the existing ones included
        operations: ["CREATE"]
        resources: ["cephobjectstoreusers"]
      - apiGroups: ["objectbucket.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["objectbucketclaims"]
  validations:
    - expression: >-
        object.kind != 'CephObjectStoreUser' ||
        object.metadata.namespace == 'rook-ceph' ||
        (has(object.spec.quotas) && has(object.spec.quotas.maxSize))
      message: >-
        An object store user outside rook-ceph sets spec.quotas.maxSize.
      reason: Invalid
    - expression: >-
        object.kind != 'ObjectBucketClaim' ||
        (has(object.spec.additionalConfig) && 'maxSize' in object.spec.additionalConfig)
      message: >-
        An ObjectBucketClaim sets maxSize in additionalConfig.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: object-store-quota
spec:
  policyName: object-store-quota
  # Measured, not enforced: no object in the cluster carries a quota yet.
  validationActions: ["Audit", "Warn"]
