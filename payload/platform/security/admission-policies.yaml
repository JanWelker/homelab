---
# Image references every container must carry; see docs/platform/security-policies.md
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-tag-pinned
spec:
  # Ignore: a policy bug must not stop every pod in the cluster. A real
  # violation is still refused; only an evaluation error is let through.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.image) +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers.map(c, c.image) : [])
  validations:
    - expression: >-
        variables.images.all(i,
          i.matches('@sha256:[0-9a-f]{64}$') ||
          (i.matches('^([^/]+/)*[^/:@]+:[^/:@]+$') && !i.endsWith(':latest')))
      message: >-
        Every container image must name a tag other than "latest" or a digest.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-tag-pinned
spec:
  policyName: image-tag-pinned
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-registry-allowed
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: images
      expression: >-
        variables.podSpec.containers.map(c, c.image) +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers.map(c, c.image) : [])
  validations:
    # A first component without a dot or a port is not a registry: the
    # runtime reads such a reference from docker.io. ECR Public answers to
    # both of its names.
    - expression: >-
        variables.images.all(i,
          !i.matches('^[^/]*[.:][^/]*/') ||
          i.matches('^(docker[.]io|ecr-public[.]aws[.]com|public[.]ecr[.]aws|ghcr[.]io|mirror[.]gcr[.]io|quay[.]io|registry[.]k8s[.]io)/'))
      message: >-
        Container image comes from a registry outside the allowlist.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-registry-allowed
spec:
  policyName: image-registry-allowed
  # Measured, not enforced: the audit log records what a Deny would refuse.
  validationActions: ["Audit", "Warn"]
---
# What a pod written by the claude-writer agent may not ask for, in any
# namespace; see docs/platform/security-policies.md#agent-rbac
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: claude-writer-pod-limits
spec:
  # Fail: the match condition limits the policy to one identity, so a policy
  # bug stops the agent, never the cluster.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: claude-writer
      expression: >-
        request.userInfo.username == 'system:serviceaccount:claude-agents:claude-writer'
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
    - name: serviceAccount
      expression: >-
        has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName != '' ?
        variables.podSpec.serviceAccountName : 'default'
    # An update may keep the ServiceAccount the workload already runs as.
    - name: oldServiceAccount
      expression: >-
        request.operation != 'UPDATE' ? 'default' :
        oldObject.kind == 'Pod' ?
          (has(oldObject.spec.serviceAccountName) ? oldObject.spec.serviceAccountName : 'default') :
        oldObject.kind == 'CronJob' ?
          (has(oldObject.spec.jobTemplate.spec.template.spec.serviceAccountName) ?
            oldObject.spec.jobTemplate.spec.template.spec.serviceAccountName : 'default') :
        (has(oldObject.spec.template.spec.serviceAccountName) ?
          oldObject.spec.template.spec.serviceAccountName : 'default')
  validations:
    - expression: >-
        !(has(variables.podSpec.hostNetwork) && variables.podSpec.hostNetwork) &&
        !(has(variables.podSpec.hostPID) && variables.podSpec.hostPID) &&
        !(has(variables.podSpec.hostIPC) && variables.podSpec.hostIPC)
      message: The agent may not create pods in the host's namespaces.
      reason: Forbidden
    - expression: >-
        !has(variables.podSpec.volumes) ||
        variables.podSpec.volumes.all(v, !has(v.hostPath))
      message: The agent may not mount host paths.
      reason: Forbidden
    - expression: >-
        variables.containers.all(c,
          !(has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged))
      message: The agent may not create privileged containers.
      reason: Forbidden
    - expression: >-
        variables.serviceAccount == 'default' ||
        variables.serviceAccount == variables.oldServiceAccount
      message: >-
        The agent may only run pods as the namespace's default ServiceAccount,
        or keep the one a workload already uses.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: claude-writer-pod-limits
spec:
  policyName: claude-writer-pod-limits
  validationActions: ["Deny"]
---
# A namespace outside the platform's list cannot opt out of Pod Security;
# see docs/platform/security-policies.md#admission-policies
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: namespace-privileged-allowed
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    # The namespaces pod-security.yaml labels privileged, and nothing else.
    - name: allowed
      expression: >-
        ['kube-system', 'rook-ceph', 'monitoring', 'openbao', 'trivy-system',
         'backup', 'logging', 'kured']
  validations:
    - expression: >-
        !has(object.metadata.labels) ||
        !('pod-security.kubernetes.io/enforce' in object.metadata.labels) ||
        object.metadata.labels['pod-security.kubernetes.io/enforce'] != 'privileged' ||
        object.metadata.name in variables.allowed
      messageExpression: >-
        'Namespace ' + object.metadata.name + ' may not enforce the privileged Pod Security level; only platform namespaces may.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: namespace-privileged-allowed
spec:
  policyName: namespace-privileged-allowed
  validationActions: ["Deny"]
---
# The apps project reaches authentik for the workloads' blueprint ConfigMaps
# only; see docs/platform/security-policies.md#admission-policies
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: authentik-foreign-objects
spec:
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: authentik
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
  # Only what an Argo CD Application applied; controllers and kubectl carry no tracking id.
  matchConditions:
    - name: tracked-by-argocd
      expression: >-
        has(object.metadata.annotations) &&
        'argocd.argoproj.io/tracking-id' in object.metadata.annotations
  variables:
    # <application>:<group>/<kind>:<namespace>/<name>
    - name: application
      expression: >-
        object.metadata.annotations['argocd.argoproj.io/tracking-id'].split(':')[0]
  validations:
    - expression: >-
        variables.application in ['authentik', 'security'] ||
        (request.kind.group == '' && request.kind.kind == 'ConfigMap' &&
         object.metadata.name == 'authentik-blueprint-' + variables.application)
      messageExpression: >-
        'Application ' + variables.application + ' may only create the ConfigMap authentik-blueprint-' +
        variables.application + ' in authentik.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: authentik-foreign-objects
spec:
  policyName: authentik-foreign-objects
  validationActions: ["Deny"]
