---
# Cilium, not NetworkPolicy: must admit probes and Gateway (Envoy) traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: openbao
spec:
  description: >-
    Default-deny ingress for OpenBao, allowing only the cluster's own traffic:
    peers within the namespace for Raft, the Gateway for the UI, Prometheus for
    the metrics endpoint, ESO for secret reads, and the node for health probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
        - ingress
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: cert-manager
spec:
  description: >-
    Default-deny ingress for cert-manager. It is a client of everything and a
    server to almost nothing -- only the webhook, which the API server calls
    from the node.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: external-secrets
spec:
  description: >-
    Default-deny ingress for the External Secrets Operator. Its webhook is
    called by the API server from the node; nothing else needs to reach it.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: monitoring
spec:
  description: >-
    Default-deny ingress for the monitoring stack. Grafana is reached through
    the Gateway; Prometheus and Alertmanager are reached by each other and by
    Grafana within the namespace. Three callers come from outside it. Kured
    queries Prometheus before every reboot and blocks when the query fails, so
    without that rule no node ever reboots. The Authentik outpost proxies
    Prometheus and Alertmanager behind SSO. The Ceph mgr reads Prometheus for
    its alerts and Grafana for its embedded panels. Loki's ruler sends the
    alerts it evaluates from logs to Alertmanager.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
        - ingress
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kured
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: logging
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rook-ceph
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: external-dns
spec:
  description: >-
    Default-deny ingress for external-dns. It is a pure client -- it reads
    HTTPRoutes from the API server and writes records to Route53 -- and the
    only thing that connects *to* it is Prometheus, on the metrics port its
    ServiceMonitor scrapes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: kubelet-csr-approver
spec:
  description: >-
    Default-deny ingress for kubelet-csr-approver. Two replicas that watch
    CertificateSigningRequests and lease-elect between themselves through the
    API server rather than directly, so nothing needs to reach them except
    Prometheus and the kubelet's probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: kured
spec:
  description: >-
    Default-deny ingress for kured. The DaemonSet talks outward -- to the API
    server for the lock annotation and to Prometheus to ask whether rebooting is
    safe -- and serves only its own metrics endpoint.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: logging
spec:
  description: >-
    Default-deny ingress for the logging stack. Alloy pushes to Loki and Loki's
    memberlist gossips, both within the namespace; from outside it, Grafana
    queries http://loki.logging.svc.cluster.local:3100 and Prometheus scrapes
    Alloy. Both of those live in monitoring.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: cnpg-system
spec:
  description: >-
    Default-deny ingress for the CloudNativePG operator. It reaches out to the
    API server and to the Postgres instances it manages; the only things that
    connect to it are the API server calling its webhooks from the node, and
    Prometheus scraping the PodMonitor. The databases themselves are not here
    -- each one runs in its workload's namespace, behind that namespace's own
    policy.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: trivy-system
spec:
  description: >-
    Default-deny ingress for Trivy Operator. The operator serves only metrics
    and the built-in Trivy server answers scan jobs inside the namespace, so
    the callers are the scan jobs, the node for probes and Prometheus. Egress
    stays open: a scanner that cannot reach a registry reports zero findings
    rather than an error.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
