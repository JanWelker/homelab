---
# Pod-to-pod traffic was unrestricted across every namespace: anything that got
# a foothold in one pod could reach OpenBao's API, the Ceph mons and the
# Kubernetes API alike.
#
# These are CiliumNetworkPolicies rather than plain NetworkPolicies for one
# specific reason. With Cilium's Gateway API implementation the request reaching
# a backend pod comes from the per-node Envoy, and kubelet's liveness and
# readiness probes come from the node itself. Neither has a pod identity a
# standard NetworkPolicy can name, so a plain default-deny silently kills health
# probes and all ingress. Cilium's `fromEntities` can name them: `ingress` for
# Envoy-proxied traffic, `host` and `remote-node` for the kubelet.
#
# Scope is deliberately ingress-only. A default-deny on egress additionally
# needs rules for DNS, the API server, and every external endpoint a component
# talks to, and getting that wrong takes out the component rather than merely
# exposing it. Egress is the next step, not this one.
#
# Still uncovered, and each for its own reason. kube-system holds Cilium itself,
# the static control-plane pods and kube-vip: a default-deny there is enforced by
# the component being restricted, which is not a thing to get wrong. rook-ceph
# has mons, OSDs and CSI plugins with a wide and partly host-level traffic
# matrix, and wants Ceph health as its verification signal rather than a guess.
# backup has a node-agent doing volume backups through the CSI plugins and a
# host-network CronJob reading etcd. kubescape's node-agent talks to both the
# operator and the aggregated storage API server, and getting it wrong disables
# posture scanning silently. argocd and authentik already carry NetworkPolicies
# from their own charts.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: openbao
spec:
  description: >-
    Default-deny ingress for OpenBao, allowing only the cluster's own traffic:
    peers within the namespace for Raft, the Gateway for the UI, Prometheus for
    the metrics endpoint, ESO for secret reads, and the node for health probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
        - ingress
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: external-secrets
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: cert-manager
spec:
  description: >-
    Default-deny ingress for cert-manager. It is a client of everything and a
    server to almost nothing -- only the webhook, which the API server calls
    from the node.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: external-secrets
spec:
  description: >-
    Default-deny ingress for the External Secrets Operator. Its webhook is
    called by the API server from the node; nothing else needs to reach it.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: monitoring
spec:
  description: >-
    Default-deny ingress for the monitoring stack. Grafana is reached through
    the Gateway; Prometheus and Alertmanager are reached by each other and by
    Grafana within the namespace.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
        - ingress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: external-dns
spec:
  description: >-
    Default-deny ingress for external-dns. It is a pure client -- it reads
    HTTPRoutes from the API server and writes records to Route53 -- and the
    only thing that connects *to* it is Prometheus, on the metrics port its
    ServiceMonitor scrapes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: kubelet-csr-approver
spec:
  description: >-
    Default-deny ingress for kubelet-csr-approver. Two replicas that watch
    CertificateSigningRequests and lease-elect between themselves through the
    API server rather than directly, so nothing needs to reach them except
    Prometheus and the kubelet's probes.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: kured
spec:
  description: >-
    Default-deny ingress for kured. The DaemonSet talks outward -- to the API
    server for the lock annotation and to Prometheus to ask whether rebooting is
    safe -- and serves only its own metrics endpoint.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: logging
spec:
  description: >-
    Default-deny ingress for the logging stack. Alloy pushes to Loki and Loki's
    memberlist gossips, both within the namespace; from outside it, Grafana
    queries http://loki.logging.svc.cluster.local:3100 and Prometheus scrapes
    Alloy. Both of those live in monitoring.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
# NEEDS WORK -- neither of the two policies below has been proved against a run
# of the thing it protects. Both are the same ingress-only shape as the ones
# above; what is unproved is whether that shape is sufficient here, and both
# fail quietly rather than loudly if it is not.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: backup
spec:
  description: >-
    Default-deny ingress for Velero. Prometheus scrapes velero:8085 and the
    node's probes reach the pods; the node-agent and the snapshot controller
    talk outward to the CSI plugins and to Ceph RGW rather than being connected
    to.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: kubescape
spec:
  description: >-
    Default-deny ingress for kubescape. The operator, node-agent, kubevuln and
    storage all talk to each other inside the namespace; the API server reaches
    the storage Service to serve the aggregated kubescape.io and
    hostdata.kubescape.cloud APIs, which arrives as host rather than as a pod.
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
