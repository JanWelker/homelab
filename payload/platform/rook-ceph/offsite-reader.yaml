---
# Owns the offsite bucket every backup writes into, and TrueNAS pulls it with
# this user's keys. See docs/platform/rook-ceph.md#off-cluster-reader
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: offsite-reader
  namespace: rook-ceph
spec:
  store: object-store
  displayName: Off-cluster backup reader
  # Rook creates an owned bucket and sets its policy with the owner's keys
  opMask: [read, write, delete]
