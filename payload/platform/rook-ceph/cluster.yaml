---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    link.argocd.argoproj.io/external-link: https://rook.infra.k8s.wlkr.ch
spec:
  project: infra
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph-cluster
    targetRevision: v1.20.7
    helm:
      valuesObject:
        operatorNamespace: rook-ceph

        # Grants the operator RBAC to create ServiceMonitors, and ships Ceph's
        # own alerting rules (CephClusterErrorState, CephOSDDown,
        # CephPGsUnhealthy, and the near-full warnings).
        monitoring:
          enabled: true
          createPrometheusRules: true

        # Toolbox for debugging (optional, useful for troubleshooting)
        toolbox:
          enabled: true

        # Ingress removed - using Gateway API HTTPRoute instead

        # CephCluster configuration
        cephClusterSpec:
          # Was false, which meant the prometheus mgr module was never enabled
          # and no Ceph metric reached Prometheus at all -- storage health was
          # the one thing the monitoring stack could not see. The operator
          # creates the ServiceMonitor once this is on.
          monitoring:
            enabled: true
          dataDirHostPath: /var/lib/rook

          # HA: 3 mons, 2 mgrs
          mon:
            count: 3
            allowMultiplePerNode: false
          mgr:
            count: 2
            allowMultiplePerNode: false

          # Dashboard (accessible via port-forward)
          dashboard:
            enabled: true
            ssl: false

          # Block device storage (partition created by Ignition)
          storage:
            useAllNodes: true
            useAllDevices: false
            config:
              osdsPerDevice: "1"
            # Use the rook-osd partition created by Ignition
            devicePathFilter: "^/dev/disk/by-partlabel/rook-osd$"

          # Resource limits for selected nodes
          resources:
            mon:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            mgr:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            osd:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

          placement:
            all:
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule

        # CephBlockPool for RBD volumes
        cephBlockPools:
          - name: rbd-pool
            spec:
              failureDomain: host
              replicated:
                size: 3
                requireSafeReplicaSize: true
            storageClass:
              enabled: true
              name: rook-ceph-block
              isDefault: true
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              parameters:
                imageFormat: "2"
                imageFeatures: layering
                # yamllint disable rule:line-length
                csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
                csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
                # yamllint enable rule:line-length
                csi.storage.k8s.io/fstype: ext4

        # Disable CephFS for now (can enable later)
        cephFileSystems: []

        # RGW, so the cluster has an S3 endpoint of its own. Velero needs a
        # bucket to put backups in and Loki needs one for chunks; without this
        # both would have to reach out of the house or fall back to a PVC on
        # the same Ceph they are supposed to protect.
        #
        # Consumers create an ObjectBucketClaim against the `ceph-bucket`
        # StorageClass below and get a bucket plus credentials as a Secret.
        cephObjectStores:
          - name: object-store
            spec:
              metadataPool:
                failureDomain: host
                replicated:
                  size: 3
              # Erasure coded 2+1: 1.5x overhead instead of the 3x a replicated
              # pool would cost, which matters for backups and log chunks. Safe
              # at failureDomain host with six nodes.
              dataPool:
                failureDomain: host
                erasureCoded:
                  dataChunks: 2
                  codingChunks: 1
                parameters:
                  bulk: "true"
              preservePoolsOnDelete: true
              gateway:
                port: 80
                # Two, so an RGW restart during a node reboot does not stall a
                # backup or drop log ingestion.
                instances: 2
                priorityClassName: system-cluster-critical
                resources:
                  requests:
                    cpu: 100m
                    memory: 512Mi
                  limits:
                    memory: 2Gi
            storageClass:
              enabled: true
              name: ceph-bucket
              # Retain, not Delete. Deleting an ObjectBucketClaim should not be
              # able to take the backups with it.
              reclaimPolicy: Retain
              volumeBindingMode: Immediate
              parameters:
                region: eu-central-1
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # createPrometheusRules renders a PrometheusRule, whose CRD arrives with
      # kube-prometheus-stack at sync-wave 1 -- after this app at -1. On a
      # fresh bootstrap the first sync therefore runs before the CRD exists;
      # skipping the dry run lets ArgoCD retry instead of hard-failing.
      - SkipDryRunOnMissingResource=true
