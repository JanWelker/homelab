---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph
    targetRevision: v1.20.7
    helm:
      valuesObject:
        monitoring:
          enabled: true
        # The CSI driver itself is configured in csi-driver.yaml: v1.20 moved
        # every setting that used to live under `csi` here into the
        # ceph-csi-operator's OperatorConfig and Driver CRs, and Helm accepts
        # values a chart no longer reads without a word of complaint.
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
