---
# The chart does not deploy these since v1.20; see docs/platform/rook-ceph.md
apiVersion: csi.ceph.io/v1
kind: OperatorConfig
metadata:
  name: ceph-csi-operator-config
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  driverSpecDefaults:
    # Chart-rendered image set, so a chart bump moves all CSI images together
    imageSet:
      name: rook-csi-operator-image-set-configmap
    log:
      verbosity: 0
    enableMetadata: true
    generateOMapInfo: false
    fsGroupPolicy: File
    deployCsiAddons: false
    nodePlugin:
      priorityClassName: system-node-critical
      kubeletDirPath: /var/lib/kubelet
      enableSeLinuxHostMount: false
    controllerPlugin:
      priorityClassName: system-cluster-critical
      deploymentStrategy:
        type: Recreate
---
# Name must match the provisioner in cluster.yaml's StorageClasses
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  fsGroupPolicy: File
  nodePlugin:
    updateStrategy:
      type: RollingUpdate
    resources:
      registrar:
        requests:
          memory: 32Mi
          cpu: 25m
        limits:
          memory: 128Mi
      plugin:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 512Mi
  controllerPlugin:
    replicas: 1
