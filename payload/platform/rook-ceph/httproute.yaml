---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook-dashboard
  namespace: rook-ceph
spec:
  parentRefs:
    - name: infra-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "rook.infra.k8s.wlkr.ch"
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        # Authentik outpost proxies to the mgr dashboard; see its ReferenceGrant
        - name: authentik-server
          namespace: authentik
          port: 80
---
# S3 over TLS: kopia's client signs differently over plain HTTP and RGW
# refuses it; see docs/platform/velero.md#configuration
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rgw-s3
  namespace: rook-ceph
spec:
  parentRefs:
    - name: infra-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "s3.infra.k8s.wlkr.ch"
  rules:
    - timeouts:
        # Envoy's 15s upstream default is too short for a large blob GET
        request: 0s
      backendRefs:
        - name: rook-ceph-rgw-object-store
          port: 80
