---
# Written for this cluster: upstream's sample dashboard filters on labels ARC
# 0.15 does not export. See docs/platform/github-runners.md#metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-grafana-dashboards
  namespace: arc-systems
  labels:
    grafana_dashboard: "1"
data:
  arc-runners.json: |
    {
      "title": "GitHub Actions Runners",
      "uid": "arc-runners",
      "tags": [
        "arc",
        "github-actions"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "scaleset",
            "label": "Scale set",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(gha_max_runners, name)",
              "refId": "scaleset"
            },
            "definition": "label_values(gha_max_runners, name)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Queue",
          "collapsed": false,
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Assigned jobs",
          "description": "Jobs GitHub has handed to the scale set, queued or running.",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_assigned_jobs{name=~\"$scaleset\"})",
              "legendFormat": "{{name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "Busy runners",
          "description": "Runners executing a job right now.",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_busy_runners{name=~\"$scaleset\"})",
              "legendFormat": "{{name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "Max runners",
          "description": "The scale set's maxRunners.",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_max_runners{name=~\"$scaleset\"})",
              "legendFormat": "{{name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "timeseries",
          "title": "Assigned jobs against the limit",
          "description": "Busy runners pinned at the limit while running jobs stay flat is a queue that is not draining: on 2026-10-21 three ci-ok waits held all three runners.",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_assigned_jobs{name=~\"$scaleset\"})",
              "legendFormat": "assigned {{name}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_busy_runners{name=~\"$scaleset\"})",
              "legendFormat": "busy {{name}}",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_running_jobs{name=~\"$scaleset\"})",
              "legendFormat": "running {{name}}",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_max_runners{name=~\"$scaleset\"})",
              "legendFormat": "max {{name}}",
              "refId": "D"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Runners",
          "description": "Desired is the listener's target; registered runners are the ones GitHub sees, idle the registered ones without a job.",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_desired_runners{name=~\"$scaleset\"})",
              "legendFormat": "desired {{name}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_registered_runners{name=~\"$scaleset\"})",
              "legendFormat": "registered {{name}}",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_idle_runners{name=~\"$scaleset\"})",
              "legendFormat": "idle {{name}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Runner pods",
          "description": "The controller's view: runner pods running and pending. Pending that stays up is a pod that cannot schedule or pull its image.",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_controller_running_ephemeral_runners{name=~\"$scaleset\"})",
              "legendFormat": "running {{name}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (gha_controller_pending_ephemeral_runners{name=~\"$scaleset\"})",
              "legendFormat": "pending {{name}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "Jobs",
          "collapsed": false,
          "id": 8,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Jobs completed per hour, by result",
          "description": "Per scale set, from its listener; the job metrics carry no scale set label, so it is taken from the listener pod's name.",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (scale_set, job_result) (label_replace(increase(gha_completed_jobs_total{pod=~\"($scaleset)-[0-9a-f]+-listener\"}[1h]), \"scale_set\", \"$1\", \"pod\", \"(.*)-[0-9a-f]+-listener\"))",
              "legendFormat": "{{scale_set}} {{job_result}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "table",
          "title": "Jobs that did not succeed, last 24 hours",
          "description": "Count per job name and result; empty is good.",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (job_name, job_result) (increase(gha_completed_jobs_total{pod=~\"($scaleset)-[0-9a-f]+-listener\", job_result!=\"succeeded\"}[24h])) > 0",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true
          },
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Time from queued to started, p50 and p95",
          "description": "How long a job waited for a runner. A rise without more jobs means runners are slow to start or the limit is reached.",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le, scale_set) (label_replace(rate(gha_job_startup_duration_seconds_bucket{pod=~\"($scaleset)-[0-9a-f]+-listener\"}[30m]), \"scale_set\", \"$1\", \"pod\", \"(.*)-[0-9a-f]+-listener\")))",
              "legendFormat": "p50 {{scale_set}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, scale_set) (label_replace(rate(gha_job_startup_duration_seconds_bucket{pod=~\"($scaleset)-[0-9a-f]+-listener\"}[30m]), \"scale_set\", \"$1\", \"pod\", \"(.*)-[0-9a-f]+-listener\")))",
              "legendFormat": "p95 {{scale_set}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Job run time p95, by job",
          "description": "Over six hours, because each job runs a few times a day at most.",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, job_name) (rate(gha_job_execution_duration_seconds_bucket{pod=~\"($scaleset)-[0-9a-f]+-listener\"}[6h])))",
              "legendFormat": "{{job_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "Runner resources",
          "collapsed": false,
          "id": 13,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 39
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Memory per runner pod",
          "description": "Working set summed over the pod's containers: runner pods and the job pods the container hook starts.",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"arc-runners\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "CPU per runner pod",
          "description": "Cores, summed over the pod's containers.",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 40
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"arc-runners\", container!=\"\", container!=\"POD\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "Controller",
          "collapsed": false,
          "id": 16,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 48
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Reconcile errors per second",
          "description": "By controller. Sustained errors usually mean the GitHub App's token or the API server.",
          "id": 17,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 49
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (controller) (rate(controller_runtime_reconcile_errors_total{namespace=\"arc-systems\"}[$__rate_interval]))",
              "legendFormat": "{{controller}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Work queue depth",
          "description": "Objects waiting for a reconcile, by queue.",
          "id": 18,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 49
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (name) (workqueue_depth{namespace=\"arc-systems\"})",
              "legendFormat": "{{name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
