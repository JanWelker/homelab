---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/external-link: https://rook.infra.k8s.wlkr.ch
spec:
  project: infra
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph-cluster
    targetRevision: v1.21.0
    helm:
      valuesObject:
        operatorNamespace: rook-ceph

        monitoring:
          enabled: true
          createPrometheusRules: true
          # Containerd's images share the root filesystem and the kubelet only
          # prunes them at 85% used, so the 5-day trend warned on every pull.
          # Same threshold as mon_data_avail_warn below.
          prometheusRuleOverrides:
            CephNodeDiskspaceWarning:
              for: 30m
              expr: >-
                (1 - node_filesystem_avail_bytes{mountpoint="/"}
                / node_filesystem_size_bytes{mountpoint="/"}) * on (cluster, instance)
                group_left (nodename) node_uname_info > 0.85
              annotations:
                summary: Root filesystem above 85% on {{ $labels.nodename }}
                description: >-
                  The kubelet garbage-collects images from 85% used and should
                  have brought {{ $labels.nodename }} back below within minutes;
                  something else is filling the root filesystem.

        toolbox:
          enabled: true

        cephClusterSpec:
          monitoring:
            enabled: true
          dataDirHostPath: /var/lib/rook

          # Remove once cephx can leave aes; see the cephx section in rook-ceph.md
          healthCheck:
            muteHealthWarning:
              AUTH_EMERGENCY_CIPHERS_SET: {policy: mute}
              AUTH_INSECURE_CLIENT_KEY_TYPE: {policy: mute}
              AUTH_INSECURE_KEYS_ALLOWED: {policy: mute}
              AUTH_INSECURE_KEYS_CREATABLE: {policy: mute}
              AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE: {policy: mute}
              AUTH_INSECURE_SERVICE_KEY_TYPE: {policy: mute}
              AUTH_INSECURE_SERVICE_TICKETS: {policy: mute}

          security:
            cephx:
              # aes: krbd cannot read aes256k. Generations only go up.
              # See docs/platform/rook-ceph.md#cephx-keys-stay-on-aes
              csi:
                keyType: aes
                keyRotationPolicy: KeyGeneration
                keyGeneration: 3
              daemon:
                keyType: aes
                keyRotationPolicy: KeyGeneration
                keyGeneration: 3
              rbdMirrorPeer:
                keyType: aes
                keyRotationPolicy: KeyGeneration
                keyGeneration: 3

          mon:
            count: 3
            allowMultiplePerNode: false
          mgr:
            count: 2
            allowMultiplePerNode: false

          dashboard:
            enabled: true
            ssl: false

          cephConfig:
            mgr:
              # yamllint disable rule:line-length
              mgr/dashboard/PROMETHEUS_API_HOST: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
              mgr/dashboard/GRAFANA_API_URL: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80"
              mgr/dashboard/GRAFANA_API_SSL_VERIFY: "false"
              # yamllint enable rule:line-length
            mon:
              # Default debug floods Loki with mon probe and pgmap lines.
              mon_cluster_log_level: info
              # Unset, mons disagree and refuse aes key fetches at random.
              mon_auth_allow_insecure_key: "true"
              # The mon store shares the node's root filesystem with the
              # container images, which the kubelet only prunes at 85% used;
              # the default 30% free warned permanently below that.
              mon_data_avail_warn: "15"

          storage:
            useAllNodes: true
            useAllDevices: false
            config:
              osdsPerDevice: "1"
            devicePathFilter: "^/dev/disk/by-partlabel/rook-osd$"

          resources:
            mon:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            mgr:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            osd:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi

          placement:
            all:
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                # Rook skips nodes with any untolerated taint, so without this
                # every node waiting for Kured's reboot lock loses its OSD updates
                - key: weave.works/kured-node-reboot
                  operator: Exists
                  effect: PreferNoSchedule
            # No OSDs where etcd shares the disk; see docs/platform/rook-ceph.md#disks
            osd:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist

        cephBlockPools:
          - name: rbd-pool
            spec:
              failureDomain: host
              replicated:
                size: 3
                requireSafeReplicaSize: true
            storageClass:
              enabled: true
              name: rook-ceph-block
              isDefault: true
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              parameters:
                imageFormat: "2"
                imageFeatures: layering
                # yamllint disable rule:line-length
                csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
                csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
                csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
                csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
                csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
                # yamllint enable rule:line-length
                csi.storage.k8s.io/fstype: ext4

        cephFileSystems: []

        cephObjectStores:
          - name: object-store
            spec:
              metadataPool:
                failureDomain: host
                replicated:
                  size: 3
              dataPool:
                failureDomain: host
                erasureCoded:
                  dataChunks: 2
                  codingChunks: 1
                parameters:
                  bulk: "true"
              preservePoolsOnDelete: true
              gateway:
                port: 80
                instances: 2
                priorityClassName: system-cluster-critical
                # placement.all above is the CephCluster's; a CephObjectStore
                # is its own CR. See docs/platform/index.md#replica-placement
                placement:
                  # Hard: two gateways on one node share instance_id "a" in
                  # the exporter, and the descheduler never evicts them
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: DoNotSchedule
                      nodeTaintsPolicy: Honor
                      labelSelector:
                        matchLabels:
                          app: rook-ceph-rgw
                          rook_cluster: rook-ceph
                          rook_object_store: object-store
                resources:
                  requests:
                    cpu: 100m
                    memory: 512Mi
                  limits:
                    memory: 2Gi
            storageClass:
              enabled: true
              name: ceph-bucket
              # Retain, so deleting a claim cannot take the backups with it.
              reclaimPolicy: Retain
              volumeBindingMode: Immediate
              parameters:
                region: eu-central-1
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
