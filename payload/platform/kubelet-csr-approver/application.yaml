---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-csr-approver
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://postfinance.github.io/kubelet-csr-approver
    chart: kubelet-csr-approver
    targetRevision: 1.2.15
    helm:
      valuesObject:
        # Add new nodes here too, or their CSRs are denied.
        providerRegex: "^(odin|thor|loki|freya|heimdall|valkyrie)$"
        bypassDnsResolution: true
        providerIpPrefixes:
          - 10.9.2.0/24
        maxExpirationSeconds: 86400
        replicas: 2
        # It tolerates the control planes, so six nodes always leave room for
        # two replicas and the rule can be hard; the chart exposes no
        # topologySpreadConstraints. See docs/platform/index.md#replica-placement
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kubelet-csr-approver
                    app.kubernetes.io/instance: kubelet-csr-approver
        # Pod-level; the container already matches.
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        metrics:
          enable: true
          serviceMonitor:
            enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kubelet-csr-approver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
