---
# Read as $argocd-oidc:client-id; the part-of label below is required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef: {key: authentik/config, property: argocd-client-id}
    - secretKey: clientSecret
      remoteRef: {key: authentik/config, property: argocd-client-secret}
