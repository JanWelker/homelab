---
# The artifacts are not in the image. They are ~600 MB today -- a 374 MB initrd,
# a kernel, two sysexts -- and the Ignition configs beside them are per-host,
# carry the kubeadm join credentials, and are regenerated by `make config` on
# every inventory change. None of that belongs in a layer in a public registry.
#
# So the image carries the server and this volume carries what it serves;
# `make serve-cluster-push` puts it there. 10Gi leaves room for a second Flatcar
# release alongside the current one during an upgrade.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boot-server-artifacts
  namespace: boot-server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi
