---
# The whole Alertmanager config, rendered from kv/monitoring/smtp.
# See docs/platform/monitoring.md#alerting
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # toJson quotes every value so special characters cannot break YAML.
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            # 465 is implicit TLS; require_tls guards a move back to 587.
            smtp_smarthost: "smtp.mailbox.org:465"
            smtp_from: {{ .username | toJson }}
            smtp_auth_username: {{ .username | toJson }}
            smtp_auth_password: {{ .password | toJson }}
            smtp_require_tls: true

          # Chart defaults, repeated: a supplied config replaces them.
          inhibit_rules:
            - source_matchers:
                - severity = critical
              target_matchers:
                - severity =~ warning|info
              equal:
                - namespace
                - alertname
            - source_matchers:
                - severity = warning
              target_matchers:
                - severity = info
              equal:
                - namespace
                - alertname
            - source_matchers:
                - alertname = InfoInhibitor
              target_matchers:
                - severity = info
              equal:
                - namespace
            - target_matchers:
                - alertname = InfoInhibitor

          route:
            group_by: ["alertname", "namespace"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: email
            routes:
              # Watchdog always fires by design; do not mail it.
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"
              - receiver: email
                matchers:
                  - severity = "critical"
                repeat_interval: 3h

          receivers:
            - name: "null"
            - name: email
              email_configs:
                - to: {{ .to | toJson }}
                  send_resolved: true
  data:
    - secretKey: username
      remoteRef:
        key: monitoring/smtp
        property: username
    - secretKey: password
      remoteRef:
        key: monitoring/smtp
        property: password
    - secretKey: to
      remoteRef:
        key: monitoring/smtp
        property: to
