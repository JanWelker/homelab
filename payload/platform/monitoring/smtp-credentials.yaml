---
# SMTP password for the Alertmanager email receiver.
#
# The underlying password lives in OpenBao at:
#
#   kv/monitoring/smtp
#
# Store it with:
#
#   bao kv put kv/monitoring/smtp password="$SMTP_PASSWORD"
#
# Only the password comes from here. Alertmanager supports
# `smtp_auth_password_file` but has no equivalent for the username, so the
# smarthost, the from address and the username stay in application.yaml --
# none of them is a secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
  annotations:
    # Alertmanager mounts this Secret, so it has to exist before the pod can
    # start. It is created by ESO at sync-wave 1, the same wave as this
    # Application, so on a fresh bootstrap the first attempt can lose the race
    # and ArgoCD retries.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: monitoring/smtp
        property: password
