---
# External Secrets' own metrics; `namespace` is the scrape target's, the
# object's is `exported_namespace`. See docs/platform/monitoring.md#alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secret-sync
  namespace: monitoring
spec:
  groups:
    - name: secret-sync
      rules:
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: An ExternalSecret has not synced for 15 minutes
            description: >-
              ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }}
              is not Ready, so its Secret is stale or missing. Check OpenBao
              (sealed after a restart) and the ClusterSecretStore.
        - alert: PushSecretNotReady
          expr: pushsecret_status_condition{condition="Ready",status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: A PushSecret has not synced for 15 minutes
            description: >-
              PushSecret {{ $labels.exported_namespace }}/{{ $labels.name }}
              is not Ready, so its value is not in OpenBao.
