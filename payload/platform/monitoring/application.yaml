---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "1"
    link.argocd.argoproj.io/external-link: https://monitoring.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.1
      helm:
        valuesObject:
          crds:
            enabled: true
            upgradeJob:
              enabled: true
              forceConflicts: true
              image:
                kubectl:
                  registry: registry.k8s.io
                  repository: kubectl
                  # renovate: datasource=github-releases depName=kubernetes/kubernetes
                  tag: v1.37.0

          grafana:
            enabled: true

            # The dashboard and datasource sidecars, which peaked at 89Mi and
            # 92Mi. Grafana's own container is not capped here -- see the note
            # further down.
            sidecar:
              resources:
                requests:
                  cpu: 10m
                  memory: 112Mi
                limits:
                  memory: 256Mi
              # Dashboards are picked up from `grafana_dashboard` ConfigMaps in
              # every namespace, so a dashboard ships with the component it
              # describes -- including the ones charts render into their own
              # namespace. This is already kube-prometheus-stack's default;
              # it is spelled out because other docs once assumed the
              # opposite. The datasource sidecar has no such setting here and
              # does watch only `monitoring`, see logging/grafana-datasource.yaml.
              dashboards:
                searchNamespace: ALL

            # Single sign-on against Authentik. Grafana previously used the
            # chart's generated admin password -- a shared credential nobody
            # rotates, documented as "read it out of the Secret".
            envFromSecret: grafana-oidc

            # The break-glass admin account, from OpenBao via grafana-admin.yaml.
            # Leaving this unset makes the chart generate a new password on
            # every render, which keeps the app OutOfSync and restarts Grafana
            # on every sync.
            admin:
              existingSecret: grafana-admin
            grafana.ini:
              server:
                root_url: https://monitoring.infra.k8s.wlkr.ch
              auth:
                # No local login form. The admin account still exists and is
                # reachable through the API as a break-glass path if Authentik
                # is down -- see docs/platform/authentik.md.
                disable_login_form: true
                oauth_auto_login: true
              auth.generic_oauth:
                enabled: true
                name: Authentik
                allow_sign_up: true
                scopes: "openid profile email"
                auth_url: https://auth.infra.k8s.wlkr.ch/application/o/authorize/
                token_url: https://auth.infra.k8s.wlkr.ch/application/o/token/
                api_url: https://auth.infra.k8s.wlkr.ch/application/o/userinfo/
                # Group membership decides the Grafana role. Anyone who
                # authenticates but is in neither group lands on Viewer.
                # yamllint disable-line rule:line-length
                role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'"
              users:
                auto_assign_org_role: Viewer

            # The dashboard PVC is ReadWriteOnce, so two Grafana pods cannot
            # exist at once -- and the chart's default RollingUpdate strategy
            # tries: the new pod waits on a volume the old pod will not release
            # until the new one is Ready, which it cannot become. A rollout then
            # parks at `FailedAttachVolume: Volume is already used by pod(s)`
            # until someone deletes a pod by hand. Recreate takes the old pod
            # down first, and the seconds of downtime are the price of a
            # single-replica, single-volume Grafana.
            deploymentStrategy:
              type: Recreate

            persistence:
              enabled: true
              type: pvc
              storageClassName: rook-ceph-block
              accessModes:
                - ReadWriteOnce
              size: 2Gi

          prometheus:
            prometheusSpec:
              # Select every ServiceMonitor, PodMonitor, Probe, ScrapeConfig and
              # PrometheusRule in every namespace, not only this release's.
              #
              # An empty `serviceMonitorSelector: {}` does not say that. The
              # chart tests the selector for truthiness, an empty map is falsy,
              # and it falls through to `*NilUsesHelmValues` -- true by default
              # -- which renders `release: kube-prometheus-stack`. For as long
              # as the selectors were written that way, Prometheus scraped this
              # chart's own targets and nothing else: no Cilium, Ceph, OpenBao,
              # Kubescape or Alloy metrics, and no Ceph or Velero alert rules,
              # while every ServiceMonitor for them existed and looked fine.
              ruleSelectorNilUsesHelmValues: false
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              probeSelectorNilUsesHelmValues: false
              scrapeConfigSelectorNilUsesHelmValues: false
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: rook-ceph-block
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
              retention: 10d

          alertmanager:
            # Alertmanager has no RoleBinding or ClusterRoleBinding anywhere in
            # the cluster -- the operator is what talks to the API, not the
            # Alertmanager pod -- so the projected token buys it nothing and
            # costs a working credential sitting in a pod reachable from the
            # Gateway.
            serviceAccount:
              automountServiceAccountToken: false

            alertmanagerSpec:
              resources:
                requests:
                  cpu: 10m
                  memory: 40Mi
                limits:
                  memory: 128Mi
              storage:
                volumeClaimTemplate:
                  spec:
                    storageClassName: rook-ceph-block
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 5Gi
              # The whole Alertmanager configuration -- routing, receivers and
              # the mail account -- is rendered from OpenBao by
              # alertmanager-config.yaml in this directory, so that no address
              # is published here. `useExistingSecret` turns the chart's
              # `config` off; `configSecret` names the Secret to load instead.
              useExistingSecret: true
              configSecret: alertmanager-config

          # kubeadm binds these two to 127.0.0.1 by default; the provisioning
          # change that moves them to 0.0.0.0 is what makes these ServiceMonitors
          # able to reach anything. Their serving certificates are self-signed
          # for the node address, so verification is off -- the scrape still
          # authenticates with the ServiceAccount token.
          kubeControllerManager:
            enabled: true
            serviceMonitor:
              https: true
              insecureSkipVerify: true
          kubeScheduler:
            enabled: true
            serviceMonitor:
              https: true
              insecureSkipVerify: true
          # Plain HTTP on 2381, which serves only /metrics and /health. The
          # client and peer APIs stay on their mTLS listeners.
          kubeEtcd:
            enabled: true
            service:
              port: 2381
              targetPort: 2381
            serviceMonitor:
              scheme: http

          nodeExporter:
            enabled: true
            serviceMonitor:
              relabelings:
                - action: replace
                  regex: (.*)
                  replacement: $1
                  sourceLabels:
                    - __meta_kubernetes_pod_node_name
                  targetLabel: instance

          kubeStateMetrics:
            enabled: true

          # Memory limits sized from measured peak working set at roughly 2.5x.
          #
          # Prometheus and Grafana are deliberately absent. Prometheus peaked at
          # 1501Mi and grows with series count and retention; Grafana peaked at
          # 680Mi, which is high enough for a dashboard renderer that it wants
          # explaining before it is capped. Neither can be sized from 23h of
          # steady state, and OOMKilling the thing that tells you the cluster is
          # unhealthy is the specific failure worth avoiding. Tracked separately.
          prometheusOperator:
            resources:
              requests:
                cpu: 10m
                memory: 80Mi
              limits:
                memory: 192Mi
            # Sidecar next to both the Prometheus and Alertmanager pods.
            prometheusConfigReloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi

          kube-state-metrics:
            resources:
              requests:
                cpu: 10m
                memory: 56Mi
              limits:
                memory: 128Mi

          prometheus-node-exporter:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/monitoring
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
