---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "1"
    link.argocd.argoproj.io/external-link: https://monitoring.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.1
      helm:
        valuesObject:
          crds:
            enabled: true
            upgradeJob:
              enabled: true
              forceConflicts: true
              image:
                kubectl:
                  registry: registry.k8s.io
                  repository: kubectl
                  # renovate: datasource=github-releases depName=kubernetes/kubernetes
                  tag: v1.37.0

          grafana:
            enabled: true

            sidecar:
              resources:
                requests:
                  cpu: 10m
                  memory: 112Mi
                limits:
                  memory: 256Mi
              # Every namespace; the datasource sidecar watches only `monitoring`.
              dashboards:
                searchNamespace: ALL

            envFromSecret: grafana-oidc

            # Unset, the chart regenerates the password and restarts Grafana.
            admin:
              existingSecret: grafana-admin
            grafana.ini:
              server:
                root_url: https://monitoring.infra.k8s.wlkr.ch
              auth:
                # Admin stays reachable via the API, see docs/platform/authentik.md
                disable_login_form: true
                oauth_auto_login: true
              auth.generic_oauth:
                enabled: true
                name: Authentik
                allow_sign_up: true
                scopes: "openid profile email"
                auth_url: https://auth.infra.k8s.wlkr.ch/application/o/authorize/
                token_url: https://auth.infra.k8s.wlkr.ch/application/o/token/
                api_url: https://auth.infra.k8s.wlkr.ch/application/o/userinfo/
                # yamllint disable-line rule:line-length
                role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'"
              users:
                auto_assign_org_role: Viewer

            # RWO volume: RollingUpdate deadlocks, see docs/platform/monitoring.md
            deploymentStrategy:
              type: Recreate

            persistence:
              enabled: true
              type: pvc
              storageClassName: rook-ceph-block
              accessModes:
                - ReadWriteOnce
              size: 2Gi

          prometheus:
            prometheusSpec:
              # `{}` alone still filters by release, see docs/platform/monitoring.md
              ruleSelectorNilUsesHelmValues: false
              serviceMonitorSelectorNilUsesHelmValues: false
              podMonitorSelectorNilUsesHelmValues: false
              probeSelectorNilUsesHelmValues: false
              scrapeConfigSelectorNilUsesHelmValues: false
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: rook-ceph-block
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
              retention: 10d

          alertmanager:
            # Nothing binds Alertmanager to RBAC; the token is only exposure.
            serviceAccount:
              automountServiceAccountToken: false

            alertmanagerSpec:
              resources:
                requests:
                  cpu: 10m
                  memory: 40Mi
                limits:
                  memory: 128Mi
              storage:
                volumeClaimTemplate:
                  spec:
                    storageClassName: rook-ceph-block
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 5Gi
              # Rendered from OpenBao by alertmanager-config.yaml.
              useExistingSecret: true
              configSecret: alertmanager-config

          # Needs kubeadm's bind-address change, see docs/platform/monitoring.md
          kubeControllerManager:
            enabled: true
            serviceMonitor:
              https: true
              insecureSkipVerify: true
          kubeScheduler:
            enabled: true
            serviceMonitor:
              https: true
              insecureSkipVerify: true
          # Plain-HTTP metrics-only listener; client and peer APIs stay mTLS.
          kubeEtcd:
            enabled: true
            service:
              port: 2381
              targetPort: 2381
            serviceMonitor:
              scheme: http

          # No kube-proxy: Cilium replaces it.
          kubeProxy:
            enabled: false

          nodeExporter:
            enabled: true
            serviceMonitor:
              relabelings:
                - action: replace
                  regex: (.*)
                  replacement: $1
                  sourceLabels:
                    - __meta_kubernetes_pod_node_name
                  targetLabel: instance

          kubeStateMetrics:
            enabled: true

          # Limits ~2.5x measured peak, see docs/platform/monitoring.md
          prometheusOperator:
            resources:
              requests:
                cpu: 10m
                memory: 80Mi
              limits:
                memory: 192Mi
            # Sidecar next to both the Prometheus and Alertmanager pods.
            prometheusConfigReloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi

          kube-state-metrics:
            resources:
              requests:
                cpu: 10m
                memory: 56Mi
              limits:
                memory: 128Mi

          prometheus-node-exporter:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/monitoring
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
