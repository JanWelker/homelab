---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    # Pruning an AppProject orphans every Application in it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: User-facing applications
  # The workloads repository and the chart repositories its Applications pull
  # from. A workload on a new chart repository is added here first, or its
  # Application is rejected. See docs/development/add-workload.md
  sourceRepos:
    - https://github.com/JanWelker/homelab-apps.git
    - https://nextcloud.github.io/helm/
  # Any namespace but the platform's. authentik stays open: a workload ships
  # its Authentik blueprint as a ConfigMap there, which is the one thing the
  # platform asks workloads to write into it.
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
    - namespace: "!argocd"
      server: https://kubernetes.default.svc
    - namespace: "!kube-system"
      server: https://kubernetes.default.svc
    - namespace: "!kube-public"
      server: https://kubernetes.default.svc
    - namespace: "!kube-node-lease"
      server: https://kubernetes.default.svc
    - namespace: "!openbao"
      server: https://kubernetes.default.svc
    - namespace: "!external-secrets"
      server: https://kubernetes.default.svc
    - namespace: "!cert-manager"
      server: https://kubernetes.default.svc
    - namespace: "!rook-ceph"
      server: https://kubernetes.default.svc
    - namespace: "!cnpg-system"
      server: https://kubernetes.default.svc
    - namespace: "!monitoring"
      server: https://kubernetes.default.svc
    - namespace: "!logging"
      server: https://kubernetes.default.svc
    - namespace: "!backup"
      server: https://kubernetes.default.svc
    - namespace: "!kured"
      server: https://kubernetes.default.svc
    - namespace: "!external-dns"
      server: https://kubernetes.default.svc
    - namespace: "!kubelet-csr-approver"
      server: https://kubernetes.default.svc
    - namespace: "!cilium-secrets"
      server: https://kubernetes.default.svc
    - namespace: "!trivy-system"
      server: https://kubernetes.default.svc
  # What the workloads demonstrably need at cluster scope: their namespaces.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    # Pruning an AppProject orphans every Application in it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: Core infrastructure (Cilium, Rook-Ceph, Monitoring, Certificates)
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
  annotations:
    # Pruning an AppProject orphans every Application in it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: System components (ArgoCD, ApplicationSets, etc.)
  sourceRepos:
    - "*"
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
