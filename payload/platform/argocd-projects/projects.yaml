---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    # Pruning an AppProject orphans every Application in it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: User-facing applications
  # A workload on a new chart repository is added here first; see docs/development/add-workload.md
  sourceRepos:
    - https://github.com/JanWelker/homelab-apps.git
    - https://nextcloud.github.io/helm/
    - https://dependencytrack.github.io/helm-charts
    # An OCI chart, without the oci:// scheme; see docs/platform/argocd.md#projects
    - ghcr.io/janwelker/charts
  # Every platform namespace is denied here; see docs/development/add-platform-component.md
  # authentik stays open for the workloads' blueprint ConfigMaps, and the
  # authentik-foreign-objects admission policy refuses anything else there.
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
    - namespace: "!argocd"
      server: https://kubernetes.default.svc
    - namespace: "!kube-system"
      server: https://kubernetes.default.svc
    - namespace: "!kube-public"
      server: https://kubernetes.default.svc
    - namespace: "!kube-node-lease"
      server: https://kubernetes.default.svc
    - namespace: "!openbao"
      server: https://kubernetes.default.svc
    - namespace: "!external-secrets"
      server: https://kubernetes.default.svc
    - namespace: "!cert-manager"
      server: https://kubernetes.default.svc
    - namespace: "!rook-ceph"
      server: https://kubernetes.default.svc
    - namespace: "!cnpg-system"
      server: https://kubernetes.default.svc
    - namespace: "!monitoring"
      server: https://kubernetes.default.svc
    - namespace: "!logging"
      server: https://kubernetes.default.svc
    - namespace: "!backup"
      server: https://kubernetes.default.svc
    - namespace: "!kured"
      server: https://kubernetes.default.svc
    - namespace: "!external-dns"
      server: https://kubernetes.default.svc
    - namespace: "!kubelet-csr-approver"
      server: https://kubernetes.default.svc
    - namespace: "!cilium-secrets"
      server: https://kubernetes.default.svc
    - namespace: "!trivy-system"
      server: https://kubernetes.default.svc
    # Grafana loads dashboards from here; see docs/platform/monitoring.md#adding-a-dashboard
    - namespace: "!arc-systems"
      server: https://kubernetes.default.svc
    - namespace: "!arc-runners"
      server: https://kubernetes.default.svc
    - namespace: "!descheduler"
      server: https://kubernetes.default.svc
    - namespace: "!default"
      server: https://kubernetes.default.svc
    - namespace: "!arc-jobs"
      server: https://kubernetes.default.svc
  # What the workloads demonstrably need at cluster scope: their namespaces.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    # Pruning an AppProject orphans every Application in it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: Core infrastructure (Cilium, Rook-Ceph, Monitoring, Certificates)
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
  annotations:
    # Pruning an AppProject orphans every Application in it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: System components (ArgoCD, ApplicationSets, etc.)
  sourceRepos:
    - "*"
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
