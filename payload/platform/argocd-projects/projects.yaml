---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  description: User-facing applications
  # The workloads repository and the chart repositories its Applications pull
  # from. A workload on a new chart repository is added here first, or its
  # Application is rejected. See docs/development/add-workload.md
  sourceRepos:
    - https://github.com/JanWelker/homelab-apps.git
    - https://nextcloud.github.io/helm/
    - https://aquasecurity.github.io/helm-charts/
  # Any namespace but the platform's. authentik stays open: a workload ships
  # its Authentik blueprint as a ConfigMap there, which is the one thing the
  # platform asks workloads to write into it.
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
    - namespace: "!argocd"
      server: https://kubernetes.default.svc
    - namespace: "!kube-system"
      server: https://kubernetes.default.svc
    - namespace: "!kube-public"
      server: https://kubernetes.default.svc
    - namespace: "!kube-node-lease"
      server: https://kubernetes.default.svc
    - namespace: "!openbao"
      server: https://kubernetes.default.svc
    - namespace: "!external-secrets"
      server: https://kubernetes.default.svc
    - namespace: "!cert-manager"
      server: https://kubernetes.default.svc
    - namespace: "!rook-ceph"
      server: https://kubernetes.default.svc
    - namespace: "!cnpg-system"
      server: https://kubernetes.default.svc
    - namespace: "!monitoring"
      server: https://kubernetes.default.svc
    - namespace: "!logging"
      server: https://kubernetes.default.svc
    - namespace: "!backup"
      server: https://kubernetes.default.svc
    - namespace: "!kured"
      server: https://kubernetes.default.svc
    - namespace: "!external-dns"
      server: https://kubernetes.default.svc
    - namespace: "!kubelet-csr-approver"
      server: https://kubernetes.default.svc
    - namespace: "!gateway-system"
      server: https://kubernetes.default.svc
    - namespace: "!cilium-secrets"
      server: https://kubernetes.default.svc
  # What the workloads demonstrably need at cluster scope: their namespaces,
  # and the CRDs, cluster RBAC and compliance reports the trivy-operator chart
  # renders. Cluster RBAC is still cluster RBAC; the boundary this draws is
  # which repositories may define it and which namespaces it may not touch.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: aquasecurity.github.io
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  description: Core infrastructure (Cilium, Rook-Ceph, Monitoring, Certificates)
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  description: System components (ArgoCD, ApplicationSets, etc.)
  sourceRepos:
    - "*"
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
