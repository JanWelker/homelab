---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  labels:
    homelab.wlkr.ch/stage: 06-certificates
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: 1.22.0
      helm:
        valuesObject:
          provider:
            name: aws

          sources:
            - gateway-httproute

          domainFilters:
            - k8s.wlkr.ch

          # k8s.wlkr.ch has no zone of its own; its records live in wlkr.ch.
          extraArgs:
            - --aws-zone-match-parent

          registry: txt
          txtOwnerId: homelab-k8s
          txtPrefix: "_externaldns."

          # Only safe with the TXT ownership registry above.
          policy: sync

          # A credentials file, not env vars; see docs/platform/external-dns.md
          env:
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /aws/credentials
            - name: AWS_REGION
              value: eu-central-1

          extraVolumes:
            - name: aws-credentials
              secret:
                secretName: route53-credentials
                items:
                  - key: credentials
                    path: credentials
          extraVolumeMounts:
            - name: aws-credentials
              mountPath: /aws
              readOnly: true

          serviceMonitor:
            enabled: true

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/external-dns
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
