---
# Not cert-manager's IAM user: see docs/platform/external-dns.md#credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: route53-credentials
  namespace: external-dns
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: route53-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    # INI file mounted by external-dns; the two original keys stay for readers.
    template:
      mergePolicy: Replace
      data:
        credentials: |
          [default]
          aws_access_key_id = {{ index . "access-key-id" }}
          aws_secret_access_key = {{ index . "secret-access-key" }}
        access-key-id: '{{ index . "access-key-id" }}'
        secret-access-key: '{{ index . "secret-access-key" }}'
  data:
    - secretKey: access-key-id
      remoteRef:
        key: external-dns/route53
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: external-dns/route53
        property: secret-access-key
