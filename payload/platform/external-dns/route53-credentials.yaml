---
# Route53 credentials for external-dns.
#
# Deliberately a different OpenBao path, and meant to be a different IAM user,
# from the one cert-manager uses. They need different permissions and have
# different blast radii: cert-manager only writes `_acme-challenge` TXT records
# and can at worst be used to issue certificates for the zone, while
# external-dns creates and deletes A and TXT records and can therefore
# repoint hostnames.
#
# Store them with:
#
#   bao kv put kv/external-dns/route53 \
#     access-key-id="$AWS_ACCESS_KEY_ID" \
#     secret-access-key="$AWS_SECRET_ACCESS_KEY"
#
# The IAM policy needs route53:ChangeResourceRecordSets on the hosted zone,
# plus route53:ListHostedZones and route53:ListResourceRecordSets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: route53-credentials
  namespace: external-dns
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: route53-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    # The AWS SDK reads either the environment or a shared credentials file.
    # external-dns used the environment, which puts both halves of a Route53
    # key that can repoint every hostname in the zone into `kubectl describe
    # pod`, into any crash dump, and into the environment of every child
    # process. A file is readable only by something already inside the
    # container.
    #
    # ESO renders the INI itself, so the file never exists anywhere but in the
    # Secret and in the pod. The two original keys are kept alongside it --
    # dropping them would rewrite the Secret out from under anything still
    # reading them, and they cost nothing to leave.
    template:
      mergePolicy: Replace
      data:
        credentials: |
          [default]
          aws_access_key_id = {{ index . "access-key-id" }}
          aws_secret_access_key = {{ index . "secret-access-key" }}
        access-key-id: '{{ index . "access-key-id" }}'
        secret-access-key: '{{ index . "secret-access-key" }}'
  data:
    - secretKey: access-key-id
      remoteRef:
        key: external-dns/route53
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: external-dns/route53
        property: secret-access-key
