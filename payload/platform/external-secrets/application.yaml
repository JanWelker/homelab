---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        valuesObject:
          installCRDs: true
          replicaCount: 1
          # Here and on the two deployments below; see docs/platform/index.md#components
          priorityClassName: system-cluster-critical
          # Pod-level, here and on the two deployments below; the containers
          # already match.
          podSecurityContext:
            enabled: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceMonitor:
            enabled: true
            interval: 30s
          grafanaDashboard:
            enabled: true
          webhook:
            # failurePolicy Fail: one replica refuses every apply while its
            # node drains. See docs/platform/external-secrets.md#configuration
            replicaCount: 2
            podDisruptionBudget:
              enabled: true
              maxUnavailable: 1
            # Worker-only, so ScheduleAnyway; the chart fills in the
            # labelSelector. See docs/platform/index.md#replica-placement
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                nodeTaintsPolicy: Honor
            priorityClassName: system-cluster-critical
            podSecurityContext:
              enabled: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            serviceMonitor:
              enabled: true
              interval: 30s
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            # Keep the SA token mounted: the webhook exits without it.
          certController:
            priorityClassName: system-cluster-critical
            podSecurityContext:
              enabled: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            serviceMonitor:
              enabled: true
              interval: 30s
            resources:
              requests:
                cpu: 10m
                memory: 80Mi
              limits:
                memory: 192Mi
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
