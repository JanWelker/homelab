---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    homelab.wlkr.ch/stage: 03-controllers
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.10.0
      helm:
        valuesObject:
          installCRDs: true
          replicaCount: 1
          # Pod-level, here and on the two deployments below; the containers
          # already match.
          podSecurityContext:
            enabled: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceMonitor:
            enabled: true
            interval: 30s
          grafanaDashboard:
            enabled: true
          webhook:
            podSecurityContext:
              enabled: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            serviceMonitor:
              enabled: true
              interval: 30s
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            # Keep the SA token mounted: the webhook exits without it.
          certController:
            podSecurityContext:
              enabled: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            serviceMonitor:
              enabled: true
              interval: 30s
            resources:
              requests:
                cpu: 10m
                memory: 80Mi
              limits:
                memory: 192Mi
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
