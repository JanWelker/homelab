---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    # Must precede every ExternalSecret consumer; see docs/architecture/gitops.md
    argocd.argoproj.io/sync-wave: "-6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.10.0
      helm:
        valuesObject:
          installCRDs: true
          replicaCount: 1
          serviceMonitor:
            enabled: true
            interval: 30s
          grafanaDashboard:
            enabled: true
          webhook:
            serviceMonitor:
              enabled: true
              interval: 30s
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            # Keep the SA token mounted: the webhook exits without it.
          certController:
            serviceMonitor:
              enabled: true
              interval: 30s
            resources:
              requests:
                cpu: 10m
                memory: 80Mi
              limits:
                memory: 192Mi
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/external-secrets
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
