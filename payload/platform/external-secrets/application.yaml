---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    # Ahead of every Application that ships an ExternalSecret, and cert-manager
    # at -5 is the earliest of those. A CustomResource whose CRD does not exist
    # yet does not merely fail and retry: ArgoCD marks the task SyncFailed,
    # leaves the operation Running while it waits on the rest of the wave to
    # become healthy, and starts no new sync until that one finishes. When the
    # resource it could not apply is the credential the wave is waiting for,
    # that is a deadlock, not a delay. See docs/architecture/gitops.md.
    argocd.argoproj.io/sync-wave: "-6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.10.0
      helm:
        valuesObject:
          installCRDs: true
          replicaCount: 1
          serviceMonitor:
            enabled: true
            interval: 30s
          webhook:
            serviceMonitor:
              enabled: true
              interval: 30s
          certController:
            serviceMonitor:
              enabled: true
              interval: 30s
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/external-secrets
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
