---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    homelab.wlkr.ch/stage: 09-backends
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary

        loki:
          # Here, not singleBinary.podSecurityContext: that key does not exist.
          podSecurityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2026-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: s3
            bucketNames:
              chunks: loki
              ruler: loki
            s3:
              endpoint: rook-ceph-rgw-object-store.rook-ceph.svc.cluster.local
              region: eu-central-1
              accessKeyId: "${AWS_ACCESS_KEY_ID}"
              secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
              s3ForcePathStyle: true
              insecure: true
          limits_config:
            retention_period: 30d
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            volume_enabled: true
          compactor:
            retention_enabled: true
            delete_request_store: s3
          storage_config:
            tsdb_shipper:
              active_index_directory: /var/loki/tsdb-index
              cache_location: /var/loki/tsdb-cache

        singleBinary:
          replicas: 1
          # On singleBinary, not global, see docs/platform/logging.md
          extraArgs:
            - "-config.expand-env=true"
          # Written by Rook when it provisions the ObjectBucketClaim.
          extraEnvFrom:
            - secretRef:
                name: loki-bucket
          persistence:
            enabled: true
            storageClass: rook-ceph-block
            size: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

        sidecar:
          resources:
            requests:
              cpu: 10m
              memory: 88Mi
            limits:
              memory: 192Mi

        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        # SimpleScalable-only components, and the smoke tests.
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false

        monitoring:
          # The chart relabels `job` to logging/loki.
          serviceMonitor:
            enabled: true
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
