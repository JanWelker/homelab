---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.13.4
    helm:
      valuesObject:
        deploymentMode: Monolithic

        loki:
          # Here, not singleBinary.podSecurityContext: that key does not exist.
          podSecurityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          auth_enabled: false
          # Loki otherwise reports usage to stats.grafana.org every few
          # hours; see docs/platform/logging.md
          analytics:
            reporting_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2026-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: s3
            bucketNames:
              chunks: loki
              ruler: loki
            s3:
              endpoint: rook-ceph-rgw-object-store.rook-ceph.svc.cluster.local
              region: eu-central-1
              accessKeyId: "${AWS_ACCESS_KEY_ID}"
              secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
              s3ForcePathStyle: true
              insecure: true
          limits_config:
            retention_period: 30d
            # The daily Trivy summary is a few lines; a year of it is the
            # only long-range record of findings. See docs/platform/trivy-operator.md
            retention_stream:
              - selector: '{namespace="trivy-system", container="findings-history"}'
                priority: 1
                period: 8760h
            reject_old_samples: true
            reject_old_samples_max_age: 168h
            volume_enabled: true
          compactor:
            retention_enabled: true
            delete_request_store: s3
          storage_config:
            tsdb_shipper:
              active_index_directory: /var/loki/tsdb-index
              cache_location: /var/loki/tsdb-cache
          # Alerts from logs: the audit log and the journal have nowhere else
          # to fire from. Rules are ConfigMaps labelled loki_rule in this
          # namespace, loaded by the chart's sidecar. See docs/platform/logging.md
          rulerConfig:
            alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            enable_alertmanager_v2: true
            enable_api: true
            ring:
              kvstore:
                store: inmemory
            # Scratch space, distinct from the rules directory below.
            rule_path: /var/loki/ruler-scratch
            wal:
              dir: /var/loki/ruler-wal
            storage:
              type: local
              local:
                directory: /rules

        singleBinary:
          replicas: 1
          # On singleBinary, not global, see docs/platform/logging.md
          extraArgs:
            - "-config.expand-env=true"
          # Written by Rook when it provisions the ObjectBucketClaim.
          extraEnvFrom:
            - secretRef:
                name: loki-bucket
          persistence:
            enabled: true
            storageClass: rook-ceph-block
            size: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

        sidecar:
          resources:
            requests:
              cpu: 10m
              memory: 88Mi
            limits:
              memory: 192Mi

        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        # SimpleScalable-only components, and the smoke tests.
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false

        monitoring:
          # The chart relabels `job` to logging/loki.
          serviceMonitor:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
