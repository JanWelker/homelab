---
crds:
  enabled: true

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true

# Rendered unconditionally; waits for kube-prometheus-stack CRDs, see docs.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true

# ~2.5x measured peak; see docs/platform/cert-manager.md
resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    memory: 256Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
