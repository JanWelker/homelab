---
crds:
  enabled: true

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true

# Rendered unconditionally; waits for kube-prometheus-stack CRDs, see docs.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true

# ~2.5x measured peak; see docs/platform/cert-manager.md
resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    memory: 256Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi

webhook:
  # failurePolicy Fail: one replica refuses every apply while its node drains.
  # See docs/platform/cert-manager.md#configuration
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Worker-only, so ScheduleAnyway; see docs/platform/index.md#replica-placement
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: webhook
          app.kubernetes.io/instance: cert-manager
          app.kubernetes.io/component: webhook
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
