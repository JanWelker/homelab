---
# Route53 credentials for cert-manager DNS-01 solver.
#
# The underlying access-key-id / secret-access-key live in OpenBao at:
#
#   kv/cert-manager/route53
#
# Store them with:
#
#   bao kv put kv/cert-manager/route53 \
#     access-key-id="$AWS_ACCESS_KEY_ID" \
#     secret-access-key="$AWS_SECRET_ACCESS_KEY"
#
# ESO renders them into a Kubernetes Secret named `route53-credentials`
# that the ClusterIssuers reference. See docs/platform/openbao.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: route53-credentials
  namespace: cert-manager
  annotations:
    # First of the three, because the other two cannot work without it: the
    # ClusterIssuers that read this Secret are at 2 and the Certificates they
    # issue at 3. Argo orders custom resources within a wave alphabetically,
    # which put this one last of the three and deadlocked the sync.
    argocd.argoproj.io/sync-wave: "1"
    # Belt and braces. The external-secrets Application syncs at -6, ahead of
    # cert-manager at -5, so the CRD is there by the time this is applied.
    # Skipping the dry run costs nothing and covers the first sync of a cluster
    # where the CRDs have not landed yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: route53-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key-id
      remoteRef:
        key: cert-manager/route53
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: cert-manager/route53
        property: secret-access-key
