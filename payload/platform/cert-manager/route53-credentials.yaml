---
# Stored in OpenBao at kv/cert-manager/route53; see docs/platform/cert-manager.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: route53-credentials
  namespace: cert-manager
  annotations:
    # Before the ClusterIssuers (2) and Certificates (3) that need this Secret.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: route53-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key-id
      remoteRef:
        key: cert-manager/route53
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: cert-manager/route53
        property: secret-access-key
