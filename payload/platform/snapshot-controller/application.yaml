---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  # The owning project ships kustomize directories, not a chart: the CRDs and
  # the controller from one tag. Renovate moves both; see docs/platform/velero.md
  sources:
    - repoURL: https://github.com/kubernetes-csi/external-snapshotter.git
      targetRevision: v8.7.0
      path: client/config/crd
    - repoURL: https://github.com/kubernetes-csi/external-snapshotter.git
      targetRevision: v8.7.0
      path: deploy/kubernetes/snapshot-controller
      kustomize:
        namespace: backup
        # Upstream's Deployment at a tag still names the previous release's
        # image; Renovate moves this with targetRevision. See docs/platform/velero.md
        images:
          - registry.k8s.io/sig-storage/snapshot-controller=registry.k8s.io/sig-storage/snapshot-controller:v8.7.0
        patches:
          - target:
              kind: Deployment
              name: snapshot-controller
            patch: |-
              - op: add
                path: /spec/template/spec/securityContext
                value:
                  # The image declares no user, so runAsNonRoot needs an id.
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/containers/0/securityContext
                value:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
              - op: add
                path: /spec/template/spec/topologySpreadConstraints
                value:
                  # Worker-only, so ScheduleAnyway; see
                  # docs/platform/index.md#replica-placement
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
                    nodeTaintsPolicy: Honor
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: snapshot-controller
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/snapshot-controller
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
