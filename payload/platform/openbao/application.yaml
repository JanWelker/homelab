---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "0"
    link.argocd.argoproj.io/external-link: https://vault.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.29.5
      helm:
        valuesObject:
          global:
            enabled: true
            tlsDisable: true

          injector:
            enabled: false

          server:
            # Keep uid/gid: this block replaces the chart's. See openbao docs.
            statefulSet:
              securityContext:
                pod:
                  runAsNonRoot: true
                  runAsUser: 100
                  runAsGroup: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                container:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                    add:
                      - IPC_LOCK
            image:
              # No registry prefix: the chart already prepends quay.io.
              repository: openbao/openbao
              # renovate: datasource=github-releases depName=openbao/openbao extractVersion=^v(?<version>.+)$
              tag: 2.6.2
            ha:
              enabled: true
              replicas: 3
              raft:
                enabled: true
                setNodeId: true
                config: |
                  ui = true

                  listener "tcp" {
                    tls_disable = 1
                    address = "[::]:8200"
                    cluster_address = "[::]:8201"

                    # The ServiceMonitor has no token to present.
                    telemetry {
                      unauthenticated_metrics_access = true
                    }
                  }

                  storage "raft" {
                    path = "/openbao/data"

                    # Required: without them followers never join the cluster.
                    retry_join {
                      leader_api_addr = "http://openbao-0.openbao-internal:8200"
                    }

                    retry_join {
                      leader_api_addr = "http://openbao-1.openbao-internal:8200"
                    }

                    retry_join {
                      leader_api_addr = "http://openbao-2.openbao-internal:8200"
                    }
                  }

                  service_registration "kubernetes" {}

                  # No seal stanza: Shamir, manual unseal after every restart.

                  telemetry {
                    prometheus_retention_time = "30s"
                    disable_hostname = true
                  }
            dataStorage:
              enabled: true
              size: 10Gi
              storageClass: rook-ceph-block
              accessMode: ReadWriteOnce
            auditStorage:
              enabled: true
              size: 10Gi
              storageClass: rook-ceph-block
              accessMode: ReadWriteOnce
            serviceAccount:
              create: true
              name: openbao
            # Sealed pods report Ready so rollouts don't stall; check `bao status`.
            readinessProbe:
              enabled: true
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

          ui:
            enabled: true
            serviceType: ClusterIP

          serverTelemetry:
            serviceMonitor:
              enabled: true
              interval: 30s
            prometheusRules:
              enabled: true
            grafanaDashboard:
              enabled: true

          csi:
            enabled: false
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/openbao
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
