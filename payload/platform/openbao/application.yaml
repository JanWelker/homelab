---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "0"
    link.argocd.argoproj.io/external-link: https://vault.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.29.4
      helm:
        valuesObject:
          global:
            enabled: true
            tlsDisable: true

          injector:
            enabled: false

          server:
            image:
              # The chart prepends server.image.registry, which already
              # defaults to quay.io -- spelling it here too asks the kubelet
              # for quay.io/quay.io/openbao/openbao.
              repository: openbao/openbao
              # renovate: datasource=github-releases depName=openbao/openbao extractVersion=^v(?<version>.+)$
              tag: 2.6.2
            ha:
              enabled: true
              replicas: 3
              raft:
                enabled: true
                setNodeId: true
                config: |
                  ui = true

                  listener "tcp" {
                    tls_disable = 1
                    address = "[::]:8200"
                    cluster_address = "[::]:8201"
                  }

                  storage "raft" {
                    path = "/openbao/data"

                    # Every replica lists all three, itself included -- a node
                    # skips its own address. Without these, a follower comes up
                    # as its own uninitialised cluster and stays there: it
                    # reports "Vault is not initialized" and refuses unseal
                    # keys, because `bao operator init` initialises the leader's
                    # raft cluster, not the pod. Kubernetes service
                    # registration does not join anything; it only labels pods
                    # active and standby.
                    retry_join {
                      leader_api_addr = "http://openbao-0.openbao-internal:8200"
                    }

                    retry_join {
                      leader_api_addr = "http://openbao-1.openbao-internal:8200"
                    }

                    retry_join {
                      leader_api_addr = "http://openbao-2.openbao-internal:8200"
                    }
                  }

                  service_registration "kubernetes" {}

                  # No seal stanza, so the seal is Shamir: OpenBao seals on
                  # every pod restart and stays sealed until an operator
                  # supplies 3 of the 5 key shares. While it is sealed no
                  # ExternalSecret resolves, so cert-manager cannot renew
                  # certificates -- a node reboot needs a human afterwards.
                  # See docs/platform/openbao.md.

                  telemetry {
                    prometheus_retention_time = "30s"
                    disable_hostname = true
                  }
            dataStorage:
              enabled: true
              size: 10Gi
              storageClass: rook-ceph-block
              accessMode: ReadWriteOnce
            auditStorage:
              enabled: true
              size: 10Gi
              storageClass: rook-ceph-block
              accessMode: ReadWriteOnce
            serviceAccount:
              create: true
              name: openbao
            readinessProbe:
              enabled: true
              # Allow unsealed nodes to be marked Ready (standby is healthy in HA)
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

          ui:
            enabled: true
            serviceType: ClusterIP

          serverTelemetry:
            serviceMonitor:
              enabled: true
              interval: 30s
            prometheusRules:
              enabled: true

          csi:
            enabled: false
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/openbao
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
