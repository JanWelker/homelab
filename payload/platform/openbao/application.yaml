---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "0"
    link.argocd.argoproj.io/external-link: https://vault.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.29.4
      helm:
        valuesObject:
          global:
            enabled: true
            tlsDisable: true

          injector:
            enabled: false

          server:
            image:
              repository: quay.io/openbao/openbao
              # renovate: datasource=github-releases depName=openbao/openbao extractVersion=^v(?<version>.+)$
              tag: 2.6.2
            # Credentials for the awskms seal below. This Secret cannot come
            # from ESO: ESO reads through OpenBao, and OpenBao cannot be
            # unsealed until it can reach KMS. It is created once by hand from
            # kms-credentials.yaml.template -- see docs/platform/openbao.md.
            extraSecretEnvironmentVars:
              - envName: AWS_ACCESS_KEY_ID
                secretName: openbao-kms
                secretKey: access-key-id
              - envName: AWS_SECRET_ACCESS_KEY
                secretName: openbao-kms
                secretKey: secret-access-key
            ha:
              enabled: true
              replicas: 3
              raft:
                enabled: true
                setNodeId: true
                config: |
                  ui = true

                  listener "tcp" {
                    tls_disable = 1
                    address = "[::]:8200"
                    cluster_address = "[::]:8201"
                  }

                  storage "raft" {
                    path = "/openbao/data"
                  }

                  service_registration "kubernetes" {}

                  # Auto-unseal. Without this OpenBao seals on every pod
                  # restart and stays sealed until an operator supplies 3 of 5
                  # key shares -- and while it is sealed no ExternalSecret
                  # resolves, so cert-manager cannot renew certificates. A
                  # power cut therefore left the cluster running but unable to
                  # issue certificates until a human intervened.
                  #
                  # An alias rather than a key ID or ARN, so this file carries
                  # no account-specific identifier and the key can be rotated
                  # in AWS without a commit here. access_key and secret_key
                  # come from the environment, via extraSecretEnvironmentVars.
                  seal "awskms" {
                    region     = "eu-central-1"
                    kms_key_id = "alias/openbao-unseal"
                  }

                  telemetry {
                    prometheus_retention_time = "30s"
                    disable_hostname = true
                  }
            dataStorage:
              enabled: true
              size: 10Gi
              storageClass: rook-ceph-block
              accessMode: ReadWriteOnce
            auditStorage:
              enabled: true
              size: 10Gi
              storageClass: rook-ceph-block
              accessMode: ReadWriteOnce
            serviceAccount:
              create: true
              name: openbao
            readinessProbe:
              enabled: true
              # Allow unsealed nodes to be marked Ready (standby is healthy in HA)
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

          ui:
            enabled: true
            serviceType: ClusterIP

          serverTelemetry:
            serviceMonitor:
              enabled: true
              interval: 30s
            prometheusRules:
              enabled: true

          csi:
            enabled: false
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/openbao
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
