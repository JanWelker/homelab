---
# Bound by the OpenBao role `external-secrets`; see docs/platform/openbao.md
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-vault
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-vault-token-creator
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["external-secrets-vault"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-vault-token-creator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-vault-token-creator
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets-vault
            namespace: external-secrets
---
# Workloads: each namespace logs in as its own external-secrets-vault
# ServiceAccount and reaches kv/<namespace>/ only. See
# docs/platform/openbao.md#kubernetes-auth
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-apps
spec:
  # The namespaces the openbao store serves, by name: a label could be set by
  # any workload that ships its own Namespace.
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
              - arc-runners
              - argocd
              - authentik
              - cert-manager
              - external-dns
              - monitoring
  provider:
    vault:
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-apps"
          # No namespace: ESO requests the token in the ExternalSecret's own.
          serviceAccountRef:
            name: external-secrets-vault
---
# The agent sessions' GitHub tokens live at kv/claude-<session>/, outside
# their namespace's prefix. See docs/platform/openbao.md#kubernetes-auth
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-claude-agents
spec:
  conditions:
    - namespaces:
        - claude-agents
  provider:
    vault:
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-claude-agents"
          serviceAccountRef:
            name: external-secrets-vault
