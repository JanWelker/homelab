---
# Written for this cluster, not vendored: upstream ships none. See docs/platform/tetragon.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: tetragon-dashboard
  namespace: kube-system
  labels:
    grafana_dashboard: "1"
data:
  tetragon-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "title": "Tetragon docs",
          "type": "link",
          "icon": "doc",
          "targetBlank": true,
          "url": "https://tetragon.io/docs/"
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Agent health",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Agents",
          "description": "One per node. Fewer than the node count is a node Tetragon cannot see.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(tetragon_build_info)",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Policies enabled",
          "description": "Per agent; every agent should report the same number.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(tetragon_tracingpolicy_loaded{state=\"enabled\"})",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Policies failing",
          "description": "A policy in error or load_error watches nothing. TetragonPolicyNotLoaded fires after ten minutes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(tetragon_tracingpolicy_loaded{state=~\"error|load_error\"})",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Events lost",
          "description": "Ring-buffer overflows in the selected range. Any number means the record has gaps.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(increase(tetragon_observer_ringbuf_events_lost_total[$__range]))",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Export drops",
          "description": "Events the rate limiter dropped before the file. The limit is off, so this should stay zero.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(increase(tetragon_export_ratelimit_events_dropped_total[$__range]))",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Agent memory, worst node",
          "description": "Working set of the busiest agent. The limit is 2.5x the measured peak.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(container_memory_working_set_bytes{namespace=\"kube-system\", container=\"tetragon\"})",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 0,
              "mappings": [],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 400000000
                  },
                  {
                    "color": "red",
                    "value": 480000000
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Events per second by type",
          "description": "What the kernel is reporting. PROCESS_KPROBE is the two TracingPolicies; exec and exit are every container.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "refId": "A",
              "format": "time_series",
              "expr": "sum by (type) (rate(tetragon_events_total[$__rate_interval]))",
              "legendFormat": "{{type}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "unit": "reqps",
              "decimals": 2,
              "min": 0,
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Agent CPU per node",
          "description": "CPU the tetragon container uses on each node: the cost of watching. Tetragon's own BPF overhead counters need kernel BPF stats, which Flatcar does not enable.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "refId": "A",
              "format": "time_series",
              "expr": "sum by (node) (rate(container_cpu_usage_seconds_total{namespace=\"kube-system\", container=\"tetragon\"}[$__rate_interval]))",
              "legendFormat": "{{node}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "unit": "percentunit",
              "decimals": 2,
              "min": 0,
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "row",
          "title": "Activity",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Execs per second by namespace",
          "description": "Process starts in pods. A flat line that jumps is a job, a rollout, or something new.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "refId": "A",
              "format": "time_series",
              "expr": "sum by (namespace) (rate(tetragon_events_total{type=\"PROCESS_EXEC\", namespace=~\"$namespace\", namespace!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{namespace}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "unit": "reqps",
              "decimals": 2,
              "min": 0,
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Policy hits per second",
          "description": "process-creds-changed and egress-outside-cluster are records and fire continuously; every other policy should be flat at zero.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "refId": "A",
              "format": "time_series",
              "expr": "sum by (policy) (rate(tetragon_policy_events_total[$__rate_interval]))",
              "legendFormat": "{{policy}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "unit": "reqps",
              "decimals": 2,
              "min": 0,
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Policy hits by binary",
          "description": "Which binary tripped which policy, over the selected range. sensitive-file-access rows are the ones to read.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (policy, namespace, workload, binary) (increase(tetragon_policy_events_total{namespace=~\"$namespace\"}[$__range])) > 0",
              "refId": "A",
              "format": "table",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "policy": "Policy",
                  "namespace": "Namespace",
                  "workload": "Workload",
                  "binary": "Binary",
                  "Value": "Hits"
                },
                "indexByName": {}
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Hits",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "row",
          "title": "Events, from Loki",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "panels": []
        },
        {
          "id": 15,
          "type": "logs",
          "title": "Latest policy hits",
          "description": "Every TracingPolicy event in the range, newest first. Expand a line for the full event, including the file path in args.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "editorMode": "code",
              "expr": "{namespace=\"kube-system\", container=\"export-stdout\"} | json | process_kprobe_policy_name=~\".+\" | process_kprobe_process_pod_namespace=~\"$namespace|\" | line_format \"{{.process_kprobe_policy_name}} {{.process_kprobe_process_pod_namespace}}/{{.process_kprobe_process_pod_name}} {{.process_kprobe_process_binary}} {{.process_kprobe_process_arguments}} ({{.process_kprobe_function_name}})\"",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 16,
          "type": "logs",
          "title": "Shells started in containers",
          "description": "An exec of sh, bash, dash or ash inside a pod. Entrypoints and exec probes do this legitimately; a person does it rarely.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 12,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "editorMode": "code",
              "expr": "{namespace=\"kube-system\", container=\"export-stdout\"} | json | process_exec_process_binary=~\".*/(ba|da|a)?sh\" | process_exec_process_pod_namespace=~\"$namespace\" | line_format \"{{.process_exec_process_pod_namespace}}/{{.process_exec_process_pod_name}} {{.process_exec_process_binary}} {{.process_exec_process_arguments}}  <- {{.process_exec_parent_binary}}\"",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 17,
          "type": "logs",
          "title": "Latest execs",
          "description": "Every process start in the selected namespaces, with arguments and parent. High volume; narrow the namespace first.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 12,
            "w": 12,
            "x": 12,
            "y": 40
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "editorMode": "code",
              "expr": "{namespace=\"kube-system\", container=\"export-stdout\"} | json | process_exec_process_pod_namespace=~\"$namespace\" | process_exec_process_pod_namespace!=\"\" | line_format \"{{.process_exec_process_pod_namespace}}/{{.process_exec_process_pod_name}} {{.process_exec_process_binary}} {{.process_exec_process_arguments}}  <- {{.process_exec_parent_binary}}\"",
              "refId": "A",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 18,
          "type": "row",
          "title": "Reading events without Grafana",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 52
          },
          "panels": []
        },
        {
          "id": 19,
          "type": "text",
          "title": "tetra and kubectl",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 53
          },
          "options": {
            "mode": "markdown",
            "content": "```bash\n# Live events for one namespace, compact\nkubectl -n kube-system exec ds/tetragon -c tetragon -- tetra getevents -o compact --namespaces nextcloud\n\n# Is every policy loaded on every node\nkubectl get tracingpolicies -o wide\n\n# The same stream this dashboard reads\nkubectl -n kube-system logs ds/tetragon -c export-stdout --since=10m | jq -c 'select(.process_kprobe)'\n```\n\nPolicies and alerts: [Tetragon](https://homelab.wlkr.ch/platform/tetragon/)."
          }
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "security",
        "tetragon"
      ],
      "templating": {
        "list": [
          {
