---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tetragon
  namespace: kube-system
  labels:
    app.kubernetes.io/name: tetragon
spec:
  groups:
    - name: tetragon
      rules:
        # The "unless offset" branch catches a first hit; see docs/platform/tetragon.md#pitfalls
        - alert: TetragonSensitiveFileAccess
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="sensitive-file-access"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="sensitive-file-access"}
              unless
                tetragon_policy_events_total{policy="sensitive-file-access"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} touched key material or a login file
            description: >-
              {{ $labels.binary }}{{ if $labels.pod }} in pod
              {{ $labels.namespace }}/{{ $labels.pod }}{{ else }} on the host{{ end }}
              opened a file under the control plane's PKI, the encryption
              config, etcd's data or the kubelet's certificates and is not a
              control-plane binary, or wrote to passwd, shadow, group,
              sudoers, ld.so.preload, a cron or sudoers drop-in or root's
              ssh directory. The event, with the path and arguments, is in
              Loki: {container="export-stdout"} | json |
              process_kprobe_policy_name="sensitive-file-access".
        - alert: TetragonCredentialsEscalated
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="process-creds-changed", namespace!~"rook-ceph|kube-system"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="process-creds-changed", namespace!~"rook-ceph|kube-system"}
              unless
                tetragon_policy_events_total{policy="process-creds-changed", namespace!~"rook-ceph|kube-system"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} in {{ $labels.namespace }}/{{ $labels.pod }} changed namespace after it started
            description: >-
              A process in the container moved into another mount, pid,
              network or user namespace after it was executed: nsenter,
              setns, or an escape. runc, which does this on every start, is
              dropped in the kernel; Cilium's init containers and Rook's OSD
              prepare Jobs nsenter into the host by design, so kube-system
              and rook-ceph are left out. Loki:
              {container="export-stdout"} | json |
              process_kprobe_policy_name="process-creds-changed".
        - alert: TetragonExecFromWritablePath
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="exec-from-writable-path"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="exec-from-writable-path"}
              unless
                tetragon_policy_events_total{policy="exec-from-writable-path"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.pod }} ran a binary from a writable path
            description: >-
              A process in {{ $labels.namespace }}/{{ $labels.pod }} executed
              a file under /tmp, /var/tmp, /dev/shm, /run or one of the
              emptyDirs that carry binaries here, and it is not one an init
              container is known to put there. Nothing in an image lives on
              those paths, so the binary was written after the container
              started. The event, with the path and the parent process, is in
              Loki: {container="export-stdout"} | json |
              process_kprobe_policy_name="exec-from-writable-path".
        - alert: TetragonUserNamespaceCreated
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="kill-unprivileged-user-namespace"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="kill-unprivileged-user-namespace"}
              unless
                tetragon_policy_events_total{policy="kill-unprivileged-user-namespace"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} in {{ $labels.namespace }}/{{ $labels.pod }} created a user namespace
            description: >-
              A process without CAP_SYS_ADMIN created a user namespace, in
              which it is root; most kernel privilege-escalation chains start
              there. Nothing here does that on purpose, and the policy killed
              it. Loki: {container="export-stdout"} | json |
              process_kprobe_policy_name="kill-unprivileged-user-namespace".
        - alert: TetragonBpfProgramLoaded
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="bpf-program-load", namespace!~"cilium|kube-system"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="bpf-program-load", namespace!~"cilium|kube-system"}
              unless
                tetragon_policy_events_total{policy="bpf-program-load", namespace!~"cilium|kube-system"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} in {{ $labels.namespace }}/{{ $labels.pod }} loaded a BPF program
            description: >-
              Cilium and Tetragon are the only BPF loaders here and are left
              out. A program loaded from anywhere else sees every packet and
              syscall on the node. Loki: {container="export-stdout"} | json |
              process_kprobe_policy_name="bpf-program-load".
        - alert: TetragonKernelModuleLoaded
          expr: |
            sum by (namespace, pod, binary, hook) (
                increase(tetragon_policy_events_total{policy="kernel-module-load", namespace!="rook-ceph"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="kernel-module-load", namespace!="rook-ceph"}
              unless
                tetragon_policy_events_total{policy="kernel-module-load", namespace!="rook-ceph"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} in {{ $labels.namespace }}/{{ $labels.pod }} loaded a kernel module
            description: >-
              {{ $labels.hook }}: a container loaded a kernel module or asked
              the autoloader for one. Rook's CSI plugin loads rbd after a
              node boot and is left out; nothing else here should. Loki:
              {container="export-stdout"} | json |
              process_kprobe_policy_name="kernel-module-load".
        - alert: TetragonLibraryFromWritablePath
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="library-from-writable-path"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="library-from-writable-path"}
              unless
                tetragon_policy_events_total{policy="library-from-writable-path"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} in {{ $labels.namespace }}/{{ $labels.pod }} mapped executable code from a writable path
            description: >-
              A file under /tmp, /var/tmp, /dev/shm, /run or a binary-carrying
              emptyDir was mapped with PROT_EXEC: a shared library that was not
              in the image. Loki: {container="export-stdout"} | json |
              process_kprobe_policy_name="library-from-writable-path".
        - alert: TetragonDnsOutsideCluster
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="dns-outside-cluster", namespace!="kube-system"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="dns-outside-cluster", namespace!="kube-system"}
              unless
                tetragon_policy_events_total{policy="dns-outside-cluster", namespace!="kube-system"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} in {{ $labels.namespace }}/{{ $labels.pod }} sent DNS past CoreDNS
            description: >-
              A query on port 53 to something other than the cluster
              resolver. CoreDNS forwards upstream from kube-system and is
              left out; anything else has a resolver of its own, which is
              how DNS tunnels and exfiltration look. The event carries the
              destination: {container="export-stdout"} | json |
              process_kprobe_policy_name="dns-outside-cluster".
        - alert: TetragonMountInContainer
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="mount-in-container", namespace!~"rook-ceph|cilium|kube-system"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="mount-in-container", namespace!~"rook-ceph|cilium|kube-system"}
              unless
                tetragon_policy_events_total{policy="mount-in-container", namespace!~"rook-ceph|cilium|kube-system"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} in {{ $labels.namespace }}/{{ $labels.pod }} mounted a filesystem
            description: >-
              A mount from inside a running container. Rook's CSI plugin,
              Cilium and Tetragon mount by design and are left out; runc's
              setup mounts are dropped in the kernel. Anything else is the
              first step of an escape, or an entrypoint that should not have
              the capability. The event carries source, target and type:
              {container="export-stdout"} | json |
              process_kprobe_policy_name="mount-in-container".
        - alert: TetragonPtraceInContainer
          expr: |
            sum by (namespace, pod, binary) (
                increase(tetragon_policy_events_total{policy="ptrace-in-container"}[10m]) > 0
              or
                tetragon_policy_events_total{policy="ptrace-in-container"}
              unless
                tetragon_policy_events_total{policy="ptrace-in-container"} offset 10m
            ) > 0
          keep_firing_for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.binary }} in {{ $labels.namespace }}/{{ $labels.pod }} attached to another process
            description: >-
              A ptrace attach, a process_vm_writev or an open of another
              process's memory inside a container. Nothing here debugs in
              production; this is injection or credential theft. Loki:
              {container="export-stdout"} | json |
              process_kprobe_policy_name="ptrace-in-container".
        - alert: TetragonPolicyNotLoaded
          expr: |
            tetragon_tracingpolicy_loaded{state=~"error|load_error"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              A Tetragon TracingPolicy failed to load
            description: >-
              A policy in state {{ $labels.state }} watches nothing, silently.
              kubectl get tracingpolicies -o wide names it.
        - alert: TetragonEventsLost
          expr: |
            sum by (pod) (
              rate(tetragon_observer_ringbuf_events_lost_total[10m])
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.pod }} is dropping events
            description: >-
              The agent's ring buffer overflowed for ten minutes; the record
              has gaps. The export deny list is the usual lever.
