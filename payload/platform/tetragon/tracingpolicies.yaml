---
# What each policy watches, and why, is the table in docs/platform/tetragon.md#policies
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-file-access
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      message: Sensitive file accessed
      tags:
        - observability.filesystem
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          # 4 is MAY_READ, 2 is MAY_WRITE
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        # Key material: the control plane and kube-vip read it continuously.
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/kubernetes/pki/
                - /etc/kubernetes/enc/
                - /var/lib/etcd/
                - /var/lib/kubelet/pki/
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/local/bin/kube-apiserver
                - /usr/local/bin/kube-controller-manager
                - /usr/local/bin/kube-scheduler
                - /usr/local/bin/etcd
                - /usr/bin/kubelet
                - /usr/bin/kubeadm
                - /kube-vip
          matchActions:
            - action: Post
              rateLimit: 1m
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /etc/kubernetes/admin.conf
                - /etc/kubernetes/super-admin.conf
          matchBinaries:
            - operator: NotIn
              values:
                - /kube-vip
                - /usr/bin/kubeadm
          matchActions:
            - action: Post
              rateLimit: 1m
        # Host only: in a container a shadow read is PAM in the image.
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /etc/shadow
          matchNamespaces:
            - namespace: Pid
              operator: In
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
        # Persistence. 2 is MAY_WRITE; Mask so an append counts too.
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /etc/passwd
                - /etc/shadow
                - /etc/group
                - /etc/sudoers
                - /etc/ld.so.preload
            - index: 1
              operator: Mask
              values:
                - "2"
          matchActions:
            - action: Post
              rateLimit: 1m
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/sudoers.d/
                - /etc/cron.d/
                - /root/.ssh/
            - index: 1
              operator: Mask
              values:
                - "2"
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: process-creds-changed
spec:
  kprobes:
    - call: commit_creds
      syscall: false
      message: Container process changed namespace after exec
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: cred
      selectors:
        - matchNamespaceChanges:
            - operator: In
              values:
                - Mnt
                - Pid
                - Net
                - User
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-from-writable-path
spec:
  kprobes:
    - call: security_bprm_check
      syscall: false
      message: Binary executed from a writable path
      tags:
        - observability.process
      args:
        - index: 0
          type: linux_binprm
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /tmp/
                - /var/tmp/
                - /dev/shm/
                - /run/
                - /var/run/
                - /shared/
                - /controller/
                - /plugins/
            # Copied into an emptyDir by an init container.
            - index: 0
              operator: NotEqual
              values:
                - /shared/argocd-dex
                - /controller/manager
                - /plugins/velero-plugin-for-aws
            # s6-overlay writes its init and service scripts here at start.
            - index: 0
              operator: NotPrefix
              values:
                - /run/s6
                - /run/service/
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: privileges-raise
spec:
  # redis-ha's busybox calls setgid(0) on every applet.
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - redis-ha
  kprobes:
    - call: __sys_setuid
      syscall: false
      message: setuid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setgid
      syscall: false
      message: setgid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setreuid
      syscall: false
      message: setreuid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setregid
      syscall: false
      message: setregid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setresuid
      syscall: false
      message: setresuid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
        - index: 1
          type: int
        - index: 2
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setresgid
      syscall: false
      message: setresgid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
        - index: 1
          type: int
        - index: 2
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: bpf-program-load
spec:
  kprobes:
    - call: bpf_check
      syscall: false
      message: BPF program loaded
      tags:
        - observability.kernel
      args:
        - index: 1
          type: bpf_attr
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: kernel-module-load
spec:
  kprobes:
    - call: security_kernel_module_request
      syscall: false
      message: Kernel module requested through the autoloader
      tags:
        - observability.kernel
      return: true
      args:
        - index: 0
          type: string
      returnArg:
        index: 0
        type: int
      selectors:
        # Every Go binary's MPTCP probe at start, and Home Assistant's
        # Bluetooth adapter probe.
        - matchArgs:
            - index: 0
              operator: NotPrefix
              values:
                - net-pf-2-proto-262
                - net-pf-31
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: security_kernel_read_file
      syscall: false
      message: Kernel module read for loading
      tags:
        - observability.kernel
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          # 2 is READING_MODULE
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "2"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: find_module_sections
      syscall: false
      message: Kernel module loaded, with its signature status
      tags:
        - observability.kernel
      args:
        - index: 0
          type: nop
        - index: 1
          type: load_info
      # Inlined on some kernels.
      ignore:
        callNotFound: true
      selectors:
        - matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: library-from-writable-path
spec:
  kprobes:
    - call: security_mmap_file
      syscall: false
      message: Executable mapping from a writable path
      tags:
        - observability.process
      args:
        - index: 0
          type: file
        - index: 1
          # PROT_READ is 1, PROT_WRITE 2, PROT_EXEC 4; unsigned long in the kernel
          type: uint64
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /tmp/
                - /var/tmp/
                - /dev/shm/
                - /run/
                - /var/run/
                - /shared/
                - /controller/
                - /plugins/
            - index: 0
              operator: NotEqual
              values:
                - /shared/argocd-dex
                - /controller/manager
                - /plugins/velero-plugin-for-aws
            # Alloy's Snowflake driver unpacks its cgo library here at start.
            - index: 0
              operator: NotPrefix
              values:
                - /tmp/gosnowflake-cgo
            - index: 1
              operator: Mask
              values:
                - "4"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: egress-outside-cluster
spec:
  kprobes:
    - call: security_socket_connect
      syscall: false
      message: Connection outside the cluster and site ranges
      tags:
        - observability.network
      args:
        - index: 0
          type: socket
        - index: 1
          type: sockaddr
      selectors:
        - matchArgs:
            - index: 1
              operator: Family
              values:
                - AF_INET
            - index: 1
              operator: NotSAddr
              values:
                - 127.0.0.1
                - 10.244.0.0/16
                - 10.96.0.0/12
                - 10.9.0.0/16
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: dns-outside-cluster
spec:
  kprobes:
    - call: ip_output
      syscall: false
      message: DNS query to a resolver other than CoreDNS
      tags:
        - observability.network
      args:
        - index: 2
          type: skb
      selectors:
        - matchArgs:
            - index: 2
              operator: Protocol
              values:
                - IPPROTO_TCP
                - IPPROTO_UDP
            - index: 2
              operator: DPort
              values:
                - "53"
            # The pod range covers each node's Cilium router address, which
            # Home Assistant's dhcp integration asks for PTR records at start.
            - index: 2
              operator: NotDAddr
              values:
                - 10.96.0.10
                - 10.244.0.0/16
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: mount-in-container
spec:
  kprobes:
    - call: security_sb_mount
      syscall: false
      message: Filesystem mounted from a container
      tags:
        - observability.filesystem
      args:
        - index: 0
          type: string
        - index: 1
          type: path
        - index: 2
          type: string
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ptrace-in-container
spec:
  kprobes:
    - call: security_ptrace_access_check
      syscall: false
      message: Process attached to another with ptrace
      tags:
        - observability.process
      args:
        - index: 0
          type: nop
        - index: 1
          type: uint32
      selectors:
        - matchArgs:
            - index: 1
              operator: Mask
              values:
                - "2"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
# The one enforcing policy; see docs/platform/tetragon.md#enforcement
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: kill-unprivileged-user-namespace
spec:
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: create_user_ns
      syscall: false
      message: Unprivileged user namespace creation killed
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: nop
      selectors:
        - matchCapabilities:
            - type: Effective
              operator: NotIn
              values:
                - CAP_SYS_ADMIN
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Sigkill
