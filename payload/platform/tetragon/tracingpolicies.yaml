---
# What fires an alert: a read of the cluster's key material by anything that is
# not the control plane, or a write to the files that grant a login, root or
# code in every process. See docs/platform/tetragon.md
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-file-access
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      message: Sensitive file accessed
      tags:
        - observability.filesystem
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          # 4 is MAY_READ, 2 is MAY_WRITE
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        # The control plane's own binaries, and kube-vip, read these
        # continuously; everything else is a person or an intruder.
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/kubernetes/pki/
                - /etc/kubernetes/enc/
                - /var/lib/etcd/
                - /var/lib/kubelet/pki/
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/local/bin/kube-apiserver
                - /usr/local/bin/kube-controller-manager
                - /usr/local/bin/kube-scheduler
                - /usr/local/bin/etcd
                - /usr/bin/kubelet
                - /usr/bin/kubeadm
                - /kube-vip
          matchActions:
            - action: Post
              rateLimit: 1m
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /etc/shadow
                - /etc/kubernetes/admin.conf
                - /etc/kubernetes/super-admin.conf
          matchBinaries:
            - operator: NotIn
              values:
                - /kube-vip
                - /usr/bin/kubeadm
          matchActions:
            - action: Post
              rateLimit: 1m
        # Persistence: a user, a sudo rule, a preloaded library or a cron job.
        # 2 is MAY_WRITE; Mask so an append counts too.
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /etc/passwd
                - /etc/shadow
                - /etc/group
                - /etc/sudoers
                - /etc/ld.so.preload
            - index: 1
              operator: Mask
              values:
                - "2"
          matchActions:
            - action: Post
              rateLimit: 1m
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/sudoers.d/
                - /etc/cron.d/
                - /root/.ssh/
            - index: 1
              operator: Mask
              values:
                - "2"
          matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a container process whose credentials grew after it
# started. commit_creds runs on every execve, fork and setuid, which is a
# record nobody reads; the two selectors keep only a process that gained a
# dangerous capability since its exec, or moved into another namespace,
# which is what a kernel exploit or an escape leaves behind.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: process-creds-changed
spec:
  kprobes:
    - call: commit_creds
      syscall: false
      message: Container process gained privileges after exec
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: cred
      selectors:
        - matchCapabilityChanges:
            - type: Effective
              operator: In
              values:
                - CAP_SYS_ADMIN
                - CAP_SYS_MODULE
                - CAP_SYS_PTRACE
                - CAP_SYS_RAWIO
                - CAP_NET_ADMIN
                - CAP_DAC_OVERRIDE
                - CAP_SETUID
                - CAP_SETGID
                - CAP_BPF
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
        - matchNamespaceChanges:
            - operator: In
              values:
                - Mnt
                - Pid
                - Net
                - User
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a container executing a binary that was not in its
# image. A dropped binary has to live somewhere writable, and the image layer
# is not, so this watches the writable paths every container has plus the
# emptyDirs this cluster mounts binaries into. See docs/platform/tetragon.md
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-from-writable-path
spec:
  kprobes:
    - call: security_bprm_check
      syscall: false
      message: Binary executed from a writable path
      tags:
        - observability.process
      args:
        - index: 0
          type: linux_binprm
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /tmp/
                - /var/tmp/
                - /dev/shm/
                - /run/
                - /var/run/
                - /shared/
                - /controller/
                - /plugins/
            # The three binaries an init container legitimately copies into
            # an emptyDir: Argo CD's dex, CloudNativePG's manager and
            # Velero's AWS plugin.
            - index: 0
              operator: NotEqual
              values:
                - /shared/argocd-dex
                - /controller/manager
                - /plugins/velero-plugin-for-aws
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a container raising its privileges. From the upstream
# policy library's privileges-raise.yaml, minus capset, which every container
# start performs, and restricted to containers.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: privileges-raise
spec:
  kprobes:
    # An unprivileged process creating a user namespace is root inside it;
    # most kernel privilege-escalation chains start here.
    - call: create_user_ns
      syscall: false
      message: User namespace created without CAP_SYS_ADMIN
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: nop
      selectors:
        - matchCapabilities:
            - type: Effective
              operator: NotIn
              values:
                - CAP_SYS_ADMIN
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
    # The setuid family, when the target is root.
    - call: __sys_setuid
      syscall: false
      message: setuid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          # runc sets the container's ids on every start; the busybox in
          # redis-ha and logrotate in Ceph re-assert root, which is the
          # record this policy keeps.
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setgid
      syscall: false
      message: setgid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          # runc sets the container's ids on every start; the busybox in
          # redis-ha and logrotate in Ceph re-assert root, which is the
          # record this policy keeps.
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setreuid
      syscall: false
      message: setreuid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          # runc sets the container's ids on every start; the busybox in
          # redis-ha and logrotate in Ceph re-assert root, which is the
          # record this policy keeps.
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setregid
      syscall: false
      message: setregid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          # runc sets the container's ids on every start; the busybox in
          # redis-ha and logrotate in Ceph re-assert root, which is the
          # record this policy keeps.
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setresuid
      syscall: false
      message: setresuid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
        - index: 1
          type: int
        - index: 2
          type: int
      selectors:
        # The effective id is the one that matters.
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          # runc sets the container's ids on every start; the busybox in
          # redis-ha and logrotate in Ceph re-assert root, which is the
          # record this policy keeps.
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: __sys_setresgid
      syscall: false
      message: setresgid to root
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: int
        - index: 1
          type: int
        - index: 2
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "0"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          # runc sets the container's ids on every start; the busybox in
          # redis-ha and logrotate in Ceph re-assert root, which is the
          # record this policy keeps.
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a container loading a BPF program. Cilium and Tetragon
# are the only things here that should, and the alert leaves them out.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: bpf-program-load
spec:
  kprobes:
    - call: bpf_check
      syscall: false
      message: BPF program loaded
      tags:
        - observability.kernel
      args:
        - index: 1
          type: bpf_attr
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a container loading a kernel module, by name through
# the autoloader or as a file. From the upstream policy library's modules.yaml,
# restricted to containers: the host loads its own at boot. The third hook
# records every load's signature check, host included: Flatcar signs its
# modules but does not enforce it (CONFIG_MODULE_SIG without _FORCE).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: kernel-module-load
spec:
  kprobes:
    - call: security_kernel_module_request
      syscall: false
      message: Kernel module requested through the autoloader
      tags:
        - observability.kernel
      return: true
      args:
        - index: 0
          type: string
      returnArg:
        index: 0
        type: int
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: security_kernel_read_file
      syscall: false
      message: Kernel module read for loading
      tags:
        - observability.kernel
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          # 2 is READING_MODULE
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Equal
              values:
                - "2"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
    - call: find_module_sections
      syscall: false
      message: Kernel module loaded, with its signature status
      tags:
        - observability.kernel
      args:
        - index: 0
          type: nop
        - index: 1
          type: load_info
      # Inlined on some kernels; then the other two hooks still work.
      ignore:
        callNotFound: true
      selectors:
        - matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a container mapping a file from a writable path as
# executable, which is how a dropped shared library gets loaded. Same paths
# and exceptions as exec-from-writable-path; the kernel maps a binary the
# same way before it runs it.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: library-from-writable-path
spec:
  kprobes:
    - call: security_mmap_file
      syscall: false
      message: Executable mapping from a writable path
      tags:
        - observability.process
      args:
        - index: 0
          type: file
        - index: 1
          # PROT_READ is 1, PROT_WRITE 2, PROT_EXEC 4; unsigned long in the kernel
          type: ulong
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /tmp/
                - /var/tmp/
                - /dev/shm/
                - /run/
                - /var/run/
                - /shared/
                - /controller/
                - /plugins/
            - index: 0
              operator: NotEqual
              values:
                - /shared/argocd-dex
                - /controller/manager
                - /plugins/velero-plugin-for-aws
            - index: 1
              operator: Mask
              values:
                - "4"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
# A record, not an alert: every connection a container opens to an address
# outside the pod, service and LAN ranges. Too much of it is routine (ACME,
# S3, the Trivy database, Home Assistant) for an alert; the dashboard and
# Loki show who talks out. The LSM hook sees TCP and connected UDP alike.
# The ranges are the kubeadm subnets and the site network the nodes sit in.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: egress-outside-cluster
spec:
  kprobes:
    - call: security_socket_connect
      syscall: false
      message: Connection outside the cluster and site ranges
      tags:
        - observability.network
      args:
        - index: 0
          type: socket
        - index: 1
          type: sockaddr
      selectors:
        - matchArgs:
            - index: 1
              operator: Family
              values:
                - AF_INET
            - index: 1
              operator: NotSAddr
              values:
                - 127.0.0.1
                - 10.244.0.0/16
                - 10.96.0.0/12
                - 10.9.0.0/16
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a container resolving names anywhere but CoreDNS.
# Every pod is handed the cluster resolver; a query to another server is
# a hard-coded resolver in an image, a tunnel, or exfiltration. ip_output
# sees TCP and UDP alike, so the unconnected sends musl makes count too.
# The address is the kube-dns ClusterIP; CoreDNS itself forwards upstream
# from kube-system and the alert leaves that out.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: dns-outside-cluster
spec:
  kprobes:
    - call: ip_output
      syscall: false
      message: DNS query to a resolver other than CoreDNS
      tags:
        - observability.network
      args:
        - index: 2
          type: skb
      selectors:
        - matchArgs:
            - index: 2
              operator: Protocol
              values:
                - IPPROTO_TCP
                - IPPROTO_UDP
            - index: 2
              operator: DPort
              values:
                - "53"
            - index: 2
              operator: NotDAddr
              values:
                - 10.96.0.10
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a mount from inside a container. Escapes start with a
# mount of the host's disk, cgroup or proc; a running container has no
# reason to mount anything. runc mounts the rootfs, proc and sysfs on every
# start and is dropped here; Cilium, Tetragon and Rook's CSI plugin mount by
# design and the alert leaves their namespaces out.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: mount-in-container
spec:
  kprobes:
    - call: security_sb_mount
      syscall: false
      message: Filesystem mounted from a container
      tags:
        - observability.filesystem
      args:
        - index: 0
          type: string
        - index: 1
          type: path
        - index: 2
          type: string
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchBinaries:
            - operator: NotIn
              values:
                - /usr/bin/runc
          matchActions:
            - action: Post
              rateLimit: 1m
---
# What fires an alert: a container process attaching to another. ptrace,
# process_vm_writev and /proc/<pid>/mem are how code is injected into a
# running process and how credentials are read out of one. Mode 2 is
# PTRACE_MODE_ATTACH; the read mode that ps and top use is left alone.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ptrace-in-container
spec:
  kprobes:
    - call: security_ptrace_access_check
      syscall: false
      message: Process attached to another with ptrace
      tags:
        - observability.process
      args:
        - index: 0
          type: nop
        - index: 1
          type: uint32
      selectors:
        - matchArgs:
            - index: 1
              operator: Mask
              values:
                - "2"
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Post
              rateLimit: 1m
---
# The one policy that enforces: an unprivileged container process that
# creates a user namespace is killed. Nothing here uses them and most kernel
# privilege-escalation chains start with one. A sysctl would do the same for
# the host, where systemd's PrivateUsers= needs them, so this stays scoped to
# containers. Override is not available on Flatcar's kernel, so the namespace
# may exist for the instant before the process dies. See
# docs/platform/tetragon.md
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: kill-unprivileged-user-namespace
spec:
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: create_user_ns
      syscall: false
      message: Unprivileged user namespace creation killed
      tags:
        - observability.privilege_escalation
      args:
        - index: 0
          type: nop
      selectors:
        - matchCapabilities:
            - type: Effective
              operator: NotIn
              values:
                - CAP_SYS_ADMIN
          matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Sigkill
