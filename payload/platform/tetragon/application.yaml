---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetragon
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://monitoring.infra.k8s.wlkr.ch/d/tetragon-overview
    # CRD defaults on every hook read as drift otherwise.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://helm.cilium.io/
      chart: tetragon
      targetRevision: 1.7.1
      helm:
        valuesObject:
          tetragon:
            # Capabilities and privilege changes on exec and kprobe events.
            enableProcessCred: true

            # Alloy reads the sidecar's stdout; see docs/platform/tetragon.md#configuration
            exportDenyList: |
              {"health_check":true}
              {"event_set":["PROCESS_EXEC","PROCESS_EXIT"],"namespace":["","cilium","kube-system"]}

            prometheus:
              serviceMonitor:
                enabled: true

            # 2.5x the measured peak; see docs/platform/tetragon.md#configuration
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi

          tetragonOperator:
            prometheus:
              serviceMonitor:
                enabled: true
            # The chart's own defaults, restated: see docs/platform/index.md
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/tetragon
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
      # The TracingPolicy CRD is installed by the operator on first sync.
      - SkipDryRunOnMissingResource=true
