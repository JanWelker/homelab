---
# The ApplicationSet only picks up application.yaml; this wraps the rest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  labels:
    homelab.wlkr.ch/stage: 08-services
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://monitoring.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://github.com/JanWelker/homelab.git
    targetRevision: HEAD
    path: payload/platform/logging
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # grafana-datasource.yaml lands in `monitoring`, which kube-prometheus-stack
    # creates in this same stage. If this sync runs first the apply fails on a
    # missing namespace, and under RollingSync a failed sync waits for a person.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
