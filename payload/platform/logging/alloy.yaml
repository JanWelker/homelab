---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    # After Loki, which it ships to.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.1
    helm:
      valuesObject:
        controller:
          type: daemonset

          # The API server audit log and the control-plane kubelet's journal
          # exist only on the three control-plane nodes, which carry the
          # NoSchedule taint. Without this Alloy runs on the workers alone and
          # neither ever reaches Loki.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule

          volumes:
            extra:
              # Alloy's data directory, see the mount below.
              - name: tmp
                emptyDir: {}

        alloy:
          # /var/log/pods for container logs and /var/log/journal for the node's
          # own units. Both live under /var/log, so one mount covers them.
          mounts:
            varlog: true

            # Alloy writes its data directory to storagePath, which the chart
            # defaults to /tmp/alloy -- and with a read-only root filesystem it
            # cannot create it, so every pod dies at startup with
            # "failed to create the remotecfg service: mkdir /tmp/alloy:
            # read-only file system". An emptyDir restores exactly what the
            # chart assumes without giving up the read-only root. The directory
            # holds file-tailing positions and is ephemeral here, which is also
            # true of the chart's default: on a writable root it is the
            # container layer, and that does not survive a restart either.
            extra:
              - name: tmp
                mountPath: /tmp

          # Log files are written root-owned with restrictive modes, so a
          # non-root Alloy silently collects nothing.
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # runAsUser 0 above is load-bearing and stays. seccomp is
            # orthogonal to it: RuntimeDefault constrains which syscalls root
            # can make, which is worth having precisely because this one is
            # root.
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

          configMap:
            content: |-
              logging {
                level  = "info"
                format = "logfmt"
              }

              // Pods on this node only. Without the field selector every Alloy
              // instance watches every pod in the cluster and discards all but
              // its own -- six times the API server load for the same result.
              // K8S_NODE_NAME is injected by the chart from spec.nodeName.
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }

                // Kubelet writes to
                // /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  action        = "replace"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.pod_logs.receiver]
              }

              loki.process "pod_logs" {
                // containerd writes "<timestamp> <stream> <flags> <message>".
                // Without this the timestamp and stream end up inside the log
                // line and Loki timestamps everything at ingest time instead.
                stage.cri {}

                forward_to = [loki.write.default.receiver]
              }

              // kubelet, containerd, systemd-sysupdate and update-engine log to
              // journald and nowhere else on Flatcar. Without this, the logs
              // that explain a failed boot or a stuck sysext are reachable only
              // over SSH -- which is exactly when SSH is least convenient.
              discovery.relabel "journal" {
                targets = []

                rule {
                  source_labels = ["__journal__systemd_unit"]
                  target_label  = "unit"
                }
                rule {
                  source_labels = ["__journal__hostname"]
                  target_label  = "node"
                }
              }

              loki.source.journal "node" {
                path          = "/var/log/journal"
                max_age       = "12h"
                relabel_rules = discovery.relabel.journal.rules
                labels        = { job = "systemd-journal" }
                forward_to    = [loki.write.default.receiver]
              }

              // The API server audit log, written only on the three
              // control-plane nodes. Alloy runs everywhere and local.file_match
              // simply finds nothing on the workers, so no scheduling
              // constraint is needed to express "control plane only".
              //
              // This is not a convenience copy. The file lives on tmpfs and is
              // capped at three 100MB files, so shipping it to Loki is the only
              // thing that gives an audit event a life longer than a reboot --
              // and an audit log that does not survive the incident is not an
              // audit log.
              local.file_match "audit" {
                path_targets = [{
                  __path__ = "/var/log/kubernetes/audit/audit.log",
                  job      = "kubernetes-audit",
                  node     = sys.env("K8S_NODE_NAME"),
                }]
              }

              loki.source.file "audit" {
                targets    = local.file_match.audit.targets
                forward_to = [loki.process.audit.receiver]
              }

              loki.process "audit" {
                // Each line is one complete audit Event as JSON. Only `level`
                // and `verb` are lifted to labels: both are small closed sets,
                // which is the property that makes a label cheap. User and
                // resource are far more useful to query by and far too many to
                // label, so they stay in the line for `|= ` and `| json` to
                // reach.
                stage.json {
                  expressions = {
                    audit_level = "level",
                    verb        = "verb",
                    timestamp   = "requestReceivedTimestamp",
                  }
                }

                stage.labels {
                  values = {
                    audit_level = null,
                    verb        = null,
                  }
                }

                // Without this the event is stamped when Alloy read the file
                // rather than when the API server handled the request. The gap
                // is small until the moment it matters, which is precisely when
                // you are lining an audit trail up against everything else.
                stage.timestamp {
                  source = "timestamp"
                  format = "RFC3339Nano"
                }

                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

        # The config-reloader sidecar had no limit while alloy itself did. It
        # peaked at 12Mi; this is the floor used across the platform rather than
        # a measured figure.
        configReloader:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
