---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    # After Loki, which it ships to.
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.1
    helm:
      valuesObject:
        controller:
          type: daemonset

          # The audit log exists only on the tainted control-plane nodes.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule

          volumes:
            extra:
              # Alloy's data directory, see the mount below.
              - name: tmp
                emptyDir: {}

        alloy:
          mounts:
            varlog: true

            # storagePath defaults to /tmp/alloy, unwritable on a read-only root.
            extra:
              - name: tmp
                mountPath: /tmp

          # Log files are root-owned; non-root Alloy silently collects nothing.
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

          configMap:
            content: |-
              logging {
                level  = "info"
                format = "logfmt"
              }

              // This node's pods only; K8S_NODE_NAME comes from spec.nodeName.
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }

                // /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  action        = "replace"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.pod_logs.receiver]
              }

              loki.process "pod_logs" {
                // Parse the CRI prefix so lines keep containerd's timestamp.
                stage.cri {}

                forward_to = [loki.write.default.receiver]
              }

              discovery.relabel "journal" {
                targets = []

                rule {
                  source_labels = ["__journal__systemd_unit"]
                  target_label  = "unit"
                }
                rule {
                  source_labels = ["__journal__hostname"]
                  target_label  = "node"
                }
                // Not via `labels`: the tailer overwrites `job` after those.
                rule {
                  target_label = "job"
                  replacement  = "systemd-journal"
                }
              }

              loki.source.journal "node" {
                path          = "/var/log/journal"
                max_age       = "12h"
                relabel_rules = discovery.relabel.journal.rules
                forward_to    = [loki.write.default.receiver]
              }

              // Control plane only; file_match finds nothing on workers.
              local.file_match "audit" {
                path_targets = [{
                  __path__ = "/var/log/kubernetes/audit/audit.log",
                  job      = "kubernetes-audit",
                  node     = sys.env("K8S_NODE_NAME"),
                }]
              }

              loki.source.file "audit" {
                targets    = local.file_match.audit.targets
                forward_to = [loki.process.audit.receiver]
              }

              loki.process "audit" {
                // Label only small closed sets; user and resource stay in the line.
                stage.json {
                  expressions = {
                    audit_level = "level",
                    verb        = "verb",
                    timestamp   = "requestReceivedTimestamp",
                  }
                }

                stage.labels {
                  values = {
                    audit_level = null,
                    verb        = null,
                  }
                }

                // Stamp with the request time, not the time Alloy read the line.
                stage.timestamp {
                  source = "timestamp"
                  format = "RFC3339Nano"
                }

                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

        configReloader:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
