---
# Alerts evaluated by Loki's ruler over the audit log and the node journal.
# Same format as a PrometheusRule group, with LogQL. See docs/platform/logging.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
  namespace: logging
  labels:
    loki_rule: "1"
  annotations:
    # The ruler reads <directory>/<tenant>/; with auth off the tenant is "fake".
    k8s-sidecar-target-directory: fake
data:
  security.yaml: |
    groups:
      - name: kubernetes-audit
        rules:
          - alert: KubernetesAuditExecIntoPod
            expr: |
              sum by (user_username, objectRef_namespace, objectRef_name) (
                count_over_time(
                  {job="kubernetes-audit", verb="create"}
                    | json
                    | objectRef_subresource=~"exec|attach"
                    | responseStatus_code < 400
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                {{ $labels.user_username }} opened a shell in {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }}
              description: >-
                An exec or attach on pod {{ $labels.objectRef_name }} in
                {{ $labels.objectRef_namespace }} by {{ $labels.user_username }}.
                The command is in the audit log at RequestResponse level.
          - alert: KubernetesAuditSecretReadByUser
            expr: |
              sum by (user_username, objectRef_namespace) (
                count_over_time(
                  {job="kubernetes-audit", verb=~"get|list|watch"}
                    | json
                    | objectRef_resource="secrets"
                    | user_username !~ "system:.*"
                    | responseStatus_code < 400
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                {{ $labels.user_username }} read Secrets in {{ $labels.objectRef_namespace }}
              description: >-
                A Secret read by a user rather than a component. Every
                controller here reads through a ServiceAccount, so this is a
                person with a kubeconfig, or someone holding one.
          - alert: KubernetesAuditRbacBindingChanged
            expr: |
              sum by (user_username, objectRef_resource, objectRef_name) (
                count_over_time(
                  {job="kubernetes-audit", verb=~"create|update|patch|delete"}
                    | json
                    | objectRef_resource=~"clusterrolebindings|clusterroles"
                    | user_username != "system:serviceaccount:argocd:argocd-application-controller"
                    | user_username !~ "system:serviceaccount:kube-system:.*"
                    | responseStatus_code < 400
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                {{ $labels.objectRef_resource }}/{{ $labels.objectRef_name }} changed by {{ $labels.user_username }}
              description: >-
                Cluster-scoped RBAC changed outside an ArgoCD sync. Argo CD and
                the control plane's own controllers are the only writers here;
                namespaced RoleBindings are left out because CloudNativePG
                reconciles one per database continuously.
          - alert: KubernetesAuditForbiddenBurst
            expr: |
              sum by (user_username) (
                count_over_time(
                  {job="kubernetes-audit"}
                    | json
                    | responseStatus_code = 403
                  [10m]
                )
              ) > 10
            labels:
              severity: warning
            annotations:
              summary: >-
                {{ $labels.user_username }} was refused {{ $value }} times in ten minutes
              description: >-
                A burst of 403s from one identity is what probing RBAC from a
                compromised pod looks like. A single typo is not.
          - alert: KubernetesAuditAnonymousRequest
            expr: |
              sum by (requestURI) (
                count_over_time(
                  {job="kubernetes-audit"}
                    | json
                    | user_username="system:anonymous"
                    | responseStatus_code < 400
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                Anonymous request succeeded against {{ $labels.requestURI }}
              description: >-
                The health endpoints are the only anonymous paths, and the
                audit policy drops them. Anything else anonymous that succeeded
                should not have.
      - name: openbao-audit
        rules:
          # The audit device on stdout writes one JSON object per request and
          # response; the server's own log lines share the stream, so the
          # line filters come first and the parser is confined to matches.
          - alert: OpenBaoSecretReadOutsideEso
            expr: |
              sum by (auth_display_name, request_path) (
                count_over_time(
                  {namespace="openbao", container="openbao"}
                    |= `"type":"response"`
                    |= `kv/data/`
                    != `external-secrets`
                    | json
                    | __error__=""
                    | request_operation="read"
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                {{ $labels.auth_display_name }} read {{ $labels.request_path }} from OpenBao
              description: >-
                A secret was read out of OpenBao by something other than the
                External Secrets Operator. Day to day, ESO is the only reader;
                anything else is a person with the root token, or a token that
                should not exist.
      - name: tetragon
        # Detections that need only Tetragon's exec events, which carry the
        # binary's setuid bits, file capabilities and link count. The export
        # deny list keeps host, cilium and kube-system execs out of this
        # stream; the node journal covers the host. See docs/platform/tetragon.md
        rules:
          - alert: TetragonSudoInContainer
            expr: |
              sum by (process_exec_process_pod_namespace, process_exec_process_pod_name, process_exec_process_binary) (
                count_over_time(
                  {namespace="kube-system", container="export-stdout"}
                    |= "process_exec"
                    |= "/sudo"
                    | json
                    | process_exec_process_binary=~".*/sudo"
                    | process_exec_parent_binary != "/usr/bin/ceph-osd" or process_exec_process_arguments !~ "(smartctl|nvme) .*"
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                sudo ran in {{ $labels.process_exec_process_pod_namespace }}/{{ $labels.process_exec_process_pod_name }}
              description: >-
                Ceph's OSD runs sudo smartctl and sudo nvme once a day for
                its device health report and is left out; no other image
                here has a reason to ship sudo, let alone run it. The exec
                event carries the arguments and the parent process.
          - alert: TetragonPrivilegedExec
            expr: |
              sum by (process_exec_process_pod_namespace, process_exec_process_pod_name, process_exec_process_binary) (
                count_over_time(
                  {namespace="kube-system", container="export-stdout"}
                    |= "process_exec"
                    |= "PRIVILEGES_RAISED_EXEC_FILE"
                    | json
                    | process_exec_parent_binary != "/usr/bin/ceph-osd" or process_exec_process_arguments !~ "(smartctl|nvme) .*"
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                {{ $labels.process_exec_process_binary }} raised privileges on exec in {{ $labels.process_exec_process_pod_namespace }}/{{ $labels.process_exec_process_pod_name }}
              description: >-
                A setuid, setgid or file-capability binary ran in a container
                and came out with more privileges than its caller. That is
                what enableProcessCred records binary_properties for. The
                OSD's daily sudo smartctl and sudo nvme are left out.
          - alert: TetragonFilelessExec
            expr: |
              sum by (process_exec_process_pod_namespace, process_exec_process_pod_name, process_exec_process_binary) (
                count_over_time(
                  {namespace="kube-system", container="export-stdout"}
                    |= "process_exec"
                    | json
                    | process_exec_process_binary=~"^/(memfd:|proc/self/fd/).*"
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                Fileless exec in {{ $labels.process_exec_process_pod_namespace }}/{{ $labels.process_exec_process_pod_name }}
              description: >-
                The binary exists only in memory, through memfd_create or an
                anonymous file descriptor. Nothing legitimate here does that.
          - alert: TetragonDeletedBinaryExec
            expr: |
              sum by (process_exec_process_pod_namespace, process_exec_process_pod_name, process_exec_process_binary) (
                count_over_time(
                  {namespace="kube-system", container="export-stdout"}
                    |= "process_exec"
                    |= "inode"
                    | json
                    | process_exec_process_binary_properties_file_inode_links="0"
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                {{ $labels.process_exec_process_binary }} ran after being deleted in {{ $labels.process_exec_process_pod_namespace }}/{{ $labels.process_exec_process_pod_name }}
              description: >-
                The binary's inode has no links left: opened, unlinked, then
                executed, to leave nothing on disk for a scanner.
          - alert: TetragonUnsignedKernelModule
            expr: |
              sum by (node) (
                count_over_time(
                  {namespace="kube-system", container="export-stdout"}
                    |= "find_module_sections"
                    |~ `"signature_ok":\s*false`
                  [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                An unsigned kernel module was loaded on {{ $labels.node }}
              description: >-
                Flatcar signs every module it ships and the kernel checks
                but does not enforce the signature. An unsigned module is
                not Flatcar's, on the host or from a container. The event
                names it.
      - name: systemd-journal
        rules:
          - alert: NodeSshLogin
            expr: |
              sum by (node) (
                count_over_time(
                  {job="systemd-journal", unit=~"sshd@.*"} |= "Accepted " [10m]
                )
              ) > 0
            labels:
              severity: warning
            annotations:
              summary: >-
                SSH login on {{ $labels.node }}
              description: >-
                Nothing routine logs in to a node: Ansible only at provisioning,
                Kured and updates never. The journal line names the key.
          - alert: NodeSshAuthFailures
            expr: |
              sum by (node) (
                count_over_time(
                  {job="systemd-journal", unit=~"sshd@.*"}
                    |~ "Failed |Invalid user|authentication failure"
                  [10m]
                )
              ) > 5
            labels:
              severity: warning
            annotations:
              summary: >-
                {{ $value }} failed SSH attempts on {{ $labels.node }}
              description: >-
                Password authentication is off, so repeated failures are a
                scan or a wrong key being retried, not a typo.
