---
# Fixed name keeps Loki's storage config static, see docs/platform/logging.md
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: loki-bucket
  namespace: logging
  annotations:
    # Required by the obc-backup-exempt admission policy
    homelab.wlkr.ch/backup-exempt: "Logs, not a backup; they age out on their own"
spec:
  bucketName: loki
  storageClassName: ceph-bucket
