# The kopia repository password Velero encrypts volume data with.
# See docs/platform/velero.md#repository-password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: backup
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    # Velero reads this fixed name, and creates it with its default password when absent
    name: velero-repo-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          # The resource backup sits next to the repositories this unlocks
          velero.io/exclude-from-backup: "true"
      data:
        repository-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: velero/repository
        property: password
---
# Written once, never overwritten; see docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: velero-repository
  namespace: backup
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 32
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: velero-repository
  namespace: backup
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: velero-repository
  data:
    - match: {secretKey: password, remoteRef: {remoteKey: velero/repository, property: password}}
