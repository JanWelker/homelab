---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: backup
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # etcd listens on 127.0.0.1 of the control-plane node
          hostNetwork: true
          # Otherwise the node's resolv.conf cannot resolve the RGW Service
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          # Root, because the client certificates are 600 root on the host;
          # nothing else is granted.
          securityContext:
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
            - name: snapshot
              emptyDir: {}
            # The only two places the upload container writes.
            - name: aws-home
              emptyDir: {}
            - name: tmp
              emptyDir: {}
          initContainers:
            - name: snapshot
              image: registry.k8s.io/etcd:3.7.2-0@sha256:7c6c239825d00e3f6328a69caafd54be92063acf0c2ce78b8394699f52b75dc3
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ETCDCTL_API=3 etcdctl \
                    --endpoints=https://127.0.0.1:2379 \
                    --cacert=/pki/ca.crt \
                    --cert=/pki/healthcheck-client.crt \
                    --key=/pki/healthcheck-client.key \
                    snapshot save /snapshot/etcd.db
                  # Verify before upload; `etcdctl snapshot status` is gone in 3.6
                  etcdutl --write-out=table snapshot status /snapshot/etcd.db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: etcd-certs
                  mountPath: /pki
                  readOnly: true
                - name: snapshot
                  mountPath: /snapshot
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.37.12@sha256:ce44b800602264c12298bbf3399055a4cefdb9ed4a098abe564afe26e7071bce
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  S3="http://${BUCKET_HOST}:${BUCKET_PORT}"
                  # RGW needs path-style addressing; no env var exists for it
                  mkdir -p /root/.aws
                  printf '[default]\ns3 =\n    addressing_style = path\n' > /root/.aws/config

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  aws --endpoint-url "$S3" s3 cp \
                    /snapshot/etcd.db "s3://${BUCKET_NAME}/etcd-${TS}.db"

                  # Keep the 14 most recent; the timestamp sorts chronologically
                  aws --endpoint-url "$S3" s3 ls "s3://${BUCKET_NAME}/" \
                    | awk '{print $4}' | grep -E '^etcd-.*\.db$' | sort \
                    | head -n -14 \
                    | while read -r key; do
                        echo "pruning $key"
                        aws --endpoint-url "$S3" s3 rm "s3://${BUCKET_NAME}/${key}"
                      done
              envFrom:
                # Written by Rook for the etcd-backup-bucket claim
                - secretRef:
                    name: etcd-backup-bucket
                - configMapRef:
                    name: etcd-backup-bucket
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
                - name: aws-home
                  mountPath: /root/.aws
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
