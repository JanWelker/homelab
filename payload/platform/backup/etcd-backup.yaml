---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: backup
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # etcd listens on 127.0.0.1 of the control-plane node
          hostNetwork: true
          # Otherwise the node's resolv.conf cannot resolve the RGW Service
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          # Root, because the client certificates are 600 root on the host;
          # nothing else is granted.
          securityContext:
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumes:
            # The client pair and the CA certificate, not the directory: it
            # also holds the CA and server keys.
            - name: etcd-ca
              hostPath:
                path: /etc/kubernetes/pki/etcd/ca.crt
                type: File
            - name: etcd-client-cert
              hostPath:
                path: /etc/kubernetes/pki/etcd/healthcheck-client.crt
                type: File
            - name: etcd-client-key
              hostPath:
                path: /etc/kubernetes/pki/etcd/healthcheck-client.key
                type: File
            - name: snapshot
              emptyDir: {}
            # The only two places the upload container writes.
            - name: aws-home
              emptyDir: {}
            - name: tmp
              emptyDir: {}
          initContainers:
            # The etcd image is distroless: one binary per container, no shell
            - name: snapshot
              image: registry.k8s.io/etcd:3.7.3-0@sha256:0d27b9478551f431f82d1e0ddb6c87ad07ebae8b904c637f3a99213349523910
              command:
                - etcdctl
                - --endpoints=https://127.0.0.1:2379
                - --cacert=/pki/ca.crt
                - --cert=/pki/healthcheck-client.crt
                - --key=/pki/healthcheck-client.key
                - snapshot
                - save
                - /snapshot/etcd.db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: etcd-ca
                  mountPath: /pki/ca.crt
                  readOnly: true
                - name: etcd-client-cert
                  mountPath: /pki/healthcheck-client.crt
                  readOnly: true
                - name: etcd-client-key
                  mountPath: /pki/healthcheck-client.key
                  readOnly: true
                - name: snapshot
                  mountPath: /snapshot
              # etcdctl buffers the whole database on its way to disk.
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi
            # Verify before upload; `etcdctl snapshot status` is gone in 3.6
            - name: verify
              image: registry.k8s.io/etcd:3.7.3-0@sha256:0d27b9478551f431f82d1e0ddb6c87ad07ebae8b904c637f3a99213349523910
              command: [etcdutl, --write-out=table, snapshot, status, /snapshot/etcd.db]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.38.6@sha256:bdb0dd07c54dfc7fe6526387dcf23eaab269875a20d647ae4de8196ea04d6bd4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  S3="http://${BUCKET_HOST}:${BUCKET_PORT}"
                  # RGW needs path-style addressing; no env var exists for it
                  mkdir -p /root/.aws
                  printf '[default]\ns3 =\n    addressing_style = path\n' > /root/.aws/config

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  aws --endpoint-url "$S3" s3 cp \
                    /snapshot/etcd.db "s3://${BUCKET_NAME}/etcd-${TS}.db"

                  # Keep the 14 most recent; the timestamp sorts chronologically
                  aws --endpoint-url "$S3" s3 ls "s3://${BUCKET_NAME}/" \
                    | awk '{print $4}' | grep -E '^etcd-.*\.db$' | sort \
                    | head -n -14 \
                    | while read -r key; do
                        echo "pruning $key"
                        aws --endpoint-url "$S3" s3 rm "s3://${BUCKET_NAME}/${key}"
                      done
              envFrom:
                # Written by Rook for the etcd-backup-bucket claim
                - secretRef:
                    name: etcd-backup-bucket
                - configMapRef:
                    name: etcd-backup-bucket
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
                - name: aws-home
                  mountPath: /root/.aws
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
