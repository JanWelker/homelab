---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: backup
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # Kept a day for the logs, as long as KubeJobFailed looks at it
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # etcd listens on 127.0.0.1 of the control-plane node
          hostNetwork: true
          # Otherwise the node's resolv.conf cannot resolve the RGW Service
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          # Root, because the client certificates are 600 root on the host;
          # nothing else is granted.
          securityContext:
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumes:
            # The client pair and the CA certificate, not the directory: it
            # also holds the CA and server keys.
            - name: etcd-ca
              hostPath:
                path: /etc/kubernetes/pki/etcd/ca.crt
                type: File
            - name: etcd-client-cert
              hostPath:
                path: /etc/kubernetes/pki/etcd/healthcheck-client.crt
                type: File
            - name: etcd-client-key
              hostPath:
                path: /etc/kubernetes/pki/etcd/healthcheck-client.key
                type: File
            - name: snapshot
              emptyDir: {}
            # The only two places the upload container writes.
            - name: aws-home
              emptyDir: {}
            - name: tmp
              emptyDir: {}
          initContainers:
            # The etcd image is distroless: one binary per container, no shell
            - name: snapshot
              image: registry.k8s.io/etcd:3.7.4-0@sha256:47d217be8ec4ca943954b5f4bf8029ee9bc0ffb05fbe2a44d579a1f640e03ed4
              command:
                - etcdctl
                - --endpoints=https://127.0.0.1:2379
                - --cacert=/pki/ca.crt
                - --cert=/pki/healthcheck-client.crt
                - --key=/pki/healthcheck-client.key
                - snapshot
                - save
                - /snapshot/etcd.db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: etcd-ca
                  mountPath: /pki/ca.crt
                  readOnly: true
                - name: etcd-client-cert
                  mountPath: /pki/healthcheck-client.crt
                  readOnly: true
                - name: etcd-client-key
                  mountPath: /pki/healthcheck-client.key
                  readOnly: true
                - name: snapshot
                  mountPath: /snapshot
              # etcdctl buffers the whole database on its way to disk.
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi
            # Verify before upload; `etcdctl snapshot status` is gone in 3.6
            - name: verify
              image: registry.k8s.io/etcd:3.7.4-0@sha256:47d217be8ec4ca943954b5f4bf8029ee9bc0ffb05fbe2a44d579a1f640e03ed4
              command: [etcdutl, --write-out=table, snapshot, status, /snapshot/etcd.db]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.42.1@sha256:b0102d2269f87d8531d931c1a59e248101ace586886e6c077058d94c1c37b846
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  S3="$S3_ENDPOINT"
                  DEST="s3://offsite/backup.etcd"
                  # RGW needs path-style addressing; no env var exists for it
                  mkdir -p /root/.aws
                  printf '[default]\ns3 =\n    addressing_style = path\n' > /root/.aws/config

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  aws --endpoint-url "$S3" s3 cp \
                    /snapshot/etcd.db "${DEST}/etcd-${TS}.db"

                  # Keep the 14 most recent; the timestamp sorts chronologically
                  aws --endpoint-url "$S3" s3 ls "${DEST}/" \
                    | awk '{print $4}' | grep -E '^etcd-.*\.db$' | sort \
                    | head -n -14 \
                    | while read -r key; do
                        echo "pruning $key"
                        aws --endpoint-url "$S3" s3 rm "${DEST}/${key}"
                      done
              # The backup.etcd user may write only its own prefix;
              # docs/platform/rook-ceph.md#backup-writers
              env:
                # Not on EC2: without this aws-cli asks 169.254.169.254 for a
                # region, and the policy drops the attempt
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rook-ceph-object-user-object-store-backup.etcd
                      key: AccessKey
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rook-ceph-object-user-object-store-backup.etcd
                      key: SecretKey
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: rook-ceph-object-user-object-store-backup.etcd
                      key: Endpoint
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
                - name: aws-home
                  mountPath: /root/.aws
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
