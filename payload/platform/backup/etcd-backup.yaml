---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: backup
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # etcd listens on 127.0.0.1 of the control-plane node
          hostNetwork: true
          # Otherwise the node's resolv.conf cannot resolve the RGW Service
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsUser: 0
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
            - name: snapshot
              emptyDir: {}
          initContainers:
            - name: snapshot
              # renovate: datasource=docker depName=registry.k8s.io/etcd
              image: registry.k8s.io/etcd:3.7.1-0@sha256:a9983dd6d9283138ab926daa307c6c25623636703ecf5645d5df4d666ce9eba2
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ETCDCTL_API=3 etcdctl \
                    --endpoints=https://127.0.0.1:2379 \
                    --cacert=/pki/ca.crt \
                    --cert=/pki/healthcheck-client.crt \
                    --key=/pki/healthcheck-client.key \
                    snapshot save /snapshot/etcd.db
                  # Verify before upload; `etcdctl snapshot status` is gone in 3.6
                  etcdutl --write-out=table snapshot status /snapshot/etcd.db
              volumeMounts:
                - name: etcd-certs
                  mountPath: /pki
                  readOnly: true
                - name: snapshot
                  mountPath: /snapshot
          containers:
            - name: upload
              # renovate: datasource=docker depName=public.ecr.aws/aws-cli/aws-cli
              image: public.ecr.aws/aws-cli/aws-cli:2.36.46@sha256:eedfdcb56e9a1b02fabcf656977ca226f40860c6672aca41d435e036bc95a075
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  S3="http://${BUCKET_HOST}:${BUCKET_PORT}"
                  # RGW needs path-style addressing; no env var exists for it
                  mkdir -p /root/.aws
                  printf '[default]\ns3 =\n    addressing_style = path\n' > /root/.aws/config

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  aws --endpoint-url "$S3" s3 cp \
                    /snapshot/etcd.db "s3://${BUCKET_NAME}/etcd-${TS}.db"

                  # Keep the 14 most recent; the timestamp sorts chronologically
                  aws --endpoint-url "$S3" s3 ls "s3://${BUCKET_NAME}/" \
                    | awk '{print $4}' | grep -E '^etcd-.*\.db$' | sort \
                    | head -n -14 \
                    | while read -r key; do
                        echo "pruning $key"
                        aws --endpoint-url "$S3" s3 rm "s3://${BUCKET_NAME}/${key}"
                      done
              envFrom:
                # Written by Rook for the etcd-backup-bucket claim
                - secretRef:
                    name: etcd-backup-bucket
                - configMapRef:
                    name: etcd-backup-bucket
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
