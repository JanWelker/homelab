---
# Lets Velero snapshot RBD volumes. The label is what Velero looks for when
# choosing a class for a given CSI driver; without it Velero finds no class and
# silently skips the volume.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: rook-ceph-block
  labels:
    velero.io/csi-volumesnapshot-class: "true"
  annotations:
    # After snapshot-controller at 2, which is what installs the CRD this
    # resource is an instance of. At the default wave it went first, and the
    # apply -- not the dry run, so SkipDryRunOnMissingResource did nothing for
    # it -- failed with "no matches for kind VolumeSnapshotClass". That ends
    # the sync, so the snapshot-controller and velero Applications queued
    # behind it were never created at all: the entire backup stack was missing
    # because of one resource applied too early.
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
driver: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph
# Delete: the snapshot is an intermediate step. The durable copy is the one the
# data mover writes into the object store.
deletionPolicy: Delete
