---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.2.0
    helm:
      valuesObject:
        initContainers:
          - name: velero-plugin-for-aws
            # Plugin minor must match the chart's Velero appVersion
            # renovate: datasource=docker depName=velero/velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.2@sha256:0751144c1c8e52d52c48717fbd13ad5a3061e612ae4d7ad744a946cd5b139d1a
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins

        # Keys come from the bucket claim's Secret via extraEnvVars below
        credentials:
          useSecret: false

        configuration:
          extraEnvVars:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: velero-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: velero-bucket
                  key: AWS_SECRET_ACCESS_KEY

          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              default: true
              config:
                region: eu-central-1
                s3ForcePathStyle: "true"
                s3Url: http://rook-ceph-rgw-object-store.rook-ceph.svc.cluster.local
                # Required: RGW rejects the SDK's trailing checksum otherwise
                checksumAlgorithm: ""

          features: EnableCSI
          defaultSnapshotMoveData: true
          uploaderType: kopia

          # Must stay empty: the chart's placeholder entry fails the CRD schema
          volumeSnapshotLocation: []

        # No runAsNonRoot: unverified for the plugin initContainer's copy
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

        snapshotsEnabled: true
        deployNodeAgent: true

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
          prometheusRule:
            enabled: true
            spec:
              - alert: VeleroBackupPartialFailures
                expr: increase(velero_backup_partial_failure_total{schedule!=""}[1h]) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  message: Velero backup {{ $labels.schedule }} has partial failures.
              - alert: VeleroBackupFailures
                expr: increase(velero_backup_failure_total{schedule!=""}[1h]) > 0
                for: 15m
                labels:
                  severity: critical
                annotations:
                  message: Velero backup {{ $labels.schedule }} has failed.

        schedules:
          daily:
            disabled: false
            schedule: "0 2 * * *"
            useOwnerReferencesInBackup: false
            template:
              ttl: 336h
              snapshotMoveData: true
              includedNamespaces:
                - "*"
              excludedNamespaces:
                - kube-system
              excludedResources:
                - events
                - events.events.k8s.io

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

        nodeAgent:
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
