---
# Logs in to OpenBao with this token through the openbao-snapshot role, which
# `make bao-policies` writes; see docs/operations/backups.md#openbao
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: backup
spec:
  # Between the etcd snapshot and Velero, so the three never contend
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # Kept a day for the logs, as long as KubeJobFailed looks at it
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot
        spec:
          serviceAccountName: openbao-snapshot
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: snapshot
              emptyDir: {}
            - name: tmp
              emptyDir: {}
          initContainers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  BAO_TOKEN="$(bao write -field=token auth/kubernetes/login \
                    role=openbao-snapshot \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)"
                  export BAO_TOKEN
                  bao operator raft snapshot save /snapshot/openbao.snap
                  bao token revoke -self
                  # A truncated archive fails the job instead of replacing a good one
                  tar -tzf /snapshot/openbao.snap | grep -qx SHA256SUMS
              env:
                - name: BAO_ADDR
                  value: http://openbao-active.openbao.svc.cluster.local:8200
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.42.1@sha256:b0102d2269f87d8531d931c1a59e248101ace586886e6c077058d94c1c37b846
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  S3="$S3_ENDPOINT"
                  DEST="s3://offsite/backup.openbao"
                  # RGW needs path-style addressing; no env var exists for it
                  mkdir -p "$HOME/.aws"
                  printf '[default]\ns3 =\n    addressing_style = path\n' > "$HOME/.aws/config"

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  aws --endpoint-url "$S3" s3 cp \
                    /snapshot/openbao.snap "${DEST}/openbao-${TS}.snap"

                  # Keep the 14 most recent; the timestamp sorts chronologically
                  aws --endpoint-url "$S3" s3 ls "${DEST}/" \
                    | awk '{print $4}' | grep -E '^openbao-.*\.snap$' | sort \
                    | head -n -14 \
                    | while read -r key; do
                        echo "pruning $key"
                        aws --endpoint-url "$S3" s3 rm "${DEST}/${key}"
                      done
              # The backup.openbao user may write only its own prefix;
              # docs/platform/rook-ceph.md#backup-writers
              env:
                - name: HOME
                  value: /tmp
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rook-ceph-object-user-object-store-backup.openbao
                      key: AccessKey
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rook-ceph-object-user-object-store-backup.openbao
                      key: SecretKey
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: rook-ceph-object-user-object-store-backup.openbao
                      key: Endpoint
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
