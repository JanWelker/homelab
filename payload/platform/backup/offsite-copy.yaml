---
# Copies every bucket claim not labelled homelab.wlkr.ch/offsite-copy: "false"
# into offsite/<bucket>/, which TrueNAS pulls. See
# docs/operations/backups.md#off-cluster-copy
apiVersion: v1
kind: ServiceAccount
metadata:
  name: offsite-copy
  namespace: backup
---
# Reads the claims' names and labels; never their Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: offsite-copy
rules:
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: offsite-copy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: offsite-copy
subjects:
  - kind: ServiceAccount
    name: offsite-copy
    namespace: backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-copy
  namespace: backup
spec:
  # After the last nightly backup, the databases' base backups at 03:00
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # Kept a day for the logs, as long as KubeJobFailed looks at it
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      # The first run copies everything; later ones only what changed
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offsite-copy
        spec:
          serviceAccountName: offsite-copy
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
          containers:
            - name: copy
              image: public.ecr.aws/aws-cli/aws-cli:2.40.3@sha256:33a16c53ea442e918b58df67301ad76a8fb57082c39f7e78753b898c3f3e87c2
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  S3="http://${BUCKET_HOST}:${BUCKET_PORT}"
                  # RGW needs path-style addressing; no env var exists for it
                  mkdir -p "$HOME/.aws"
                  printf '[default]\ns3 =\n    addressing_style = path\n' > "$HOME/.aws/config"

                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  buckets="$(curl -fsS --cacert "$SA/ca.crt" \
                    -H "Authorization: Bearer $(cat "$SA/token")" \
                    "https://kubernetes.default.svc/apis/objectbucket.io/v1alpha1/objectbucketclaims?labelSelector=homelab.wlkr.ch%2Foffsite-copy%21%3Dfalse" \
                    | jq -r '.items[].spec.bucketName // empty' | sort -u)" || exit 1
                  [ -n "$buckets" ] || { echo "no bucket claims found"; exit 1; }

                  # One bucket failing, usually a claim without the reader's
                  # bucketPolicy, must not stop the others
                  failed=""
                  for b in $buckets; do
                    echo "== $b"
                    aws --endpoint-url "$S3" s3 sync "s3://$b" "s3://${BUCKET_NAME}/$b" \
                      --delete --only-show-errors || failed="$failed $b"
                  done
                  [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                # The offsite-reader's keys, through the claim's bucketOwner
                - secretRef:
                    name: offsite-bucket
                - configMapRef:
                    name: offsite-bucket
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
