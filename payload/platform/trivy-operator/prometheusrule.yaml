---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator-coverage
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/component: coverage
spec:
  groups:
    - name: trivy-operator.coverage
      rules:
        # A report the API server refuses to store leaves no object behind, so
        # every trivy_* metric stays silent and the workload is
        # indistinguishable from one that is clean. The only way to see it is
        # to compare what is running against what was scanned.
        # See docs/platform/trivy-operator.md.
        - alert: TrivyContainerNotScanned
          expr: |
            count by (namespace, container) (
              kube_pod_container_info
              * on (namespace, pod) group_left ()
              (max by (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1))
            )
            unless on (namespace, container)
            count by (namespace, container) (
              label_replace(trivy_image_info, "container", "$1", "container_name", "(.+)")
            )
          # A full sweep after an operator restart clears in about 30 minutes,
          # and the 24h report TTL recycles every report in the same window.
          # Two hours is several times either, so only a lasting gap fires.
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: >-
              Container {{ $labels.namespace }}/{{ $labels.container }} has no
              vulnerability report
            description: >-
              Trivy Operator has no VulnerabilityReport for container
              {{ $labels.container }} in namespace {{ $labels.namespace }},
              which is running. This is not the same as a clean image: a
              rejected report is never created, so it looks identical to one
              with no findings. Check the operator log for a ResourceExhausted
              write rejection, which means the report exceeded the 2 MiB API
              server limit.
    # Findings that should page. Reports expire every 24h and are rebuilt, so
    # "new" is compared against two days ago rather than against the previous
    # sample, only once the operator has two days of history, and every rule
    # waits long enough for a rebuild to complete.
    # See docs/platform/trivy-operator.md.
    - name: trivy-operator.findings
      rules:
        - alert: TrivyExposedSecretNew
          expr: |
            count by (namespace, container_name, secret_rule_id, secret_target) (
              trivy_exposedsecrets_info
            )
            unless
            count by (namespace, container_name, secret_rule_id, secret_target) (
              trivy_exposedsecrets_info offset 2d
            )
            and on ()
            (count(trivy_image_info offset 2d) > 0)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: >-
              New exposed secret in {{ $labels.namespace }}/{{ $labels.container_name }}
            description: >-
              Trivy found a {{ $labels.secret_rule_id }} at {{ $labels.secret_target }}
              in container {{ $labels.container_name }} of namespace
              {{ $labels.namespace }} that was not in any report two days ago.
        - alert: TrivyRbacCriticalNew
          expr: |
            (
              (
                count by (namespace, resource_kind, resource_name) (
                  trivy_rbacassessments_info{severity="Critical"}
                )
                unless
                count by (namespace, resource_kind, resource_name) (
                  trivy_rbacassessments_info{severity="Critical"} offset 2d
                )
              )
              or
              (
                sum by (resource_kind, resource_name) (
                  trivy_clusterrole_clusterrbacassessments{severity="Critical"}
                ) > 0
                unless
                sum by (resource_kind, resource_name) (
                  trivy_clusterrole_clusterrbacassessments{severity="Critical"} offset 2d
                ) > 0
              )
            )
            and on ()
            (count(trivy_image_info offset 2d) > 0)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: >-
              New critical RBAC finding on {{ $labels.resource_kind }} {{ $labels.resource_name }}
            description: >-
              {{ $labels.resource_kind }} {{ $labels.resource_name }}
              {{ if $labels.namespace }}in namespace {{ $labels.namespace }} {{ end }}
              has a critical RBAC finding that no report carried two days ago.
        - alert: TrivyConfigAuditCritical
          expr: |
            sum by (namespace, resource_kind, resource_name) (
              trivy_resource_configaudits{severity="Critical"}
            ) > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: >-
              Critical misconfiguration on {{ $labels.namespace }}/{{ $labels.resource_name }}
            description: >-
              {{ $labels.resource_kind }} {{ $labels.resource_name }} in namespace
              {{ $labels.namespace }} fails a critical config-audit check. Nothing
              in the cluster did when this rule was written.
        - alert: TrivyComplianceRegression
          expr: |
            sum by (title) (trivy_cluster_compliance{status="Fail"})
            >
            sum by (title) (trivy_cluster_compliance{status="Fail"} offset 1d)
          # Compliance is recomputed every six hours; two runs above
          # yesterday's count is drift, not a rebuild in progress.
          for: 12h
          labels:
            severity: warning
          annotations:
            summary: >-
              More {{ $labels.title }} controls fail than at any point this week
            description: >-
              {{ $labels.title }} has {{ $value }} failing controls, more than
              a day ago. Something applied since then loosened a control.
