---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    # yamllint disable-line rule:line-length
    link.argocd.argoproj.io/external-link: https://monitoring.infra.k8s.wlkr.ch/d/trivy-operator-overview
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts/
      chart: trivy-operator
      targetRevision: 0.36.0
      helm:
        valuesObject:
          # Why each non-default value: docs/platform/trivy-operator.md#configuration
          targetNamespaces: ""
          excludeNamespaces: ""

          operator:
            replicas: 1
            # Old ReplicaSets keep their ConfigAuditReport (trivy-operator#3069).
            revisionHistoryLimit: 1

            vulnerabilityScannerEnabled: true
            exposedSecretScannerEnabled: true
            configAuditScannerEnabled: true
            rbacAssessmentScannerEnabled: true
            infraAssessmentScannerEnabled: true
            clusterComplianceEnabled: true

            sbomGenerationEnabled: true

            clusterSbomCacheEnabled: false

            scannerReportTTL: "24h"
            scanJobTTL: "10m"
            scanSecretTTL: "10m"

            # Keep equal to trivy.timeout below.
            scanJobTimeout: "20m"

            vulnerabilityScannerScanOnlyCurrentRevisions: true
            configAuditScannerScanOnlyCurrentRevisions: true

            builtInTrivyServer: true

            # Scan jobs reuse the namespace's imagePullSecrets.
            accessGlobalSecretsAndServiceAccount: true

            metricsFindingsEnabled: true
            # The dashboard's tables read these.
            metricsExposedSecretInfo: true
            metricsConfigAuditInfo: true
            metricsRbacAssessmentInfo: true
            metricsInfraAssessmentInfo: true
            metricsImageInfo: true
            metricsClusterComplianceInfo: true
            # One series per CVE per container: six-figure cardinality.
            metricsVulnIdEnabled: false

          serviceMonitor:
            enabled: true

          # Pod-level; the config audit keys on it (KSV-0118).
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

          trivyOperator:
            scanJobTolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule

          trivy:
            # Implied by builtInTrivyServer; spelled out for readability.
            mode: ClientServer

            storageClassEnabled: true
            storageClassName: rook-ceph-block
            storageSize: 5Gi

            ignoreUnfixed: false
            severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

            # Mounted into every scan job as trivy.yaml; no phone-home.
            configFile:
              scan:
                skip-version-check: true
                disable-telemetry: true

            # No Description or Links: they push a report past the etcd limit.
            additionalVulnerabilityReportFields: CVSS,Target,Class,PackagePath,PackageType

            # Rego v0, per namespace; only where the full report exceeds the etcd limit.
            ignorePolicy.nextcloud: |
              package trivy

              default ignore = false

              ignore {
                object.get(input, "FixedVersion", "") == ""
                input.Severity != "HIGH"
                input.Severity != "CRITICAL"
              }

              # Azurite's public development key, shipped in azure-storage-common.
              ignore {
                input.RuleID == "azure-storage-account-key"
              }
            ignorePolicy.authentik: |
              package trivy

              default ignore = false

              ignore {
                object.get(input, "FixedVersion", "") == ""
                input.Severity != "HIGH"
                input.Severity != "CRITICAL"
              }

            # Adds what the chart's own context leaves out.
            server:
              securityContext:
                privileged: false
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault

            slow: true
            # Keep equal to operator.scanJobTimeout above.
            timeout: "20m0s"

          nodeCollector:
            # Control plane included, or the CIS node checks skip it.
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule

          compliance:
            # Every spec that applies to a kubeadm cluster.
            specs:
              - k8s-cis-1.23
              - k8s-nsa-1.0
              - k8s-pss-baseline-0.1
              - k8s-pss-restricted-0.1
            # `all` loses the trivy_compliance_info series the dashboard reads.
            reportType: summary
            cron: 0 */6 * * *

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/trivy-operator
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
