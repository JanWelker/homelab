        {
          "id": 23,
          "type": "text",
          "title": "kubectl",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 83
          },
          "options": {
            "mode": "markdown",
            "content": "Every number on this dashboard is derived from a report object, and the object always has more detail than the metric.\n\n```bash\n# What has been scanned, worst first\nkubectl get vulnerabilityreports -A \\\n  --sort-by='.report.summary.criticalCount'\n\n# The findings themselves, for one workload\nkubectl get vulnerabilityreports -n <ns> <name> -o json \\\n  | jq '.report.vulnerabilities[]\n        | select(.severity==\"CRITICAL\")\n        | {id: .vulnerabilityID, pkg: .resource,\n           installed: .installedVersion, fixed: .fixedVersion}'\n\n# Misconfiguration, RBAC and node checks\nkubectl get configauditreports -A\nkubectl get rbacassessmentreports,clusterrbacassessmentreports -A\nkubectl get infraassessmentreports -A\n\n# Which compliance controls are failing\nkubectl get clustercompliancereports k8s-cis-1.23 -o json \\\n  | jq '.status.summary, (.status.summaryReport.controlCheck[]\n        | select(.totalFail > 0))'\n\n# Why a scan has not appeared: the job logs its own failure\nkubectl -n trivy-system get jobs\nkubectl -n trivy-system logs job/<scan-job>\n```\n\nA report reading zero is not the same as a clean image \u2014 a scan that failed reports zero too. Check the object exists and carries a real digest before believing it."
          }
        }
