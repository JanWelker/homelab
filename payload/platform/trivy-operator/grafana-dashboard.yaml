---
# Written for this cluster, not vendored; see docs/platform/trivy-operator.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-dashboard
  namespace: trivy-system
  labels:
    grafana_dashboard: "1"
data:
  trivy-operator-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "title": "Trivy Operator docs",
          "type": "link",
          "icon": "doc",
          "targetBlank": true,
          "url": "https://aquasecurity.github.io/trivy-operator/latest/"
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Cluster totals",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Critical vulnerabilities",
          "description": "Vulnerabilities in the images that are running. Counted once per image, however many containers or workloads run it, and only on ReplicaSets that still have pods. One CVE in three different images counts three times.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(max by (image_digest) ((trivy_image_vulnerabilities{severity=\"Critical\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_image_vulnerabilities{severity=\"Critical\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))))",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "dark-red"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "High vulnerabilities",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(max by (image_digest) ((trivy_image_vulnerabilities{severity=\"High\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_image_vulnerabilities{severity=\"High\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))))",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Exposed secrets",
          "description": "Credentials baked into an image layer. Critical and High only; these are almost never false positives.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(max by (image_digest) ((trivy_image_exposedsecrets{severity=~\"Critical|High\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_image_exposedsecrets{severity=~\"Critical|High\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))))",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "dark-orange"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Failing config-audit checks",
          "description": "Misconfigured workloads: missing resource limits, writable root filesystems, unset security contexts. ReplicaSets without pods are excluded; their reports outlive them.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum((trivy_resource_configaudits{severity=~\"Critical|High\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_resource_configaudits{severity=~\"Critical|High\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))))",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Failing infra checks",
          "description": "CIS node-level findings from node-collector: kubelet, etcd and control-plane file permissions and flags.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(trivy_resource_infraassessments{severity=~\"Critical|High\", namespace=~\"$namespace\"})",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "yellow"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Risky roles",
          "description": "Roles and ClusterRoles granting more than they should \u2014 wildcards, secret access, escalate/bind/impersonate verbs.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(trivy_role_rbacassessments{severity=~\"Critical|High\", namespace=~\"$namespace\"}) + sum(trivy_clusterrole_clusterrbacassessments{severity=~\"Critical|High\"})",
              "refId": "A",
              "format": "time_series",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Compliance",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "table",
          "title": "Controls failing per framework",
          "description": "CIS 1.23, NSA/CISA 1.0 and the two Pod Security Standards profiles, re-evaluated every six hours.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "trivy_cluster_compliance{status=\"Fail\"}",
              "refId": "A",
              "format": "table",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "container": true,
                  "endpoint": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "status": true,
                  "description": true
                },
                "renameByName": {
                  "title": "Framework",
                  "Value": "Failing"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Failing",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Failing"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Failing controls",
          "description": "Which control, not just how many. Emitted only because the report format is `summary`; the collector skips `all` reports.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 8,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "trivy_compliance_info{status=\"Fail\"}",
              "refId": "A",
              "format": "table",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "container": true,
                  "endpoint": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "status": true,
                  "description": true
                },
                "renameByName": {
                  "title": "Framework",
                  "compliance_id": "Control",
                  "compliance_name": "Name",
                  "severity": "Severity",
                  "Value": "Failing"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Failing",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "filterable": true
              },
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Severity"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Failing compliance controls over time",
          "description": "A step down here is the signal that a policy change actually landed; a step up is drift.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (title) (trivy_cluster_compliance{status=\"Fail\"})",
              "refId": "A",
              "format": "time_series",
              "legendFormat": "{{title}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "decimals": 0,
              "min": 0,
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "row",
          "title": "Image vulnerabilities",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "panels": []
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Vulnerabilities by severity",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(max by (image_digest) ((trivy_image_vulnerabilities{severity=\"Critical\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_image_vulnerabilities{severity=\"Critical\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))))",
              "refId": "A",
              "format": "time_series",
              "legendFormat": "Critical"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(max by (image_digest) ((trivy_image_vulnerabilities{severity=\"High\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_image_vulnerabilities{severity=\"High\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))))",
              "refId": "B",
              "format": "time_series",
              "legendFormat": "High"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(max by (image_digest) ((trivy_image_vulnerabilities{severity=\"Medium\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_image_vulnerabilities{severity=\"Medium\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))))",
              "refId": "C",
              "format": "time_series",
              "legendFormat": "Medium"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(max by (image_digest) ((trivy_image_vulnerabilities{severity=\"Low\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_image_vulnerabilities{severity=\"Low\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))))",
              "refId": "D",
              "format": "time_series",
              "legendFormat": "Low"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(max by (image_digest) ((trivy_image_vulnerabilities{severity=\"Unknown\", namespace=~\"$namespace\", resource_kind!=\"ReplicaSet\"} or (trivy_image_vulnerabilities{severity=\"Unknown\", namespace=~\"$namespace\", resource_kind=\"ReplicaSet\"} and on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas > 0, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))))",
              "refId": "E",
              "format": "time_series",
              "legendFormat": "Unknown"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              },
              "decimals": 0,
              "min": 0,
              "mappings": []
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Critical"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "High"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Medium"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Low"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Unknown"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Critical + High by namespace",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
