---
# Separate from authentik-secrets on purpose; see docs/platform/authentik.md#client-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets-nextcloud
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets-nextcloud
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_CLIENT_ID: "{{ .nextcloudClientId }}"
        NEXTCLOUD_CLIENT_SECRET: "{{ .nextcloudClientSecret }}"
  data:
    - secretKey: nextcloudClientId
      remoteRef: {key: nextcloud/config, property: oidc-client-id}
    - secretKey: nextcloudClientSecret
      remoteRef: {key: nextcloud/config, property: oidc-client-secret}
