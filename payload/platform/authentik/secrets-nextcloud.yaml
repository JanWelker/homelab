---
# The one secret the platform reads from a workload's path. ESO fails an
# ExternalSecret whole when any key is missing, so if these lived in
# authentik-secrets a cluster without kv/nextcloud/config would never get
# AUTHENTIK_SECRET_KEY either and Authentik would never go Healthy. On their
# own, and mounted `optional`, they arrive when Nextcloud
# does and their absence costs nothing. Read by the Nextcloud blueprint via
# !Env; the blueprint itself ships with the workload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets-nextcloud
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets-nextcloud
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_CLIENT_ID: "{{ .nextcloudClientId }}"
        NEXTCLOUD_CLIENT_SECRET: "{{ .nextcloudClientSecret }}"
  data:
    - secretKey: nextcloudClientId
      remoteRef: {key: nextcloud/config, property: oidc-client-id}
    - secretKey: nextcloudClientSecret
      remoteRef: {key: nextcloud/config, property: oidc-client-secret}
