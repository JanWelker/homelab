---
# One hostname on the apps Gateway, reachable from the LAN and outside; see
# docs/platform/authentik.md#one-hostname
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - "auth.k8s.wlkr.ch"
  rules:
    # The root discovery document, for OpenCloud's four providers in global
    # issuer mode; see docs/platform/authentik.md#one-issuer-for-opencloud
    - matches:
        - path:
            type: Exact
            value: /.well-known/openid-configuration
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /application/o/opencloud/.well-known/openid-configuration
      backendRefs:
        - name: authentik-server
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "SAMEORIGIN"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        - name: authentik-server
          port: 80
