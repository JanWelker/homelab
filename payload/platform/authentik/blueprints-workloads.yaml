---
# Workload providers and applications, platform code; see docs/platform/authentik.md#where-a-blueprint-lives
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-workloads
  namespace: authentik
data:
  dependency-track.yaml: |
    version: 1
    metadata:
      name: homelab-dependency-track
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: dependency-track-provider
        identifiers:
          name: dependency-track
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # The frontend is a browser application with no place for a
          # secret: authorization code with PKCE.
          client_type: public
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env DEPENDENCY_TRACK_CLIENT_ID
          redirect_uris:
            - matching_mode: strict
              url: https://sbom.infra.k8s.wlkr.ch/static/oidc-callback.html
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # Dependency-Track maps this group to its Administrators team, so the
      # groups claim is what grants admin. Membership stays in Authentik and
      # out of Git: the group is the contract, the people in it are not.
      - model: authentik_core.group
        state: present
        identifiers:
          name: dependency-track-admins
      - model: authentik_core.application
        state: present
        identifiers:
          slug: dependency-track
        attrs:
          name: Dependency-Track
          provider: !KeyOf dependency-track-provider
          meta_launch_url: https://sbom.infra.k8s.wlkr.ch
          meta_description: Software bill of materials for every image the cluster runs
  opencloud.yaml: |
    version: 1
    metadata:
      name: homelab-opencloud
    entries:
      # Four public clients whose IDs are fixed by the clients, so four
      # providers. All in global issuer mode: one issuer for every token,
      # the one the server verifies against. docs/opencloud.md#oidc
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: opencloud-provider
        identifiers:
          name: opencloud
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: web
          issuer_mode: global
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: https://cloud.infra.k8s.wlkr.ch/
            - matching_mode: strict
              url: https://cloud.infra.k8s.wlkr.ch/oidc-callback.html
            - matching_mode: strict
              url: https://cloud.infra.k8s.wlkr.ch/oidc-silent-redirect.html
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: opencloud-desktop-provider
        identifiers:
          name: opencloud-desktop
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: OpenCloudDesktop
          issuer_mode: global
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: regex
              url: ^http://(127\.0\.0\.1|localhost)(:\d+)?(/.*)?$
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: opencloud-ios-provider
        identifiers:
          name: opencloud-ios
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: OpenCloudIOS
          issuer_mode: global
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: oc://ios.opencloud.eu
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: opencloud-android-provider
        identifiers:
          name: opencloud-android
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: OpenCloudAndroid
          issuer_mode: global
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: oc://android.opencloud.eu
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      # OpenCloud reads its roles off the groups claim, and these are the
      # two names its default mapping knows. Membership stays in Authentik
      # and out of Git: the group is the contract, the people in it are not.
      - model: authentik_core.group
        state: present
        identifiers:
          name: opencloudAdmin
      - model: authentik_core.group
        state: present
        identifiers:
          name: opencloudUser
      - model: authentik_core.application
        state: present
        identifiers:
          slug: opencloud
        attrs:
          name: OpenCloud
          provider: !KeyOf opencloud-provider
          meta_launch_url: https://cloud.infra.k8s.wlkr.ch
          meta_description: Files, synced to every device
      - model: authentik_core.application
        state: present
        identifiers:
          slug: opencloud-desktop
        attrs:
          name: OpenCloud Desktop
          provider: !KeyOf opencloud-desktop-provider
          meta_launch_url: blank://blank
          meta_description: The desktop client's loopback redirect
      - model: authentik_core.application
        state: present
        identifiers:
          slug: opencloud-ios
        attrs:
          name: OpenCloud iOS
          provider: !KeyOf opencloud-ios-provider
          meta_launch_url: blank://blank
          meta_description: The iOS app
      - model: authentik_core.application
        state: present
        identifiers:
          slug: opencloud-android
        attrs:
          name: OpenCloud Android
          provider: !KeyOf opencloud-android-provider
          meta_launch_url: blank://blank
          meta_description: The Android app
  advent-wollbi.yaml: |
    version: 1
    metadata:
      name: homelab-advent-wollbi
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: advent-wollbi-provider
        identifiers:
          name: advent-wollbi-oidc
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
          client_id: advent-wollbi
          client_secret: !Env ADVENT_WOLLBI_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://advent.wollbi.ch/api/users/oauth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # Both wollbi sites declare it; membership stays in Authentik and out of
      # Git. Every member becomes a Payload editor on first sign-in.
      - model: authentik_core.group
        state: present
        id: wollbi-editors
        identifiers:
          name: wollbi-editors
      - model: authentik_core.application
        state: present
        id: advent-wollbi-application
        identifiers:
          slug: advent-wollbi
        attrs:
          name: Wollbi Adventsfenster
          provider: !KeyOf advent-wollbi-provider
          meta_launch_url: https://advent.wollbi.ch/admin
          meta_description: The street's advent windows
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf advent-wollbi-application
          group: !KeyOf wollbi-editors
        attrs:
          order: 0
  fest-wollbi.yaml: |
    version: 1
    metadata:
      name: homelab-fest-wollbi
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: fest-wollbi-provider
        identifiers:
          name: fest-wollbi-oidc
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
          client_id: fest-wollbi
          client_secret: !Env FEST_WOLLBI_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://fest.wollbi.ch/api/users/oauth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # Both wollbi sites declare it; membership stays in Authentik and out of
      # Git. Every member becomes a Payload editor on first sign-in.
      - model: authentik_core.group
        state: present
        id: wollbi-editors
        identifiers:
          name: wollbi-editors
      - model: authentik_core.application
        state: present
        id: fest-wollbi-application
        identifiers:
          slug: fest-wollbi
        attrs:
          name: Wollbi-Fescht
          provider: !KeyOf fest-wollbi-provider
          meta_launch_url: https://fest.wollbi.ch/admin
          meta_description: The street's summer party, since 1987
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf fest-wollbi-application
          group: !KeyOf wollbi-editors
        attrs:
          order: 0
