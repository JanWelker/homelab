---
# WAL and nightly base backups to this database's prefix of offsite; the
# stanza and every choice in it: docs/platform/cloudnative-pg.md#backups
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: authentik.db
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  store: object-store
  clusterNamespace: rook-ceph
  displayName: authentik database backups
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: authentik-db
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://offsite/authentik.db/
    endpointURL: https://s3.infra.k8s.wlkr.ch
    s3Credentials:
      accessKeyId: {name: rook-ceph-object-user-object-store-authentik.db, key: AccessKey}
      secretAccessKey: {name: rook-ceph-object-user-object-store-authentik.db, key: SecretKey}
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-db
  namespace: authentik
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: authentik-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
