---
# Separate from authentik-secrets on purpose; see docs/platform/authentik.md#client-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets-open-webui
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets-open-webui
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OPEN_WEBUI_CLIENT_ID: "{{ .openWebuiClientId }}"
        OPEN_WEBUI_CLIENT_SECRET: "{{ .openWebuiClientSecret }}"
  data:
    - secretKey: openWebuiClientId
      remoteRef: {key: open-webui/config, property: oidc-client-id}
    - secretKey: openWebuiClientSecret
      remoteRef: {key: open-webui/config, property: oidc-client-secret}
