---
# Separate from authentik-secrets on purpose; see docs/platform/authentik.md#client-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets-paperless-ngx
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets-paperless-ngx
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PAPERLESS_NGX_CLIENT_ID: "{{ .paperlessClientId }}"
        PAPERLESS_NGX_CLIENT_SECRET: "{{ .paperlessClientSecret }}"
  data:
    - secretKey: paperlessClientId
      remoteRef: {key: paperless-ngx/config, property: oidc-client-id}
    - secretKey: paperlessClientSecret
      remoteRef: {key: paperless-ngx/config, property: oidc-client-secret}
