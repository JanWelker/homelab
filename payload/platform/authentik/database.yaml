---
# Three instances and the import from the bundled chart database:
# docs/platform/authentik.md#database
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:fee233b6d388273e61313f93ac5bfb75449ecd6e107b804b19583526db0f5760

  storage:
    size: 8Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      # Runs once, on first start: pg_dump from the chart's bundled Postgres.
      import:
        type: microservice
        databases:
          - authentik
        source:
          externalCluster: bundled

  externalClusters:
    - name: bundled
      connectionParameters:
        host: authentik-postgresql.authentik.svc
        user: authentik
        dbname: authentik
      password:
        name: authentik-secrets
        key: postgres-password

  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "200"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  monitoring:
    enablePodMonitor: true
