---
# Why three instances: docs/platform/authentik.md#database
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 3
  # The -primary PDB would refuse the primary's eviction on every drain;
  # without it the operator fails over. See docs/platform/authentik.md#database
  enablePDB: false

  # The operator's own anti-affinity is a preference the scheduler outweighs on
  # unequal nodes; this keeps the spread. See docs/platform/authentik.md#database
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          cnpg.io/cluster: authentik-db
          cnpg.io/podRole: instance

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:348997438269fddc0e2825e00594367ad61751adb08a7698a0a14f793b0dc2ce

  storage:
    size: 16Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: authentik
      owner: authentik

  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "200"
      # A quarter of the volume; see docs/platform/cloudnative-pg.md#pitfalls
      max_slot_wal_keep_size: 4GB

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-db

  monitoring:
    enablePodMonitor: true
