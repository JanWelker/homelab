---
# Why three instances: docs/platform/authentik.md#database
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 3
  priorityClassName: platform-core
  # The operator's PDBs stay on: a drain switches the primary over first.
  # See docs/platform/authentik.md#database
  # A spec change switches over too, and no shutdown waits on Authentik's pool.
  # See docs/platform/cloudnative-pg.md#the-contract
  primaryUpdateMethod: switchover
  smartShutdownTimeout: 15

  # The operator's own anti-affinity is a preference the scheduler outweighs on
  # unequal nodes; this keeps the spread. See docs/platform/authentik.md#database
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          cnpg.io/cluster: authentik-db
          cnpg.io/podRole: instance

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:c437b7c6c00aa7e66f5d6de1dd83602391fdebd4ff776ffb1ab7aaba5e7351ad

  storage:
    size: 16Gi
    storageClass: rook-ceph-block

  bootstrap:
    initdb:
      database: authentik
      owner: authentik

  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "200"
      # A quarter of the volume; see docs/platform/cloudnative-pg.md#pitfalls
      max_slot_wal_keep_size: 4GB

  # Request at the measured median, limit at 2.5x the peak; see docs/platform/index.md#components
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-db

  monitoring:
    enablePodMonitor: true
