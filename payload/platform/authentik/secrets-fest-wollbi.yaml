---
# Separate from authentik-secrets on purpose; see docs/platform/authentik.md#client-secrets
# The workload's PushSecret generates the client secret; the client ID is in
# its blueprint in clear.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets-fest-wollbi
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets-fest-wollbi
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        FEST_WOLLBI_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef: {key: fest-wollbi/oidc, property: client-secret}
