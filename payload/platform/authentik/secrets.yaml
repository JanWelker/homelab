---
# Generated by the PushSecret below. Workload credentials live in their own
# path, not here; see docs/platform/authentik.md#client-secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AUTHENTIK_SECRET_KEY: "{{ .secretKey }}"
        # Read only while akadmin does not exist; see docs/platform/authentik.md#bootstrap-credentials
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .bootstrapPassword }}"
        # Read by the blueprints via !Env.
        ARGOCD_CLIENT_ID: "{{ .argocdClientId }}"
        ARGOCD_CLIENT_SECRET: "{{ .argocdClientSecret }}"
        GRAFANA_CLIENT_ID: "{{ .grafanaClientId }}"
        GRAFANA_CLIENT_SECRET: "{{ .grafanaClientSecret }}"
  data:
    - secretKey: secretKey
      remoteRef: {key: authentik/config, property: secret-key}
    - secretKey: bootstrapPassword
      remoteRef: {key: authentik/config, property: bootstrap-password}
    - secretKey: argocdClientId
      remoteRef: {key: authentik/config, property: argocd-client-id}
    - secretKey: argocdClientSecret
      remoteRef: {key: authentik/config, property: argocd-client-secret}
    - secretKey: grafanaClientId
      remoteRef: {key: authentik/config, property: grafana-client-id}
    - secretKey: grafanaClientSecret
      remoteRef: {key: authentik/config, property: grafana-client-secret}
---
# Written once, never overwritten; see docs/platform/openbao.md#generated-secrets
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-config
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - secret-key
    - bootstrap-password
    - argocd-client-id
    - argocd-client-secret
    - grafana-client-id
    - grafana-client-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-config
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: openbao
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: authentik-config
  data:
    - match: {secretKey: secret-key, remoteRef: {remoteKey: authentik/config, property: secret-key}}
    - match: {secretKey: bootstrap-password, remoteRef: {remoteKey: authentik/config, property: bootstrap-password}}
    - match: {secretKey: argocd-client-id, remoteRef: {remoteKey: authentik/config, property: argocd-client-id}}
    - match: {secretKey: argocd-client-secret, remoteRef: {remoteKey: authentik/config, property: argocd-client-secret}}
    - match: {secretKey: grafana-client-id, remoteRef: {remoteKey: authentik/config, property: grafana-client-id}}
    - match: {secretKey: grafana-client-secret, remoteRef: {remoteKey: authentik/config, property: grafana-client-secret}}
