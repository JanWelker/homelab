---
# Generate and store once:
#
#   bao kv put kv/authentik/config \
#     secret-key="$(openssl rand -base64 60 | tr -d '\n')" \
#     postgres-password="$(openssl rand -base64 32 | tr -d '\n')" \
#     bootstrap-password="$(openssl rand -base64 24 | tr -d '\n')" \
#     bootstrap-token="$(openssl rand -hex 32)" \
#     argocd-client-id="$(openssl rand -hex 16)" \
#     argocd-client-secret="$(openssl rand -base64 48 | tr -d '\n')" \
#     grafana-client-id="$(openssl rand -hex 16)" \
#     grafana-client-secret="$(openssl rand -base64 48 | tr -d '\n')"
#
# Nextcloud's client credentials are deliberately NOT here. They live in
# kv/nextcloud/config with the rest of Nextcloud's secrets, so adding an
# application does not mean rewriting this path -- which would rotate
# Authentik's Postgres password out from under its database. Both are written
# by scripts/bao-secrets.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AUTHENTIK_SECRET_KEY: "{{ .secretKey }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .postgresPassword }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .bootstrapPassword }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .bootstrapToken }}"
        # Read by the blueprints via !Env.
        ARGOCD_CLIENT_ID: "{{ .argocdClientId }}"
        ARGOCD_CLIENT_SECRET: "{{ .argocdClientSecret }}"
        GRAFANA_CLIENT_ID: "{{ .grafanaClientId }}"
        GRAFANA_CLIENT_SECRET: "{{ .grafanaClientSecret }}"
        NEXTCLOUD_CLIENT_ID: "{{ .nextcloudClientId }}"
        NEXTCLOUD_CLIENT_SECRET: "{{ .nextcloudClientSecret }}"
        # The Bitnami PostgreSQL subchart reads this key name directly.
        postgres-password: "{{ .postgresPassword }}"
  data:
    - secretKey: secretKey
      remoteRef: {key: authentik/config, property: secret-key}
    - secretKey: postgresPassword
      remoteRef: {key: authentik/config, property: postgres-password}
    - secretKey: bootstrapPassword
      remoteRef: {key: authentik/config, property: bootstrap-password}
    - secretKey: bootstrapToken
      remoteRef: {key: authentik/config, property: bootstrap-token}
    - secretKey: argocdClientId
      remoteRef: {key: authentik/config, property: argocd-client-id}
    - secretKey: argocdClientSecret
      remoteRef: {key: authentik/config, property: argocd-client-secret}
    - secretKey: grafanaClientId
      remoteRef: {key: authentik/config, property: grafana-client-id}
    - secretKey: grafanaClientSecret
      remoteRef: {key: authentik/config, property: grafana-client-secret}
    # A different path: see the note at the top of this file.
    - secretKey: nextcloudClientId
      remoteRef: {key: nextcloud/config, property: oidc-client-id}
    - secretKey: nextcloudClientSecret
      remoteRef: {key: nextcloud/config, property: oidc-client-secret}
