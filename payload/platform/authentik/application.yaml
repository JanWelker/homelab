---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  labels:
    homelab.wlkr.ch/stage: 08-services
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://auth.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.3
      helm:
        valuesObject:
          global:
            envFrom:
              # From secrets.yaml; the blueprints read it via !Env.
              - secretRef:
                  name: authentik-secrets

          authentik:
            log_level: info

            web:
              base_url: https://auth.infra.k8s.wlkr.ch
            error_reporting:
              enabled: false
            postgresql:
              host: authentik-postgresql
              name: authentik
              user: authentik

          blueprints:
            configMaps:
              - authentik-blueprints

          server:
            replicas: 2
            # Both switches needed: serviceMonitor alone renders nothing.
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

          worker:
            replicas: 1

            # Bump this whenever authentik-secrets gains a key.
            #
            # envFrom injects a Secret's contents as environment variables
            # once, when the pod starts. External Secrets updating that Secret
            # afterwards changes nothing a running worker can see -- so a
            # blueprint reading a newly added client credential through !Env
            # gets an empty string and quietly creates a provider that does not
            # work. That is not hypothetical: Nextcloud's first rollout missed
            # it by two seconds, and the resulting OIDC application answered
            # 404 on its discovery endpoint.
            #
            # Changing this annotation changes the pod template, so ArgoCD
            # restarts the worker as part of the same sync that adds the
            # credential. A `kubectl rollout restart` would do it too, and
            # would be undone by the next person who reads only the repository.
            podAnnotations:
              homelab.wlkr.ch/secret-generation: "2"
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

            # Blueprints owned by the workloads that need them, mounted beside
            # the platform's own. Not `blueprints.configMaps`: that renders a
            # plain configMap volume, which the kubelet refuses to mount until
            # the ConfigMap exists -- and these arrive with the workloads, in
            # 12-workloads, four stages after Authentik has to be Healthy. The
            # worker would be waiting for a stage that is waiting for the
            # worker.
            #
            # A projected volume takes `optional`, so the worker starts either
            # way and the blueprint appears when its workload lands.
            # blueprints_discovery runs on startup, hourly, and on a file
            # watcher, so nothing needs restarting to pick it up.
            #
            # One entry per workload, and only the mount: the provider itself
            # lives in the workloads repository, next to the application it
            # authenticates. The embedded outpost's provider list stays in
            # blueprints.yaml -- it replaces one global object, so two
            # repositories writing it would overwrite each other.
            volumes:
              - name: blueprints-workloads
                projected:
                  sources:
                    - configMap:
                        name: authentik-blueprint-nextcloud
                        optional: true
            volumeMounts:
              - name: blueprints-workloads
                mountPath: /blueprints/mounted/workloads
                readOnly: true

          postgresql:
            enabled: true
            image:
              # Same 17.11, Debian 13 base. The chart's own default is
              # -bookworm and nothing tracks it.
              # renovate: datasource=docker depName=docker.io/library/postgres versioning=docker
              tag: "17.11-trixie"
            auth:
              username: authentik
              database: authentik
              existingSecret: authentik-secrets
              secretKeys:
                userPasswordKey: postgres-password
            primary:
              persistence:
                enabled: true
                storageClass: rook-ceph-block
                size: 8Gi
              resources:
                requests:
                  cpu: 50m
                  memory: 320Mi
                limits:
                  memory: 704Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/authentik
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
