---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  labels:
    homelab.wlkr.ch/stage: 08-services
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://auth.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.3
      helm:
        valuesObject:
          global:
            envFrom:
              # From secrets.yaml; the blueprints read it via !Env.
              - secretRef:
                  name: authentik-secrets

          authentik:
            log_level: info

            web:
              base_url: https://auth.infra.k8s.wlkr.ch
            error_reporting:
              enabled: false
            postgresql:
              host: authentik-postgresql
              name: authentik
              user: authentik

          blueprints:
            configMaps:
              - authentik-blueprints

          server:
            replicas: 2
            # Both switches needed: serviceMonitor alone renders nothing.
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

          worker:
            replicas: 1
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

          postgresql:
            enabled: true
            auth:
              username: authentik
              database: authentik
              existingSecret: authentik-secrets
              secretKeys:
                userPasswordKey: postgres-password
            primary:
              persistence:
                enabled: true
                storageClass: rook-ceph-block
                size: 8Gi
              resources:
                requests:
                  cpu: 50m
                  memory: 320Mi
                limits:
                  memory: 704Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/authentik
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
