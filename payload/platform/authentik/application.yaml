---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://auth.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.3
      helm:
        valuesObject:
          global:
            envFrom:
              # From secrets.yaml; the blueprints read it via !Env.
              - secretRef:
                  name: authentik-secrets
              # From secrets-nextcloud.yaml; optional so a cluster without Nextcloud starts.
              - secretRef:
                  name: authentik-secrets-nextcloud
                  optional: true
            # No read-only root: the image writes under /media and /templates at start.
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

          authentik:
            log_level: info

            web:
              base_url: https://auth.k8s.wlkr.ch
            # No phone-home.
            error_reporting:
              enabled: false
            disable_update_check: true
            avatars: initials
            postgresql:
              host: authentik-postgresql
              name: authentik
              user: authentik

          blueprints:
            configMaps:
              - authentik-blueprints

          server:
            replicas: 2
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            # Both switches needed: serviceMonitor alone renders nothing.
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

          worker:
            replicas: 1
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

            # Bump when authentik-secrets gains a key; see docs/platform/authentik.md#pitfalls
            podAnnotations:
              homelab.wlkr.ch/secret-generation: "2"
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

            # One optional source per workload; see docs/platform/authentik.md#chart-values
            volumes:
              - name: blueprints-workloads
                projected:
                  sources:
                    - configMap:
                        name: authentik-blueprint-nextcloud
                        optional: true
            volumeMounts:
              - name: blueprints-workloads
                mountPath: /blueprints/mounted/workloads
                readOnly: true

          postgresql:
            enabled: true
            # Would union with the Cilium policy and allow every egress.
            networkPolicy:
              enabled: false
            image:
              # The chart's -bookworm default is tracked by nothing.
              # renovate: datasource=docker depName=docker.io/library/postgres versioning=docker
              tag: "17.11-trixie"
            auth:
              username: authentik
              database: authentik
              existingSecret: authentik-secrets
              secretKeys:
                userPasswordKey: postgres-password
            primary:
              persistence:
                enabled: true
                storageClass: rook-ceph-block
                size: 8Gi
              resources:
                requests:
                  cpu: 50m
                  memory: 320Mi
                limits:
                  memory: 704Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/authentik
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
