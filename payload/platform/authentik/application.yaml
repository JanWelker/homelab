---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://auth.infra.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.3
      helm:
        valuesObject:
          global:
            envFrom:
              # From secrets.yaml; the blueprints read it via !Env.
              - secretRef:
                  name: authentik-secrets
              # From secrets-nextcloud.yaml. Optional: without it the pods
              # would refuse to start on a cluster that has no Nextcloud.
              - secretRef:
                  name: authentik-secrets-nextcloud
                  optional: true
            # Pod-level for server and worker. The image runs as uid 1000 and
            # binds unprivileged ports; the per-deployment container contexts
            # below drop the rest. Read-only root is not attempted: the image
            # writes under /media and /templates at start.
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

          authentik:
            log_level: info

            web:
              base_url: https://auth.infra.k8s.wlkr.ch
            # No phone-home: the update check and Gravatar lookups are config
            # switches, not network-policy allowances.
            error_reporting:
              enabled: false
            disable_update_check: true
            avatars: initials
            postgresql:
              host: authentik-postgresql
              name: authentik
              user: authentik

          blueprints:
            configMaps:
              - authentik-blueprints

          server:
            replicas: 2
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            # Both switches needed: serviceMonitor alone renders nothing.
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

          worker:
            replicas: 1
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

            # Bump whenever authentik-secrets gains a key: envFrom is read once
            # at pod start, see docs/platform/authentik.md#pitfalls
            podAnnotations:
              homelab.wlkr.ch/secret-generation: "2"
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

            # Workload blueprints, one optional source per workload; not
            # `blueprints.configMaps`, see docs/platform/authentik.md#chart-values
            volumes:
              - name: blueprints-workloads
                projected:
                  sources:
                    - configMap:
                        name: authentik-blueprint-nextcloud
                        optional: true
            volumeMounts:
              - name: blueprints-workloads
                mountPath: /blueprints/mounted/workloads
                readOnly: true

          postgresql:
            enabled: true
            # The subchart's NetworkPolicy allows the database every egress,
            # and Cilium unions it with the policy in
            # payload/platform/security/network-policies/authentik.yaml.
            networkPolicy:
              enabled: false
            image:
              # Same 17.11, Debian 13 base. The chart's own default is
              # -bookworm and nothing tracks it.
              # renovate: datasource=docker depName=docker.io/library/postgres versioning=docker
              tag: "17.11-trixie"
            auth:
              username: authentik
              database: authentik
              existingSecret: authentik-secrets
              secretKeys:
                userPasswordKey: postgres-password
            primary:
              persistence:
                enabled: true
                storageClass: rook-ceph-block
                size: 8Gi
              resources:
                requests:
                  cpu: 50m
                  memory: 320Mi
                limits:
                  memory: 704Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/authentik
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
