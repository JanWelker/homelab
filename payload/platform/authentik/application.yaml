---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    link.argocd.argoproj.io/external-link: https://auth.k8s.wlkr.ch
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.3
      helm:
        valuesObject:
          global:
            envFrom:
              # From secrets.yaml; the blueprints read it via !Env.
              - secretRef:
                  name: authentik-secrets
              # From secrets-nextcloud.yaml; optional so a cluster without Nextcloud starts.
              - secretRef:
                  name: authentik-secrets-nextcloud
                  optional: true
              # From secrets-dependency-track.yaml; optional for the same reason.
              - secretRef:
                  name: authentik-secrets-dependency-track
                  optional: true
              # From secrets-open-webui.yaml; optional for the same reason.
              - secretRef:
                  name: authentik-secrets-open-webui
                  optional: true
              # From secrets-paperless-ngx.yaml; optional for the same reason.
              - secretRef:
                  name: authentik-secrets-paperless-ngx
                  optional: true
            # CloudNativePG generates the database password; nothing copies it.
            env:
              - name: AUTHENTIK_POSTGRESQL__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: authentik-db-app
                    key: password
            # No read-only root: the image writes under /media and /templates at start.
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault

          authentik:
            log_level: info

            web:
              base_url: https://auth.k8s.wlkr.ch
            # No phone-home.
            error_reporting:
              enabled: false
            disable_update_check: true
            disable_startup_analytics: true
            avatars: initials
            postgresql:
              host: authentik-db-rw
              name: authentik
              user: authentik

          blueprints:
            configMaps:
              - authentik-blueprints

          server:
            replicas: 2
            # The chart's anti-affinity is a preference the scheduler outweighs
            # on unequal nodes; see docs/platform/authentik.md#database
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                nodeTaintsPolicy: Honor
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: authentik
                    app.kubernetes.io/instance: authentik
                    app.kubernetes.io/component: server
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            # Both switches needed: serviceMonitor alone renders nothing.
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

          worker:
            replicas: 1
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

            # Bump when authentik-secrets gains a key; see docs/platform/authentik.md#pitfalls
            podAnnotations:
              homelab.wlkr.ch/secret-generation: "3"
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

            # One optional source per workload; see docs/platform/authentik.md#chart-values
            volumes:
              - name: blueprints-workloads
                projected:
                  sources:
                    - configMap:
                        name: authentik-blueprint-nextcloud
                        optional: true
                    - configMap:
                        name: authentik-blueprint-dependency-track
                        optional: true
                    - configMap:
                        name: authentik-blueprint-open-webui
                        optional: true
                    - configMap:
                        name: authentik-blueprint-paperless-ngx
                        optional: true
            volumeMounts:
              - name: blueprints-workloads
                mountPath: /blueprints/mounted/workloads
                readOnly: true

          # The database is database.yaml; see docs/platform/cloudnative-pg.md#the-contract
          postgresql:
            enabled: false
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/authentik
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
