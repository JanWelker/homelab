---
# Routes that may reach the outpost; keep it this narrow. See
# docs/development/add-workload.md#putting-a-workload-behind-authentik
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-dashboard-routes
  namespace: authentik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: rook-ceph
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: home-assistant
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: flowscape
  to:
    - group: ""
      kind: Service
      name: authentik-server
