---
# Lets the Hubble and Rook routes reach the outpost; keep it this narrow.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-dashboard-routes
  namespace: authentik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: rook-ceph
  to:
    - group: ""
      kind: Service
      name: authentik-server
