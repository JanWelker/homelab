---
# Lets the Hubble, Rook, Prometheus, Alertmanager and Home Assistant routes
# reach the outpost; keep it this narrow. Home Assistant's route is in the workloads repository, which is
# the one place a workload needs something from this one -- see
# docs/development/add-workload.md#putting-a-workload-behind-authentik
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-dashboard-routes
  namespace: authentik
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: rook-ceph
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: home-assistant
  to:
    - group: ""
      kind: Service
      name: authentik-server
