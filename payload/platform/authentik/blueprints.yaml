---
# Authentik blueprints; see docs/platform/authentik.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  # Usernames are fixed; see docs/platform/authentik.md#user-settings-flow
  05-user-settings.yaml: |
    version: 1
    metadata:
      name: homelab-user-settings
    entries:
      # The default brand must exist before it can point at this flow.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Brand
          required: false
      - model: authentik_flows.flow
        state: present
        id: user-settings-flow
        identifiers:
          slug: homelab-user-settings
        attrs:
          name: User settings
          title: Update your info
          designation: stage_configuration
          authentication: require_authenticated
      # No username field, so the write stage has no username to write.
      - model: authentik_stages_prompt.prompt
        state: present
        id: user-settings-field-name
        identifiers:
          name: homelab-user-settings-field-name
        attrs:
          order: 201
          field_key: name
          label: Name
          type: text
          required: true
          placeholder: Name
          initial_value: |
            try:
                return user.name
            except:
                return ''
          initial_value_expression: true
      - model: authentik_stages_prompt.prompt
        state: present
        id: user-settings-field-email
        identifiers:
          name: homelab-user-settings-field-email
        attrs:
          order: 202
          field_key: email
          label: Email
          type: email
          required: true
          placeholder: Email
          initial_value: |
            try:
                return user.email
            except:
                return ''
          initial_value_expression: true
      - model: authentik_stages_prompt.prompt
        state: present
        id: user-settings-field-locale
        identifiers:
          name: homelab-user-settings-field-locale
        attrs:
          order: 203
          field_key: attributes.settings.locale
          label: Locale
          type: ak-locale
          required: true
          placeholder: Locale
          initial_value: |
            try:
                return user.attributes.get("settings", {}).get("locale", "")
            except:
                return ''
          initial_value_expression: true
      # The default flow's name and e-mail checks, without the username one.
      - model: authentik_policies_expression.expressionpolicy
        state: present
        id: user-settings-authorization
        identifiers:
          name: homelab-user-settings-authorization
        attrs:
          expression: |
            from authentik.core.models import (
                USER_ATTRIBUTE_CHANGE_EMAIL,
                USER_ATTRIBUTE_CHANGE_NAME,
            )
            prompt_data = request.context.get("prompt_data")
            attributes = request.user.group_attributes(request.http_request)
            tenant = request.http_request.tenant

            if not attributes.get(USER_ATTRIBUTE_CHANGE_EMAIL, tenant.default_user_change_email):
                if prompt_data.get("email") != request.user.email:
                    ak_message("Not allowed to change email address.")
                    return False

            if not attributes.get(USER_ATTRIBUTE_CHANGE_NAME, tenant.default_user_change_name):
                if prompt_data.get("name") != request.user.name:
                    ak_message("Not allowed to change name.")
                    return False

            return True
      - model: authentik_stages_prompt.promptstage
        state: present
        id: user-settings-prompt
        identifiers:
          name: homelab-user-settings
        attrs:
          fields:
            - !KeyOf user-settings-field-name
            - !KeyOf user-settings-field-email
            - !KeyOf user-settings-field-locale
          validation_policies:
            - !KeyOf user-settings-authorization
      - model: authentik_stages_user_write.userwritestage
        state: present
        id: user-settings-write
        identifiers:
          name: homelab-user-settings-write
        attrs:
          user_creation_mode: never_create
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf user-settings-flow
          stage: !KeyOf user-settings-prompt
          order: 20
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf user-settings-flow
          stage: !KeyOf user-settings-write
          order: 100
      - model: authentik_brands.brand
        state: present
        identifiers:
          default: true
        attrs:
          flow_user_settings: !KeyOf user-settings-flow

  10-oidc-argocd.yaml: |
    version: 1
    metadata:
      name: homelab-argocd
    entries:
      # Every file declares the group it binds, so none waits on another; see
      # docs/platform/authentik.md#groups-and-roles
      - model: authentik_core.group
        state: present
        id: infra-users
        identifiers:
          name: infra-users
      - model: authentik_core.group
        state: present
        id: argocd-admins
        identifiers:
          name: argocd-admins
        attrs:
          parents:
            - !KeyOf infra-users
      - model: authentik_core.group
        state: present
        id: argocd-viewers
        identifiers:
          name: argocd-viewers
        attrs:
          parents:
            - !KeyOf infra-users
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Required: an empty list serves no grants and rejects every login.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env ARGOCD_CLIENT_ID
          client_secret: !Env ARGOCD_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argo.infra.k8s.wlkr.ch/auth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        id: argocd-application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          meta_launch_url: https://argo.infra.k8s.wlkr.ch
          meta_description: GitOps controller
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf argocd-application
          group: !KeyOf infra-users
        attrs:
          order: 0

  11-oidc-grafana.yaml: |
    version: 1
    metadata:
      name: homelab-grafana
    entries:
      # Every file declares the group it binds, so none waits on another; see
      # docs/platform/authentik.md#groups-and-roles
      - model: authentik_core.group
        state: present
        id: infra-users
        identifiers:
          name: infra-users
      - model: authentik_core.group
        state: present
        id: grafana-admins
        identifiers:
          name: grafana-admins
        attrs:
          parents:
            - !KeyOf infra-users
      - model: authentik_core.group
        state: present
        id: grafana-editors
        identifiers:
          name: grafana-editors
        attrs:
          parents:
            - !KeyOf infra-users
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Required; see the ArgoCD provider above.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env GRAFANA_CLIENT_ID
          client_secret: !Env GRAFANA_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://monitoring.infra.k8s.wlkr.ch/login/generic_oauth
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        id: grafana-application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://monitoring.infra.k8s.wlkr.ch
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf grafana-application
          group: !KeyOf infra-users
        attrs:
          order: 0

  20-proxy-providers.yaml: |
    version: 1
    metadata:
      name: homelab-proxied-dashboards
    entries:
      # Every file declares the group it binds, so none waits on another; see
      # docs/platform/authentik.md#groups-and-roles
      - model: authentik_core.group
        state: present
        id: infra-users
        identifiers:
          name: infra-users
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: hubble-provider
        identifiers:
          name: hubble
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://hubble.infra.k8s.wlkr.ch
          internal_host: http://hubble-ui.kube-system.svc.cluster.local:80
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        id: hubble-application
        identifiers:
          slug: hubble
        attrs:
          name: Hubble
          provider: !KeyOf hubble-provider
          meta_launch_url: https://hubble.infra.k8s.wlkr.ch
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf hubble-application
          group: !KeyOf infra-users
        attrs:
          order: 0

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: rook-provider
        identifiers:
          name: rook
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://rook.infra.k8s.wlkr.ch
          internal_host: http://rook-ceph-mgr-dashboard.rook-ceph.svc.cluster.local:7000
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        id: rook-application
        identifiers:
          slug: rook
        attrs:
          name: Ceph Dashboard
          provider: !KeyOf rook-provider
          meta_launch_url: https://rook.infra.k8s.wlkr.ch
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf rook-application
          group: !KeyOf infra-users
        attrs:
          order: 0

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: prometheus-provider
        identifiers:
          name: prometheus
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://prometheus.infra.k8s.wlkr.ch
          internal_host: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        id: prometheus-application
        identifiers:
          slug: prometheus
        attrs:
          name: Prometheus
          provider: !KeyOf prometheus-provider
          meta_launch_url: https://prometheus.infra.k8s.wlkr.ch
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf prometheus-application
          group: !KeyOf infra-users
        attrs:
          order: 0

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: alertmanager-provider
        identifiers:
          name: alertmanager
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://alertmanager.infra.k8s.wlkr.ch
          internal_host: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        id: alertmanager-application
        identifiers:
          slug: alertmanager
        attrs:
          name: Alertmanager
          provider: !KeyOf alertmanager-provider
          meta_launch_url: https://alertmanager.infra.k8s.wlkr.ch
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf alertmanager-application
          group: !KeyOf infra-users
        attrs:
          order: 0

      # Sits in front of Home Assistant's own login; see docs/platform/authentik.md#pitfalls
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: home-assistant-provider
        identifiers:
          name: home-assistant
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://home.k8s.wlkr.ch
          internal_host: http://home-assistant.home-assistant.svc.cluster.local:8123
          internal_host_ssl_validation: false
          # The companion apps and webhooks hold a long-lived token and cannot log in interactively.
          skip_path_regex: |-
            ^/api/.*
            ^/auth/token$
            ^/auth/external/callback$
      - model: authentik_core.application
        state: present
        identifiers:
          slug: home-assistant
        attrs:
          name: Home Assistant
          provider: !KeyOf home-assistant-provider
          meta_launch_url: https://home.k8s.wlkr.ch
          meta_description: Home automation

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: flowscape-provider
        identifiers:
          name: flowscape
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://flowscape.k8s.wlkr.ch
          internal_host: http://flowscape.flowscape.svc.cluster.local:80
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        id: flowscape-application
        identifiers:
          slug: flowscape
        attrs:
          name: Flowscape
          provider: !KeyOf flowscape-provider
          meta_launch_url: https://flowscape.k8s.wlkr.ch
          meta_description: Cluster network traffic in 3D
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf flowscape-application
          group: !KeyOf infra-users
        attrs:
          order: 0

      # The tracker and its collect endpoint are what every visitor of every site loads,
      # so those two paths pass unauthenticated; the dashboard does not.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: umami-provider
        identifiers:
          name: umami
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://analytics.k8s.wlkr.ch
          internal_host: http://umami.umami.svc.cluster.local:3000
          internal_host_ssl_validation: false
          skip_path_regex: |-
            ^/script\.js$
            ^/api/send$
      - model: authentik_core.application
        state: present
        identifiers:
          slug: umami
        attrs:
          name: Umami
          provider: !KeyOf umami-provider
          meta_launch_url: https://analytics.k8s.wlkr.ch
          meta_description: Web analytics

      # /admin only: the HTTPRoute sends nothing else here, because the site
      # itself is an invitation to the neighbours.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: fest-wollbi-provider
        identifiers:
          name: fest-wollbi
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://fest.wollbi.ch
          internal_host: http://fest-wollbi.fest-wollbi.svc.cluster.local:3000
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: fest-wollbi
        attrs:
          name: Wollbi-Fescht
          provider: !KeyOf fest-wollbi-provider
          meta_launch_url: https://fest.wollbi.ch
          meta_description: The street's summer party, since 1987

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: advent-wollbi-provider
        identifiers:
          name: advent-wollbi
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://advent.wollbi.ch
          internal_host: http://advent-wollbi.advent-wollbi.svc.cluster.local:3000
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: advent-wollbi
        attrs:
          name: Wollbi Adventsfenster
          provider: !KeyOf advent-wollbi-provider
          meta_launch_url: https://advent.wollbi.ch
          meta_description: The street's advent windows

      # Read-only shot diagnostics; the app has no login, so the outpost is the only guard.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: extractor-admin-provider
        identifiers:
          name: extractor-admin
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://extractor-admin.k8s.wlkr.ch
          internal_host: http://extractor-admin.extractor-admin.svc.cluster.local:80
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        id: extractor-admin-application
        identifiers:
          slug: extractor-admin
        attrs:
          name: Extractor admin
          provider: !KeyOf extractor-admin-provider
          meta_launch_url: https://extractor-admin.k8s.wlkr.ch
          meta_description: Espresso shot diagnostics
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf extractor-admin-application
          group: !KeyOf infra-users
        attrs:
          order: 0

      # Replaces the provider list: every proxied application must be here.
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          # Where the browser is sent to log in; see docs/platform/authentik.md#one-hostname
          config:
            authentik_host: https://auth.k8s.wlkr.ch
          providers:
            - !KeyOf hubble-provider
            - !KeyOf rook-provider
            - !KeyOf prometheus-provider
            - !KeyOf alertmanager-provider
            - !KeyOf home-assistant-provider
            - !KeyOf flowscape-provider
            - !KeyOf umami-provider
            - !KeyOf fest-wollbi-provider
            - !KeyOf advent-wollbi-provider
            - !KeyOf extractor-admin-provider
