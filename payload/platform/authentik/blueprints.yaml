---
# Authentik blueprints; see docs/platform/authentik.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  10-oidc-argocd.yaml: |
    version: 1
    metadata:
      name: homelab-argocd
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Required: an empty list serves no grants and rejects every login.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env ARGOCD_CLIENT_ID
          client_secret: !Env ARGOCD_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argo.infra.k8s.wlkr.ch/auth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          meta_launch_url: https://argo.infra.k8s.wlkr.ch
          meta_description: GitOps controller

  11-oidc-grafana.yaml: |
    version: 1
    metadata:
      name: homelab-grafana
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Required; see the ArgoCD provider above.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env GRAFANA_CLIENT_ID
          client_secret: !Env GRAFANA_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://monitoring.infra.k8s.wlkr.ch/login/generic_oauth
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://monitoring.infra.k8s.wlkr.ch

  20-proxy-providers.yaml: |
    version: 1
    metadata:
      name: homelab-proxied-dashboards
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: hubble-provider
        identifiers:
          name: hubble
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://hubble.infra.k8s.wlkr.ch
          internal_host: http://hubble-ui.kube-system.svc.cluster.local:80
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: hubble
        attrs:
          name: Hubble
          provider: !KeyOf hubble-provider
          meta_launch_url: https://hubble.infra.k8s.wlkr.ch

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: rook-provider
        identifiers:
          name: rook
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://rook.infra.k8s.wlkr.ch
          internal_host: http://rook-ceph-mgr-dashboard.rook-ceph.svc.cluster.local:7000
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: rook
        attrs:
          name: Ceph Dashboard
          provider: !KeyOf rook-provider
          meta_launch_url: https://rook.infra.k8s.wlkr.ch

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: prometheus-provider
        identifiers:
          name: prometheus
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://prometheus.infra.k8s.wlkr.ch
          internal_host: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: prometheus
        attrs:
          name: Prometheus
          provider: !KeyOf prometheus-provider
          meta_launch_url: https://prometheus.infra.k8s.wlkr.ch

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: alertmanager-provider
        identifiers:
          name: alertmanager
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://alertmanager.infra.k8s.wlkr.ch
          internal_host: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: alertmanager
        attrs:
          name: Alertmanager
          provider: !KeyOf alertmanager-provider
          meta_launch_url: https://alertmanager.infra.k8s.wlkr.ch

      # Sits in front of Home Assistant's own login; see docs/platform/authentik.md#pitfalls
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: home-assistant-provider
        identifiers:
          name: home-assistant
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://home.k8s.wlkr.ch
          internal_host: http://home-assistant.home-assistant.svc.cluster.local:8123
          internal_host_ssl_validation: false
          # The companion apps and webhooks hold a long-lived token and cannot log in interactively.
          skip_path_regex: |-
            ^/api/.*
            ^/auth/token$
            ^/auth/external/callback$
      - model: authentik_core.application
        state: present
        identifiers:
          slug: home-assistant
        attrs:
          name: Home Assistant
          provider: !KeyOf home-assistant-provider
          meta_launch_url: https://home.k8s.wlkr.ch
          meta_description: Home automation

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: flowscape-provider
        identifiers:
          name: flowscape
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://flowscape.k8s.wlkr.ch
          internal_host: http://flowscape.flowscape.svc.cluster.local:80
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: flowscape
        attrs:
          name: Flowscape
          provider: !KeyOf flowscape-provider
          meta_launch_url: https://flowscape.k8s.wlkr.ch
          meta_description: Cluster network traffic in 3D

      # The tracker and its collect endpoint are what every visitor of every site loads,
      # so those two paths pass unauthenticated; the dashboard does not.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: umami-provider
        identifiers:
          name: umami
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://analytics.k8s.wlkr.ch
          internal_host: http://umami.umami.svc.cluster.local:3000
          internal_host_ssl_validation: false
          skip_path_regex: |-
            ^/script\.js$
            ^/api/send$
      - model: authentik_core.application
        state: present
        identifiers:
          slug: umami
        attrs:
          name: Umami
          provider: !KeyOf umami-provider
          meta_launch_url: https://analytics.k8s.wlkr.ch
          meta_description: Web analytics

      # /admin only: the HTTPRoute sends nothing else here, because the site
      # itself is an invitation to the neighbours.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: fest-wollbi-provider
        identifiers:
          name: fest-wollbi
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://fest.wollbi.ch
          internal_host: http://fest-wollbi.fest-wollbi.svc.cluster.local:3000
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: fest-wollbi
        attrs:
          name: Wollbi-Fescht
          provider: !KeyOf fest-wollbi-provider
          meta_launch_url: https://fest.wollbi.ch
          meta_description: The street's summer party, since 1987

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: advent-wollbi-provider
        identifiers:
          name: advent-wollbi
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://advent.wollbi.ch
          internal_host: http://advent-wollbi.advent-wollbi.svc.cluster.local:3000
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: advent-wollbi
        attrs:
          name: Wollbi Adventsfenster
          provider: !KeyOf advent-wollbi-provider
          meta_launch_url: https://advent.wollbi.ch
          meta_description: The street's advent windows

      # Browsers only: the native clients speak the API directly and have
      # nowhere to complete a login. See homelab-apps/docs/jellyfin.md#pitfalls
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: jellyfin-provider
        identifiers:
          name: jellyfin
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://media.k8s.wlkr.ch
          internal_host: http://jellyfin.jellyfin.svc.cluster.local:8096
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: jellyfin
        attrs:
          name: Jellyfin
          provider: !KeyOf jellyfin-provider
          meta_launch_url: https://media.k8s.wlkr.ch
          meta_description: The household's own films and music

      # In front of the gateway's own shared-secret token, not instead of
      # it: the control UI drives an agent that can run tools.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: openclaw-provider
        identifiers:
          name: openclaw
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://claw.k8s.wlkr.ch
          internal_host: http://openclaw.openclaw.svc.cluster.local:18789
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: openclaw
        attrs:
          name: OpenClaw
          provider: !KeyOf openclaw-provider
          meta_launch_url: https://claw.k8s.wlkr.ch
          meta_description: The self-hosted assistant gateway

      # Replaces the provider list: every proxied application must be here.
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          # Where the browser is sent to log in; see docs/platform/authentik.md#one-hostname
          config:
            authentik_host: https://auth.k8s.wlkr.ch
          providers:
            - !KeyOf hubble-provider
            - !KeyOf rook-provider
            - !KeyOf prometheus-provider
            - !KeyOf alertmanager-provider
            - !KeyOf home-assistant-provider
            - !KeyOf flowscape-provider
            - !KeyOf umami-provider
            - !KeyOf fest-wollbi-provider
            - !KeyOf openclaw-provider
            - !KeyOf jellyfin-provider
            - !KeyOf advent-wollbi-provider
