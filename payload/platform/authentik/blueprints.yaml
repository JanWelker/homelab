---
# Authentik configuration as code. The worker discovers every `.yaml` key in
# this ConfigMap and applies it, so providers and applications are declared
# here rather than clicked together in the UI and lost on the next rebuild.
#
# `!Find` resolves objects authentik ships by default; `!KeyOf` references an
# entry by its `id` earlier in the same blueprint; `!Env` reads a variable from
# the authentik-secrets Secret mounted on the pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  10-oidc-argocd.yaml: |
    version: 1
    metadata:
      name: homelab-argocd
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env ARGOCD_CLIENT_ID
          client_secret: !Env ARGOCD_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argo.infra.k8s.wlkr.ch/auth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          meta_launch_url: https://argo.infra.k8s.wlkr.ch
          meta_description: GitOps controller

  11-oidc-grafana.yaml: |
    version: 1
    metadata:
      name: homelab-grafana
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        id: grafana-provider
        identifiers:
          name: grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env GRAFANA_CLIENT_ID
          client_secret: !Env GRAFANA_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://monitoring.infra.k8s.wlkr.ch/login/generic_oauth
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: https://monitoring.infra.k8s.wlkr.ch

  20-proxy-providers.yaml: |
    version: 1
    metadata:
      name: homelab-proxied-dashboards
    entries:
      # These four have no usable authentication of their own. Hubble has none
      # at all, and published cluster-wide network flow data to anyone who
      # could reach the hostname. Prometheus and Alertmanager have none either,
      # which is why they were not exposed before this.
      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: hubble-provider
        identifiers:
          name: hubble
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://hubble.infra.k8s.wlkr.ch
          internal_host: http://hubble-ui.kube-system.svc.cluster.local:80
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: hubble
        attrs:
          name: Hubble
          provider: !KeyOf hubble-provider
          meta_launch_url: https://hubble.infra.k8s.wlkr.ch

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: rook-provider
        identifiers:
          name: rook
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://rook.infra.k8s.wlkr.ch
          internal_host: http://rook-ceph-mgr-dashboard.rook-ceph.svc.cluster.local:7000
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: rook
        attrs:
          name: Ceph Dashboard
          provider: !KeyOf rook-provider
          meta_launch_url: https://rook.infra.k8s.wlkr.ch

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: prometheus-provider
        identifiers:
          name: prometheus
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://prometheus.infra.k8s.wlkr.ch
          internal_host: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: prometheus
        attrs:
          name: Prometheus
          provider: !KeyOf prometheus-provider
          meta_launch_url: https://prometheus.infra.k8s.wlkr.ch

      - model: authentik_providers_proxy.proxyprovider
        state: present
        id: alertmanager-provider
        identifiers:
          name: alertmanager
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: proxy
          external_host: https://alertmanager.infra.k8s.wlkr.ch
          internal_host: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
          internal_host_ssl_validation: false
      - model: authentik_core.application
        state: present
        identifiers:
          slug: alertmanager
        attrs:
          name: Alertmanager
          provider: !KeyOf alertmanager-provider
          meta_launch_url: https://alertmanager.infra.k8s.wlkr.ch

      # Assigning the providers to the built-in outpost is what actually makes
      # it serve those hostnames. This replaces the outpost's provider list
      # rather than adding to it, so every proxied application must be listed.
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          providers:
            - !KeyOf hubble-provider
            - !KeyOf rook-provider
            - !KeyOf prometheus-provider
            - !KeyOf alertmanager-provider
