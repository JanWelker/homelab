---
# Separate from authentik-secrets on purpose; see docs/platform/authentik.md#client-secrets
# A public client: the frontend authenticates with PKCE, so there is no secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets-dependency-track
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authentik-secrets-dependency-track
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DEPENDENCY_TRACK_CLIENT_ID: "{{ .dependencyTrackClientId }}"
  data:
    - secretKey: dependencyTrackClientId
      remoteRef: {key: dependency-track/config, property: oidc-client-id}
