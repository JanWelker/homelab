---
# Ours, not the operator's deprecated enablePodMonitor; docs/platform/cloudnative-pg.md#the-contract
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: authentik-db-metrics
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: authentik-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
