---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    # Why each value is what it is: docs/platform/github-runners.md#configuration
    # One chart source per scale set; each registers on one repository.
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      # Same version as the arc-controller chart.
      targetRevision: 0.15.1
      helm:
        releaseName: shotapp
        valuesObject:
          githubConfigUrl: https://github.com/somuch-cloud/extractor.cafe
          githubConfigSecret: github-app
          runnerScaleSetName: homelab

          minRunners: 0
          maxRunners: 10

          controllerServiceAccount:
            namespace: arc-systems
            name: arc-controller-gha-rs-controller

          containerMode:
            type: kubernetes-novolume

          listenerTemplate:
            spec:
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: listener
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]

          template:
            spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: runner
                  image: ghcr.io/actions/actions-runner:2.338.1@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690
                  command: ["/home/runner/run.sh"]
                  env:
                    - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                      value: "false"
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      memory: 4Gi
    # ci-ok's wait only: it holds a runner until every other check finished,
    # so on the shared set enough open pull requests deadlock it.
    # docs/platform/github-runners.md#configuration
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      # Same version as the arc-controller chart.
      targetRevision: 0.15.1
      helm:
        releaseName: shotapp-wait
        valuesObject:
          githubConfigUrl: https://github.com/somuch-cloud/extractor.cafe
          githubConfigSecret: github-app
          runnerScaleSetName: homelab-wait

          minRunners: 0
          maxRunners: 10

          controllerServiceAccount:
            namespace: arc-systems
            name: arc-controller-gha-rs-controller

          listenerTemplate:
            spec:
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: listener
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]

          template:
            spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: runner
                  image: ghcr.io/actions/actions-runner:2.338.1@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690
                  command: ["/home/runner/run.sh"]
                  resources:
                    requests:
                      cpu: 10m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/arc-runners
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - ServerSideApply=true
