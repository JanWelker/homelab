---
# kv/arc-runners/github-app is written by `make bao-secrets`.
# docs/platform/github-runners.md#github-app
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: github-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github_app_id
      remoteRef: {key: arc-runners/github-app, property: app-id}
    - secretKey: github_app_installation_id
      remoteRef: {key: arc-runners/github-app, property: installation-id}
    - secretKey: github_app_private_key
      remoteRef: {key: arc-runners/github-app, property: private-key}
