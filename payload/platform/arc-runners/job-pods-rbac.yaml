---
# The homelab runners' ServiceAccount. Its only grant is what the container
# hook checks for, in arc-jobs, so a step can read neither the GitHub App key
# nor another runner's JIT config in arc-runners.
# See docs/platform/github-runners.md#job-pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-runner
  namespace: arc-runners
---
# runner-container-hooks' requiredPermissions; the hook refuses to run if any
# verb is missing.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homelab-runner
  namespace: arc-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homelab-runner
  namespace: arc-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homelab-runner
subjects:
  - kind: ServiceAccount
    name: homelab-runner
    namespace: arc-runners
