---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-operator
  namespace: argocd
  labels:
    homelab.wlkr.ch/stage: 03-controllers
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph
    targetRevision: v1.20.7
    helm:
      valuesObject:
        monitoring:
          enabled: true
        # Since v1.20 only the image set is read from `csi`; the rest is
        # ignored, use csi-driver.yaml. Pinned ahead of the chart until Rook
        # ships ceph-csi-operator >= v1.0.5. See docs/platform/rook-ceph.md
        csi:
          provisioner:
            # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-provisioner versioning=docker
            tag: v6.3.0
          resizer:
            # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-resizer versioning=docker
            tag: v2.2.1
          snapshotter:
            # renovate: datasource=docker depName=registry.k8s.io/sig-storage/csi-snapshotter versioning=docker
            tag: v8.6.0
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
