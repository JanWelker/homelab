---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph
    targetRevision: v1.21.2
    helm:
      valuesObject:
        priorityClassName: system-cluster-critical
        monitoring:
          enabled: true
        # Rook's switch for SELinux hosts: the daemons keep their state on a
        # hostPath and use each other's admin sockets across pods; see
        # docs/platform/rook-ceph.md#configuration
        hostpathRequiresPrivileged: true
        # bucketPolicy lets the backup buckets grant the off-cluster reader,
        # bucketOwner gives it the offsite bucket, which the obc-bucket-owner
        # admission policy holds to; see docs/platform/rook-ceph.md#off-cluster-reader
        obcAllowAdditionalConfigFields: "maxObjects,maxSize,bucketPolicy,bucketOwner"
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
