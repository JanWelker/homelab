---
# The chart through Kustomize, which Argo CD's Helm source cannot post-render:
# see docs/platform/rook-ceph.md#csi-driver
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    version: v1.21.3
    releaseName: rook-ceph-operator
    namespace: rook-ceph
    includeCRDs: true
    # The values as written, over the chart's own, as Argo CD's Helm source
    # hands them over; the default merge drops a null.
    valuesMerge: replace
    valuesInline:
      priorityClassName: system-cluster-critical
      monitoring:
        enabled: true
      # Rook's switch for SELinux hosts: the daemons keep their state on a
      # hostPath and use each other's admin sockets across pods; see
      # docs/platform/rook-ceph.md#configuration
      hostpathRequiresPrivileged: true
      # bucketPolicy lets the backup buckets grant the off-cluster reader,
      # bucketOwner gives it the offsite bucket, which the obc-bucket-owner
      # admission policy holds to; see docs/platform/rook-ceph.md#off-cluster-reader
      obcAllowAdditionalConfigFields: "maxObjects,maxSize,bucketPolicy,bucketOwner"
      ceph-csi-operator:
        controllerManager:
          manager:
            resources:
              limits:
                # Unsets the chart's CPU limit; see docs/platform/index.md#components
                cpu: null
# The subchart's policy allows every egress, which Cilium would union with ours.
patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ceph-csi-ceph-csi-controller-manager
        namespace: rook-ceph
