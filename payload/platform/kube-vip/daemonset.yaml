---
# Replaces the bootstrap static pod; see docs/operations/control-plane-vip.md.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-vip
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # No surge: two kube-vips on one node fight over :2112 and the lease.
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
    spec:
      serviceAccountName: kube-vip
      hostNetwork: true
      priorityClassName: system-node-critical
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: pull
          # Pre-pulls the image before `adopt`; keep in step with the container.
          image: ghcr.io/kube-vip/kube-vip:v1.2.4@sha256:dde4c0669d9058c74c69c0bc2f0122e26900e1e4b913c03577cb6e4e28083079
          args:
            - version
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: adopt
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              manifest=/manifests/kube-vip.yaml
              if [ ! -e "$manifest" ]; then
                echo "no static kube-vip manifest, nothing to adopt"
                exit 0
              fi
              rm -f "$manifest"
              echo "removed $manifest, waiting for the static kube-vip to exit"
              i=0
              while netstat -ltn | grep -q ':2112 '; do
                i=$((i + 1))
                if [ "$i" -ge 120 ]; then
                  echo ":2112 still bound after 120s" >&2
                  exit 1
                fi
                sleep 1
              done
              echo "static kube-vip has exited"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Mount the directory: a bind-mounted single file cannot be removed.
            - name: static-manifests
              mountPath: /manifests
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.2.4@sha256:dde4c0669d9058c74c69c0bc2f0122e26900e1e4b913c03577cb6e4e28083079
          args:
            - manager
          env:
            # Keep in step with ansible/templates/butane_node_config.yaml.j2.
            - name: address
              value: "10.9.2.10"
            - name: port
              value: "6443"
            - name: vip_interface
              value: eno1
            - name: vip_subnet
              value: "32"
            - name: vip_arp
              value: "true"
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: kube-system
            - name: vip_leaderelection
              value: "true"
            # Must match the static pod's Lease and rbac.yaml.
            - name: vip_leasename
              value: plndr-cp-lock
            - name: vip_leaseduration
              value: "5"
            - name: vip_renewdeadline
              value: "3"
            - name: vip_retryperiod
              value: "1"
            # Cilium owns LoadBalancer services; kube-vip must not.
            - name: svc_enable
              value: "false"
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Local API server, not the ClusterIP, which needs Cilium first.
            - name: KUBERNETES_SERVICE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
          # Identical to the static pod; untested hardening drops the VIP.
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_TIME
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: static-manifests
          hostPath:
            path: /etc/kubernetes/manifests
            type: Directory
