---
# Leader election on one Lease only; upstream's broader RBAC is not needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-vip
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
rules:
  # `create` cannot be narrowed by resourceNames, hence the separate rule.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["plndr-cp-lock"]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-vip
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-vip
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
