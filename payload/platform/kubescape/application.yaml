---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubescape
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    # After kube-prometheus-stack (ServiceMonitor CRD) and Rook (PVC).
    argocd.argoproj.io/sync-wave: "2"
    # yamllint disable-line rule:line-length
    link.argocd.argoproj.io/external-link: https://monitoring.infra.k8s.wlkr.ch/d/kubescape-vuln-overview
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    - repoURL: https://kubescape.github.io/helm-charts
      chart: kubescape-operator
      targetRevision: 1.40.4
      helm:
        valuesObject:
          clusterName: homelab

          # Empty means every framework, CIS included. Do not pin a list.
          defaultFrameworks: []

          capabilities:
            operator: enable
            configurationScan: enable
            nodeScan: enable
            prometheusExporter: enable
            continuousScan: disable

            # relevancy needs the node-agent (runtimeObservability) below.
            vulnerabilityScan: enable
            relevancy: enable
            nodeSbomGeneration: enable
            scanEmbeddedSBOMs: disable
            vexGeneration: disable

            runtimeObservability: enable
            runtimeDetection: enable
            networkPolicyService: enable
            networkEventsStreaming: enable
            nodeProfileService: enable
            httpDetection: enable
            seccompProfileService: enable

            malwareDetection: disable

            # Off by design: an unhealthy webhook blocks API writes.
            admissionController: disable

            # Would grant patch on nodes cluster-wide.
            manageWorkloads: disable
            syncSBOM: disable
            # Upgrades its own Helm release, behind ArgoCD's back.
            autoUpgrading: disable

          persistence:
            storageClass: rook-ceph-block

          # Chart 1.40.4 ships v4.0.13, whose scheduled scans all fail.
          # Drop once the chart's default is newer; see kubescape.md.
          kubescape:
            image:
              # renovate: datasource=docker depName=quay.io/kubescape/kubescape
              tag: v4.0.14

          # No kubescape.serviceMonitor: its scrape runs a full scan (HTTP 500).
          nodeAgent:
            serviceMonitor:
              enabled: true
            # Starts the node-agent's /metrics listener; not capabilities.*.
            config:
              prometheusExporter: enable
            # Also scan control-plane nodes; see docs/platform/kubescape.md
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
          prometheusExporter:
            serviceMonitor:
              enabled: true
            # Per-workload series; the dashboard's tables are built on them.
            enableWorkloadMetrics: true
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/platform/kubescape
      directory:
        exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: kubescape
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
