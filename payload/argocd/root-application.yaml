---
# No prune and no finalizer, deliberately; see docs/architecture/gitops.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    # root and gitops manage each other; see docs/architecture/gitops.md
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  project: system
  source:
    repoURL: https://github.com/JanWelker/homelab.git
    targetRevision: HEAD
    path: payload
    directory:
      recurse: false
      include: "root.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
