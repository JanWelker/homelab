---
# One Application per payload/platform/*/application.yaml, plus the workloads
# handover; see docs/architecture/gitops.md
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
  annotations:
    # The diff preview renders the application.yaml files themselves.
    argocd-diff-preview/ignore: "true"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/JanWelker/homelab.git
        revision: HEAD
        requeueAfterSeconds: 60
        files:
          - path: payload/platform/*/application.yaml
          # Not platform, and not in payload/platform/: the handover to the
          # workloads repository, kept apart so its blast radius is one app.
          - path: payload/workloads/application.yaml
  syncPolicy:
    # Otherwise every generated Application gains the resources finalizer.
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "{{ .metadata.name }}"
      namespace: argocd
    spec:
      # templatePatch cannot set the project.
      project: "{{ .spec.project }}"
      destination: {}
  templatePatch: |
    metadata:
      labels: {{ get .metadata "labels" | default dict | toJson }}
      annotations: {{ get .metadata "annotations" | default dict | toJson }}
      finalizers: {{ get .metadata "finalizers" | default list | toJson }}
    spec: {{ .spec | toJson }}
