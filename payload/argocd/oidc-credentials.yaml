---
# The OIDC client credentials ArgoCD uses against Authentik. The same values are
# read by Authentik's blueprint from the same OpenBao path, so both sides are
# declarative and neither has to be copied out of a UI after a rebuild.
#
# `argocd-cm` refers to these as $argocd-oidc:client-id and
# $argocd-oidc:client-secret; ArgoCD resolves a `$name:key` reference against
# any Secret labelled part-of argocd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        client-id: "{{ .clientId }}"
        client-secret: "{{ .clientSecret }}"
  data:
    - secretKey: clientId
      remoteRef: {key: authentik/config, property: argocd-client-id}
    - secretKey: clientSecret
      remoteRef: {key: authentik/config, property: argocd-client-secret}
