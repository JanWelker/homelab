---
global:
  domain: argo.infra.k8s.wlkr.ch
  # Would union with the Cilium policy and allow the server every ingress.
  networkPolicy:
    create: false
  # Pod-level; the config audit keys on it (KSV-0118).
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Applies to every component of this chart, not the redis-ha subchart, which
  # brings its own required rule. The chart fills in each component's own
  # labelSelector. See docs/platform/index.md#replica-placement
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      nodeTaintsPolicy: Honor

redis-ha:
  enabled: true
  # Ahead of the chart's frozen tag; see docs/platform/argocd.md#configuration
  image:
    # renovate: datasource=docker depName=ecr-public.aws.com/docker/library/redis versioning=docker
    tag: 8.10.1-alpine
  redis:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  sentinel:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  haproxy:
    # Drop once argo-cd vendors redis-ha >= 4.39.1 (DandyDeveloper/charts#424).
    image:
      # renovate: datasource=docker depName=ecr-public.aws.com/docker/library/haproxy versioning=docker
      tag: 3.4.4-alpine
    # 3 pods, hard anti-affinity, 3 nodes; see docs/platform/argocd.md#configuration
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 320Mi
  splitBrainDetection:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 1280Mi
    limits:
      memory: 4352Mi

server:
  replicas: 3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # The chart's route to argocd-server; see docs/platform/argocd.md#configuration
  httproute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: infra-gateway
        namespace: kube-system
        sectionName: https
    hostnames:
      - argo.infra.k8s.wlkr.ch
    rules:
      - filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              add:
                - name: Strict-Transport-Security
                  value: "max-age=31536000; includeSubDomains"
                - name: X-Content-Type-Options
                  value: "nosniff"
                - name: X-Frame-Options
                  value: "SAMEORIGIN"
                - name: Referrer-Policy
                  value: "strict-origin-when-cross-origin"
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

applicationSet:
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

configs:
  params:
    # TLS terminates at the Gateway; the chart routes to the plaintext port.
    server.insecure: true
  cm:
    url: https://argo.infra.k8s.wlkr.ch

    # Must not exceed the ApplicationSets' requeueAfterSeconds; see docs/platform/argocd.md
    timeout.reconciliation: 60s

    # Break-glass if Authentik is down: see docs/platform/argocd.md
    admin.enabled: "false"

    # The in-cluster Claude Code agents; see docs/platform/authentik.md#argocds-api-key-account
    accounts.claude: apiKey

    oidc.config: |
      name: Authentik
      issuer: https://auth.k8s.wlkr.ch/application/o/argocd/
      clientID: $argocd-oidc:client-id
      clientSecret: $argocd-oidc:client-secret
      requestedScopes:
        - openid
        - profile
        - email
      requestedIDTokenClaims:
        groups:
          essential: true

    resource.exclusions: |
      - apiGroups:
        - actions.github.com
        kinds:
        - AutoscalingListener
        - EphemeralRunnerSet
        - EphemeralRunner
        clusters:
        - "*"
    # Restores Application health (dropped in 1.8), so parents report children.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # The API server defaults group, kind and weight on every backend ref it
    # is given without them, and the Dependency-Track and OpenBao charts
    # render theirs that way. jq expressions rather than pointers because a
    # route may have more than one rule -- Dependency-Track splits /api from /
    # -- and a pointer names one index, which left rule 1 drifting forever.
    # parentRefs are not here: every route names the Gateway's group and kind,
    # so a changed parent shows up as the drift it is.
    resource.customizations: |
      gateway.networking.k8s.io/HTTPRoute:
        ignoreDifferences: |
          jqPathExpressions:
          - .spec.rules[].backendRefs[].group
          - .spec.rules[].backendRefs[].kind
          - .spec.rules[].backendRefs[].weight
          jsonPointers:
          - /spec/rules/0/matches

  rbac:
    # No access without a matching group, not read-only-everything.
    policy.default: ""
    policy.csv: |
      g, argocd-admins, role:admin
      g, argocd-viewers, role:readonly
      g, role:claude, role:readonly
      p, role:claude, applications, sync, apps/*, allow
      g, claude, role:claude
    scopes: "[groups, email]"
