---
global:
  domain: argo.infra.k8s.wlkr.ch
  # The chart's NetworkPolicy objects union with the CiliumNetworkPolicy in
  # payload/platform/security/network-policies/argocd.yaml, and one of them
  # allows the server every ingress. Off, so only the Cilium policy counts.
  networkPolicy:
    create: false
  # Pod-level; every container already sets the same, this closes the gap
  # the config audit keys on (KSV-0118). See docs/operations/vulnerabilities.md
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

redis-ha:
  enabled: true
  # Ahead of the chart's 8.6.4-alpine, frozen at its June build and so short of
  # the OpenSSL fix. Renovate keeps this on the newest patch; see gitops docs.
  image:
    # renovate: datasource=docker depName=ecr-public.aws.com/docker/library/redis versioning=docker
    tag: 8.10.1-alpine
  redis:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  sentinel:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  haproxy:
    # Ahead of the chart's 3.3.10-alpine, which carries three critical CVEs.
    # Drop once argo-cd vendors redis-ha >= 4.39.1 (DandyDeveloper/charts#424).
    image:
      # renovate: datasource=docker depName=ecr-public.aws.com/docker/library/haproxy versioning=docker
      tag: 3.4.4-alpine
    # maxSurge 0: 3 pods, hard anti-affinity, 3 nodes; see gitops docs.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 320Mi
  splitBrainDetection:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# controller has no resources yet: it grows with managed resources.
controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  replicas: 3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

applicationSet:
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

configs:
  cm:
    url: https://argo.infra.k8s.wlkr.ch

    # No webhook can reach a private address; poll instead. Must not exceed
    # the ApplicationSets' requeueAfterSeconds, see docs/platform/argocd.md
    timeout.reconciliation: 60s

    # Break-glass if Authentik is down: see docs/platform/authentik.md
    admin.enabled: "false"

    oidc.config: |
      name: Authentik
      issuer: https://auth.infra.k8s.wlkr.ch/application/o/argocd/
      clientID: $argocd-oidc:client-id
      clientSecret: $argocd-oidc:client-secret
      requestedScopes:
        - openid
        - profile
        - email
      requestedIDTokenClaims:
        groups:
          essential: true

    resource.exclusions: |
      - apiGroups:
        - actions.github.com
        kinds:
        - AutoscalingListener
        - EphemeralRunnerSet
        - EphemeralRunner
        clusters:
        - "*"
    # Restores Application health (dropped in 1.8), so parents report children.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    resource.customizations: |
      gateway.networking.k8s.io/HTTPRoute:
        ignoreDifferences: |
          jsonPointers:
          - /spec/parentRefs/0/group
          - /spec/parentRefs/0/kind
          - /spec/rules/0/backendRefs/0/group
          - /spec/rules/0/backendRefs/0/kind
          - /spec/rules/0/backendRefs/0/weight
          - /spec/rules/0/matches

  rbac:
    # No access without a matching group, not read-only-everything.
    policy.default: ""
    policy.csv: |
      g, argocd-admins, role:admin
      g, argocd-viewers, role:readonly
    scopes: "[groups, email]"
