---
global:
  domain: argo.infra.k8s.wlkr.ch

redis-ha:
  enabled: true
  redis:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  sentinel:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  haproxy:
    # maxSurge 0: 3 pods, hard anti-affinity, 3 nodes; see gitops docs.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 320Mi
  splitBrainDetection:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# controller has no resources yet: it grows with managed resources.
controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  replicas: 3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 3
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

applicationSet:
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

configs:
  cm:
    url: https://argo.infra.k8s.wlkr.ch

    # Break-glass if Authentik is down: see docs/platform/authentik.md
    admin.enabled: "false"

    oidc.config: |
      name: Authentik
      issuer: https://auth.infra.k8s.wlkr.ch/application/o/argocd/
      clientID: $argocd-oidc:client-id
      clientSecret: $argocd-oidc:client-secret
      requestedScopes:
        - openid
        - profile
        - email
      requestedIDTokenClaims:
        groups:
          essential: true

    resource.exclusions: |
      - apiGroups:
        - actions.github.com
        kinds:
        - AutoscalingListener
        - EphemeralRunnerSet
        - EphemeralRunner
        clusters:
        - "*"
    resource.customizations: |
      gateway.networking.k8s.io/HTTPRoute:
        ignoreDifferences: |
          jsonPointers:
          - /spec/parentRefs/0/group
          - /spec/parentRefs/0/kind
          - /spec/rules/0/backendRefs/0/group
          - /spec/rules/0/backendRefs/0/kind
          - /spec/rules/0/backendRefs/0/weight
          - /spec/rules/0/matches

  rbac:
    # No access without a matching group, not read-only-everything.
    policy.default: ""
    policy.csv: |
      g, argocd-admins, role:admin
      g, argocd-viewers, role:readonly
    scopes: "[groups, email]"
