---
global:
  domain: argo.infra.k8s.wlkr.ch

# Enable HA
redis-ha:
  enabled: true
  redis:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  sentinel:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  haproxy:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 320Mi
  splitBrainDetection:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# Memory limits below are sized from measured peak working set over the cluster's
# full Prometheus history, at roughly 2.5x. Requests are set at about the
# observed steady state. CPU requests but no CPU limits, which is the same
# pattern kured, external-dns, kubelet-csr-approver and metrics-server already
# use: a CPU limit throttles at the quota even on an idle node, while memory is
# not compressible and a limit there is what stops one workload taking a node
# down.
#
# The application-controller below is the exception to that confidence: its
# figure is marked NEEDS WORK and is the reason this branch is a draft.

controller:
  replicas: 1
  # NEEDS WORK -- do not merge on the strength of the number alone.
  # Measured peak 1639Mi over a 23h window with no Renovate batch and no Ceph
  # rebuild in it. The application-controller's working set scales with the
  # number of managed resources and with how much reconciliation is in flight,
  # so its quiet-day peak is not its peak. 4Gi is 2.5x of a figure that is
  # itself an underestimate.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi

server:
  replicas: 3
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 3
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

applicationSet:
  replicas: 2
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

configs:
  cm:
    url: https://argo.infra.k8s.wlkr.ch

    # The local admin account is disabled. With SSO in front of ArgoCD, leaving
    # it enabled would leave a shared password as a way around it, with no
    # audit trail and no way to revoke one person's access.
    #
    # It is the break-glass path if Authentik is unreachable:
    #   kubectl -n argocd patch cm argocd-cm --type merge \
    #     -p '{"data":{"admin.enabled":"true"}}'
    # See docs/platform/authentik.md.
    admin.enabled: "false"

    # Client ID and secret come from the same OpenBao path Authentik's
    # blueprint reads, so neither side has to be copied out of a UI.
    # `$name:key` resolves against a Secret labelled part-of: argocd.
    oidc.config: |
      name: Authentik
      issuer: https://auth.infra.k8s.wlkr.ch/application/o/argocd/
      clientID: $argocd-oidc:client-id
      clientSecret: $argocd-oidc:client-secret
      requestedScopes:
        - openid
        - profile
        - email
      requestedIDTokenClaims:
        groups:
          essential: true

    resource.exclusions: |
      - apiGroups:
        - actions.github.com
        kinds:
        - AutoscalingListener
        - EphemeralRunnerSet
        - EphemeralRunner
        clusters:
        - "*"
    resource.customizations: |
      gateway.networking.k8s.io/HTTPRoute:
        ignoreDifferences: |
          jsonPointers:
          - /spec/parentRefs/0/group
          - /spec/parentRefs/0/kind
          - /spec/rules/0/backendRefs/0/group
          - /spec/rules/0/backendRefs/0/kind
          - /spec/rules/0/backendRefs/0/weight
          - /spec/rules/0/matches

  rbac:
    # Nothing by default: an authenticated user with no matching group gets no
    # access rather than read-only-everything.
    policy.default: ""
    # Authentik group -> ArgoCD role.
    policy.csv: |
      g, argocd-admins, role:admin
      g, argocd-viewers, role:readonly
    scopes: "[groups, email]"
