---
# Applied once by make bootstrap-apps, then adopted by the platform
# ApplicationSet; no finalizer, see docs/architecture/gitops.md#sync-policy
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: system
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.1
      helm:
        valueFiles:
          - $values/payload/argocd/values.yaml
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/JanWelker/homelab.git
      targetRevision: HEAD
      path: payload/argocd
      directory:
        exclude: "{application.yaml,values.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
