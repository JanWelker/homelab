! FRR config for the UDM Pro: eBGP with the three Cilium control-plane nodes.
! Comments are only valid on their own line; FRR rejects trailing comments.
!
frr defaults traditional
!
router bgp 65000
 bgp router-id 10.9.0.1
 bgp ebgp-requires-policy
 !
 ! Cilium peers: localASN 65001 in payload/platform/cilium/bgp.yaml
 neighbor cilium peer-group
 neighbor cilium remote-as 65001
 neighbor 10.9.2.1 peer-group cilium
 neighbor 10.9.2.2 peer-group cilium
 neighbor 10.9.2.3 peer-group cilium
 !
 address-family ipv4 unicast
  maximum-paths 3
  neighbor cilium activate
  neighbor cilium soft-reconfiguration inbound
  neighbor cilium route-map ALLOW-ALL in
  neighbor cilium route-map ALLOW-ALL out
  neighbor cilium next-hop-self
 exit-address-family
exit
!
route-map ALLOW-ALL permit 10
exit
!
