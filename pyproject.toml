[project]
name = "flatcar"
version = "0.1.0"
description = "Bare-metal Kubernetes on Flatcar Container Linux: PXE boot server, Ansible provisioning and the ArgoCD payload"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14.8"
dependencies = [
    "ansible==14.4.0",
    "ansible-lint>=26.9.0",
    "pre-commit>=4.6.2",
    "tftpy==0.8.7",
]

[project.scripts]
boot-server = "boot_server.serve:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

# The package sits at the repository root, not under src/.
[tool.uv.build-backend]
module-name = "boot_server"
module-root = ""

[dependency-groups]
dev = [
    "zensical>=0.0.67",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "yamllint>=1.38.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
# The skill helper was never linted; the project code is boot_server/, scripts/ and tests/.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "SIM", "RUF"]
ignore = [
    "PLR2004", # a size threshold or a port number reads better inline than as a named constant
    "SIM300",  # tests assert MODULE.CONSTANT == expected; ruff reads the upper-case name as the constant
]

[tool.ruff.format]
quote-style = "single"
