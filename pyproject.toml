[project]
name = "flatcar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "ansible==14.4.0",
    "ansible-lint>=25.12.2",
    "pre-commit>=4.5.1",
    # Runtime dependency of boot_server/serve.py, which runs from its own image
    # and not from this environment. The pin is here so pylint can resolve the
    # import; boot_server/requirements.txt is what the image installs.
    "tftpy==0.8.7",
]

[dependency-groups]
dev = [
    "zensical>=0.0.59",
    "pylint>=4.0.4",
    "yamllint>=1.37.1",
]
