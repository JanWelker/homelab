[project]
name = "flatcar"
version = "0.1.0"
description = "Bare-metal Kubernetes on Flatcar Container Linux: PXE boot server, Ansible provisioning and the ArgoCD payload"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14.7"
dependencies = [
    "ansible==14.4.0",
    "ansible-lint>=26.8.0",
    "pre-commit>=4.6.2",
    "tftpy==0.8.7",
]

[dependency-groups]
dev = [
    "zensical>=0.0.59",
    "pylint>=4.0.4",
    "yamllint>=1.38.0",
]
