[project]
name = "flatcar"
version = "0.1.0"
description = "Bare-metal Kubernetes on Flatcar Container Linux: PXE boot server, Ansible provisioning and the ArgoCD payload"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14.7"
dependencies = [
    "ansible==14.4.0",
    "ansible-lint>=26.9.0",
    "pre-commit>=4.6.2",
    "tftpy==0.8.7",
]

[project.scripts]
boot-server = "boot_server.serve:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

# The package sits at the repository root, not under src/.
[tool.uv.build-backend]
module-name = "boot_server"
module-root = ""

[dependency-groups]
dev = [
    "zensical>=0.0.65",
    "pylint>=4.0.9",
    "pytest>=9.0.0",
    "yamllint>=1.38.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
