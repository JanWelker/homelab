---
# Fails on a version pin no Renovate manager tracks; see
# docs/development/maintenance.md#ci-workflows
name: Renovate Coverage
permissions:
  contents: read

"on":
  pull_request:
    paths:
      - "payload/**"
      - "ansible/**"
      - "scripts/**"
      - "Makefile"
      - ".github/**"
      - "renovate.json"
      - "pyproject.toml"
      - ".python-version"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

jobs:
  coverage:
    name: every pin tracked
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install renovate
        run: npm ci --ignore-scripts --prefix .github/tools

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      # Extraction runs offline and without a token; only the shared preset is fetched.
      - name: Check every pin is tracked
        run: uv run --no-project scripts/renovate-coverage.py
