---
# Fails on a version pin no Renovate manager tracks; see
# docs/development/maintenance.md#ci-workflows
name: Renovate Coverage
permissions:
  contents: read

"on":
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    name: every pin tracked
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install renovate
        run: npm ci --ignore-scripts --prefix .github/tools

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      # Extraction runs offline; the token only lifts the anonymous rate limit
      # on the one request, the shared preset, that hosted runners share.
      - name: Check every pin is tracked
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: uv run --no-project scripts/renovate-coverage.py
