---
# Scans only the images a pull request changes and fails on a fixable CRITICAL
# the replaced image did not carry. Existing findings that wait on a release
# do not block the bump that gets closer to it. See docs/development/maintenance.md
name: Image Scan
permissions:
  contents: read

"on":
  pull_request:
    paths:
      - "payload/**"
      - "scripts/image-scan-diff.py"
      - ".github/workflows/image-scan.yaml"
  workflow_dispatch:

jobs:
  scan:
    name: trivy on changed images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: head
          persist-credentials: false

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1

      # PyYAML comes from uv.lock, hash-checked, at the version Renovate tracks.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Scan changed images
        run: uv run --locked --no-dev --project head python head/scripts/image-scan-diff.py base head
