---
# Fails a pull request whose commits add a secret. workflow_dispatch scans the
# whole history. Same gitleaks version as the pre-commit hook; renovate.json
# bumps both.
name: Secret Scan
permissions:
  contents: read

"on":
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: >-
            git --redact --no-banner --verbose
            ${{ github.event_name == 'pull_request'
                && format('--log-opts={0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || '' }}
            .
