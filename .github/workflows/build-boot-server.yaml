---
name: Build Boot Server Image

"on":
  push:
    branches:
      - "main"
    paths:
      - "boot_server/**"
      - ".github/workflows/build-boot-server.yaml"
  pull_request:
    paths:
      - "boot_server/**"
      - ".github/workflows/build-boot-server.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "build-boot-server-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signs the provenance attestation build-push-action attaches by default.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Pull requests build and throw the result away. A fork PR has no write
      # access to the registry, and a branch that could publish an image the
      # cluster then pulls is not a review step.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the repository name on the way in -- GHCR rejects the
      # capital J in JanWelker/homelab.
      - name: Collect tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/boot-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # amd64 only: it runs on the x86 boot host and on the cluster's own
      # nodes. Building it for anything else would be building it for a machine
      # that cannot serve PXE -- see the macOS note in the docs.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: boot_server
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
