---
name: Preview Documentation

"on":
  pull_request:
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "closed"
    # Keep in step with docs.yaml: this is the only strict build a PR gets.
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      # The site builder itself: a Zensical bump must rebuild too.
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/preview.yaml"

permissions:
  contents: read

concurrency:
  group: "pr-preview-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  # The strict build runs for every pull request, forks included, with a
  # read-only token. The preview job below deploys its artifact and runs no
  # dependency code itself.
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      - name: Build site
        run: |
          uv python install
          uv sync --locked --all-extras --dev
          uv run zensical build --clean --strict

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview:
    needs: build
    # Fork PRs have no write access, so the deploy would fail. On "closed"
    # the build is skipped and this job still runs, to remove the preview.
    if: >-
      ${{ !cancelled()
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action == 'closed' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The deploy action needs a work tree; it pushes with its own token.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      # On "closed" this removes the preview instead of publishing one.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
