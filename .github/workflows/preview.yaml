---
name: Preview Documentation

"on":
  pull_request:
    types:
      - "opened"
      - "reopened"
      - "synchronize"
      - "closed"
    # Keep in step with docs.yaml: this is the only strict build a PR gets.
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      # The site builder itself: a Zensical bump must rebuild too.
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/preview.yaml"

permissions:
  contents: read

concurrency:
  group: "pr-preview-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  # The strict build runs for every pull request, forks included; only the
  # preview deploy below needs write access.
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"

      - name: Build site
        run: |
          uv python install
          uv sync --locked --all-extras --dev
          uv run zensical build --clean --strict

  preview:
    needs: build
    # Fork PRs have no write access, so the deploy would fail. On "closed"
    # the build is skipped and this job still runs, to remove the preview.
    if: >-
      ${{ !cancelled()
          && github.event.pull_request.head.repo.full_name == github.repository
          && (github.event.action == 'closed' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"

      - name: Build site
        if: github.event.action != 'closed'
        run: |
          uv python install
          uv sync --locked --all-extras --dev
          uv run zensical build --clean --strict

      # On "closed" this removes the preview instead of publishing one.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
