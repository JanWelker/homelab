---
name: Argo CD Diff Preview

"on":
  pull_request:
    paths:
      - "payload/**"
      - ".github/workflows/argo-diff-preview.yaml"
      - ".github/argo-diff-preview/**"

jobs:
  build:
    # Fork PRs get a read-only token, so the comment step would only fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pull-request
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Generate Diff
        run: |
          # The chart version the cluster runs, read the way the Makefile does.
          ARGOCD_CHART_VERSION=$(awk '/chart:/{f=1} f&&/targetRevision:/{print $2; exit}' \
            pull-request/payload/argocd/application.yaml)
          # The Argo CD config comes from main: a PR's own values.yaml could
          # add a config-management plugin that runs in this privileged container.
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD"/main:/base-branch \
            -v "$PWD"/pull-request:/target-branch \
            -v "$PWD"/output:/output \
            -v "$PWD"/main/.github/argo-diff-preview/values.yaml:/argocd-config/values.yaml \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e REPO=${{ github.repository }} \
            dagandersen/argocd-diff-preview:v0.2.17@sha256:ea90848df29337b50d5058330210b38e39232360b78d9c60951fc92e454c6941 \
            --argocd-chart-version="$ARGOCD_CHART_VERSION" \
            --auto-detect-files-changed=true \
            --watch-if-no-watch-pattern-found=false

      - name: Post diff as comment
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
