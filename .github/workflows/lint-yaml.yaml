---
name: Lint YAML
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/*.yaml"
      - ".yamllint"
  pull_request:
    paths:
      - "**/*.yaml"
      - ".yamllint"
  workflow_dispatch:

jobs:
  yaml-lint:
    name: YAML
    runs-on: ubuntu-latest
    container: python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # A directory, not a glob: under bash `**` is `*`, so `**/*.yaml` named
      # exactly one file, which .yamllint ignores, and this job passed on
      # anything. The ignore list in .yamllint keeps .venv/ and site/ out.
      - name: Run yamllint
        run: uv run yamllint -f github .
