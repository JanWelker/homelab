---
name: Lint Markdown
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown
    runs-on: ubuntu-latest
    container: node:26.12.1-alpine@sha256:40cd011b55415bc894e45b02fdd5a5dfde056921b7d23a64c74f80497af48797
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same version as the pre-commit hook; renovate.json bumps both.
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.24.0

      - name: Run markdownlint
        run: markdownlint-cli2 '**/*.md' '!**/.venv' '!.agent'
