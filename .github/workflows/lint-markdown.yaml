---
name: Lint Markdown
permissions:
  contents: read

"on":
  push:
    branches:
      - "main"
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown
    runs-on: ubuntu-latest
    container: node:26.13.0-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same version as the pre-commit hook; renovate.json bumps both.
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.24.0

      - name: Run markdownlint
        run: markdownlint-cli2 '**/*.md' '!**/.venv' '!.agent'
